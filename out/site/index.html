 FFS: Conditions |\n| TRP-UE bi-static | UE type for sensing | Companies to report |\n|  | Timing/frequency error | Option 1: Ideal (baseline) Option 2: With error, FFS value range and model of the distribution Note: timing error and frequency error are individually determined |\n|  | Availability of UE location, velocity and orientation | Option 1: Known, ideally (baseline) Option 2: Known, with error. FFS distribution of error in each aspect (e.g. location, speed, orientation). Option 3: Unknown, rely on actual measurement Note: UE location, velocity and orientation are individually determined |\n|  | Coherency and phase continuity among symbols within a CPI | Option 1: Always coherent Option 2: Coherency is assumed under some conditions; FFS: Conditions |\n| UE-TRP bi-static | UE type for sensing | Companies to report |\n|  | Timing/frequency error | Option 1: Ideal (baseline) Option 2: With error, FFS value range and model of the distribution Note: timing error and frequency error are individually determined |\n|  | Availability of UE location, velocity and orientation | Option 1: Known, ideally (baseline) Option 2: Known, with error. FFS distribution of error in each aspect (e.g. location, speed, orientation). Option 3: Unknown, rely on actual measurement Note: UE location, velocity and orientation are individually determined |\n|  | Coherency and phase continuity among symbols within a CPI | Option 1: Always coherent Option 2: Coherency is assumed under some conditions; FFS: Conditions |\nFinal summary in R1-2602522.", "wg": "RAN1"}, {"agenda_item": "10.8.1", "agenda_title": "Evaluations", "content_hash": "sha256:16ea78f397133fd827fa98c96dfceaf67aacbcac43e1ddc0caf5a78d86743512", "depth": "full", "era": "6G", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-124b-10.8.1-c001", "impact": null, "kind": "conclusion", "llm_status": "pending", "meeting": 124, "meeting_end": null, "meeting_suffix": "b", "release": "Rel-20", "seq": 1, "source": {"minutes_version": 100, "para": 4436}, "summary_zh": null, "tags": [], "text_en": "For Rel-20 6G ISAC evaluation, the attributes (e.g. antenna pattern, mobility, etc.) of different UEs are for the purpose of evaluation discussion. No intention to study or specify diverse device type.\nR1-2602519\tFL summary #2 on ISAC evaluations\tModerator (CATT)\nR1-2602520\tFL summary #3 on ISAC evaluations\tModerator (CATT)\nR1-2602521\tFL summary #4 on ISAC evaluations\tModerator (CATT)\nFrom Thursday session", "wg": "RAN1"}, {"agenda_item": "10.8.1", "agenda_title": "Evaluations", "content_hash": "sha256:2444e099665e3ac83967a85450d616c8556cc60e4d8aaf41572f5646b1bd1088", "depth": "full", "era": "6G", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-124b-10.8.1-w001", "impact": null, "kind": "working_assumption", "llm_status": "pending", "meeting": 124, "meeting_end": null, "meeting_suffix": "b", "release": "Rel-20", "seq": 1, "source": {"minutes_version": 100, "para": 4432}, "summary_zh": null, "tags": [], "text_en": "For Rel-20 6G ISAC performance evaluation,\nevaluate object detection and/or tracking for the following sensing targets/objects: UAV, human, vehicle, AGV;\ndiscuss further on evaluation on communication assistance.", "wg": "RAN1"}, {"agenda_item": "10.8.2", "agenda_title": "Aspects of integration with communication", "content_hash": "sha256:3454d2acee6a02df6fcb3883d0b7b15f409f5d16698790f89921f071fb552701", "depth": "full", "era": "6G", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-124b-10.8.2-a001", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 124, "meeting_end": null, "meeting_suffix": "b", "release": "Rel-20", "seq": 1, "source": {"minutes_version": 100, "para": 4513}, "summary_zh": null, "tags": [], "text_en": "On RS for ISAC, study at least the following aspects, considering sensing performance, resource overhead and impact to communication\nRS for communication is reused for sensing\nEnhanced RS for sensing, taking reuse of RS for communication as starting point\nNote: Part of or all of the RS may be used for communication purpose, and it does not mean the final decision on whether the enhanced RS is used for communication purpose is to be made in this agenda.\nDedicated RS for sensing", "wg": "RAN1"}, {"agenda_item": "10.8.2", "agenda_title": "Aspects of integration with communication", "content_hash": "sha256:81b819604e906bcadb4e5ffebaf008f18d06c6ca34517ba75d43b38f23c831ee", "depth": "full", "era": "6G", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-124b-10.8.2-a002", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 124, "meeting_end": null, "meeting_suffix": "b", "release": "Rel-20", "seq": 2, "source": {"minutes_version": 100, "para": 4519}, "summary_zh": null, "tags": [], "text_en": "Study RE patterns of RS for sensing, considering sensing performance, resource overhead and impact to communication.\nNote: enhancements on RS sequence if any will be discussed in agenda 10.8.3.\nR1-2602591\tSummary #3 on integration with communication for ISAC\tModerator (Xiaomi)\nFrom Thursday session", "wg": "RAN1"}, {"agenda_item": "10.8.2", "agenda_title": "Aspects of integration with communication", "content_hash": "sha256:8acda5c9d5df2c3b0e1a7db1686b6c89c8c03757246a02e64e41109c452399cc", "depth": "full", "era": "6G", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-124b-10.8.2-a003", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 124, "meeting_end": null, "meeting_suffix": "b", "release": "Rel-20", "seq": 3, "source": {"minutes_version": 100, "para": 4524}, "summary_zh": null, "tags": [], "text_en": "On measurement for ISAC, study at least the following aspects.\nMeasurement definitions/levels for TRP-side measurement, taking the measurement Levels studied in NR ISAC as starting point\nMeasurement definitions/levels for UE-side measurement\nImpacts of non-ideal factors on measurement\nOther aspects are not precluded\nNote: this discussion may or may not mean there is specification impact", "wg": "RAN1"}, {"agenda_item": "10.8.2", "agenda_title": "Aspects of integration with communication", "content_hash": "sha256:904bef30062ba7050b74bf412f53c230a15f001b8656857f274e2cf7e5658703", "depth": "full", "era": "6G", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-124b-10.8.2-a004", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 124, "meeting_end": null, "meeting_suffix": "b", "release": "Rel-20", "seq": 4, "source": {"minutes_version": 100, "para": 4531}, "summary_zh": null, "tags": [], "text_en": "On measurement report for ISAC, study at least the following aspects and applicable scenarios (e.g., sensing modes, targets, etc.) from RAN1 perspective.\nMeasurement reporting mechanism from UE\nOption 1A: The UE measurements and/or assistance information if needed from UE can be directly sent to aNB\nOption 1B: The UE measurements and/or assistance information if needed from UE can be sent to SF\nMeasurement reporting mechanism from aNB\nOption 2A: The aNB measurements and/or assistance information if needed from aNB can be directly sent to UE\nOption 2B: The aNB measurements and/or assistance information if needed from aNB can be sent to SF\nThe study may require cross-WG coordination.\nNote: combination of multiple options is not precluded.\nNote: measurements in each option may be different", "wg": "RAN1"}, {"agenda_item": "10.8.2", "agenda_title": "Aspects of integration with communication", "content_hash": "sha256:e1c42192d9ab362a0a8db4ce70a655d55a8e6bc80516bfe6a036938b99281821", "depth": "full", "era": "6G", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-124b-10.8.2-a005", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 124, "meeting_end": null, "meeting_suffix": "b", "release": "Rel-20", "seq": 5, "source": {"minutes_version": 100, "para": 4542}, "summary_zh": null, "tags": [], "text_en": "On measurement report for ISAC, study impacts from at least the following aspects from RAN1 perspective\nMeasurement reporting mechanism\nE.g., Periodic, semi-persistent, aperiodic, event-triggered report as starting point\nReporting signaling e.g., L1, L2, higher layer, etc.\nOther aspects are not precluded\nThe study may require cross-WG coordination.\nFinal summary in R1-2602592.", "wg": "RAN1"}, {"agenda_item": "10.8.3", "agenda_title": "Waveform and frame structure", "content_hash": "sha256:bdb08d833adca7c8c201338738bb0afa3135dddc260cdec9d47198a986b56936", "depth": "full", "era": "6G", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-124b-10.8.3-a001", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 124, "meeting_end": null, "meeting_suffix": "b", "release": "Rel-20", "seq": 1, "source": {"minutes_version": 100, "para": 4602}, "summary_zh": null, "tags": [], "text_en": "CP-OFDM waveform as defined for 6GR is the starting point for 6G ISAC waveform study.\nStudy on enhancements on CP-OFDM or other waveforms is not precluded.", "wg": "RAN1"}, {"agenda_item": "10.8.3", "agenda_title": "Waveform and frame structure", "content_hash": "sha256:7adcc24b380ee561bfda28fd6161357699c0275736f16e3636f3a20fd0b3f8ea", "depth": "full", "era": "6G", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-124b-10.8.3-a002", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 124, "meeting_end": null, "meeting_suffix": "b", "release": "Rel-20", "seq": 2, "source": {"minutes_version": 100, "para": 4605}, "summary_zh": null, "tags": [], "text_en": "6GR communication frame structure is the starting point for 6G ISAC frame structure study, in at least the following aspects.\nFrame/sub-frame/slot/symbol structure\nCP length\nSCS\nEnhancements on frame structure/above aspects are not precluded.", "wg": "RAN1"}, {"agenda_item": "10.8.3", "agenda_title": "Waveform and frame structure", "content_hash": "sha256:dd36fc305ff0fa7f7935ea7c4bb4b969e6e59bab9433be7e1e31063445f1d678", "depth": "full", "era": "6G", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-124b-10.8.3-a003", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 124, "meeting_end": null, "meeting_suffix": "b", "release": "Rel-20", "seq": 3, "source": {"minutes_version": 100, "para": 4611}, "summary_zh": null, "tags": [], "text_en": "Companies are encouraged to provide views on necessity/pros/cons/metrics of LLS and/or SLS and pros/cons/metrics of theoretical waveform characteristics analysis, for evaluation of ISAC waveform and/or integration with communication, to RAN1#125 meeting.", "wg": "RAN1"}, {"agenda_item": "10.8.3", "agenda_title": "Waveform and frame structure", "content_hash": "sha256:464ea2522d42b9bfbfd331934b88299e9d5d6d7fbeade89b875343a051a1e744", "depth": "full", "era": "6G", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-124b-10.8.3-a004", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 124, "meeting_end": null, "meeting_suffix": "b", "release": "Rel-20", "seq": 4, "source": {"minutes_version": 100, "para": 4613}, "summary_zh": null, "tags": [], "text_en": "CP-OFDM is used as the benchmark for evaluating the benefits of sensing waveforms.\nR1-2602984\tSummary #4 on waveform and frame structure for 6G ISAC\tLG Electronics\nPresented in Thursday session.\nFinal summary in R1-2602985.", "wg": "RAN1"}, {"agenda_item": "8.1", "agenda_title": "Maintenance on Artificial Intelligence (AI)/Machine Learning (ML) for NR Air Interface", "content_hash": "sha256:689cd133733db4c8033308bcfbc0df668949533bb905eb546544c6a3a5433507", "depth": "origin", "era": "5G-A", "feature": "ai_air_interface", "first_seen": "2026-10-08", "id": "RAN1-124b-8.1-a001", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 124, "meeting_end": null, "meeting_suffix": "b", "release": "Rel-19", "seq": 1, "source": {"minutes_version": 100, "para": 361}, "summary_zh": null, "tags": [], "text_en": "The following TP for TS 38.212 Clause 6.3.1.1.2 is endorsed.\nReason for change: For P/SP CSI reporting on PUCCH for performance monitoring, it is possible that the number of information bits of RS-PAI becomes less than 3 bits. However, NR specifications do not support PUCCH carrying 1 or 2 information bits other than HARQ-ACK/SR.\nSummary of change: For P/SP CSI reporting on PUCCH for performance monitoring, the number of information bits of related CSI is zero padded to 3 bits.\nConsequences if not approved: For P/SP CSI reporting on PUCCH for performance monitoring, 1-bit or 2-bit payload size of RS-PAI is not supported.\n| 6.3.1.1.2 CSI only \u003comitted texts> If none of the CSI reports for transmission on a PUCCH is of two parts, the CSI fields of all CSI reports, in the order from upper part to lower part in Table 6.3.1.1.2-12, are mapped to the UCI bit sequence starting with . The most significant bit of each field is mapped to the lowest order information bit for that field, e.g. the most significant bit of the first field is mapped to. If the length of UCI bit sequence is less than 3 bits, zeros shall be appended to the UCI bit sequence until its length equals 3. Table 6.3.1.1.2-12: Mapping order of CSI reports to UCI bit sequence , without two-part CSI report(s) \u003comitted texts> |\n| --- |\nUCI bit sequence\nCSI report number\nCSI report #1\nas in Table 6.3.1.1.2-7/7A/7B/8/8A/8B/8C/8D/8E/8F/8G/8H\nCSI report #2\nas in Table 6.3.1.1.2-7/7A/7B/8/8A/8B/8C/8D/8E/8F/8G/8H\n…\nCSI report #n\nas in Table 6.3.1.1.2-7/7A/7B/8/8A/8B/8C/8D/8E/8F/8G/8H\nNOTE:\tFor a CSI report #i containing  CSI sub-reports, where , all CSI sub-reports within the CSI report #i are mapped to the corresponding segment of the UCI bit sequence of CSI report #i, from upper part to lower part of the segment, in increasing order of CSI sub-report number. CSI sub-report #1, CSI sub-report #2, …, CSI sub-report # correspond to the CSI sub-reports in increasing order of reportSubConfigId.\nThe corresponding final CR in:\nR1-2603378\tCorrection on AI/ML for beam management in TS38212\tModerator (Samsung), NEC, LG Electronics\n(Rel-19, 38.212, NR_AIML_air-Core, CR0246, Cat F) is agreed.", "wg": "RAN1"}, {"agenda_item": "8.1", "agenda_title": "Maintenance on Artificial Intelligence (AI)/Machine Learning (ML) for NR Air Interface", "content_hash": "sha256:c694a4be350a7566e61c214317202dff4d9468e18115cf322b6c98eeffc7929e", "depth": "origin", "era": "5G-A", "feature": "ai_air_interface", "first_seen": "2026-10-08", "id": "RAN1-124b-8.1-a002", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 124, "meeting_end": null, "meeting_suffix": "b", "release": "Rel-19", "seq": 2, "source": {"minutes_version": 100, "para": 370}, "summary_zh": null, "tags": [], "text_en": "The following TP for TS 38.214 Clause 5.2.1.6 is endorsed.\nReason for change: CPU duration for beam management related UE-side data collection is not captured correctly. In current specification, periodic CSI report for UE-side data collection for beam management is not supported.", "wg": "RAN1"}, {"agenda_item": "8.1", "agenda_title": "Maintenance on Artificial Intelligence (AI)/Machine Learning (ML) for NR Air Interface", "content_hash": "sha256:fa9e3dddc87e29f98ce08991cf96e43c699fde69bedbea4325a14e45f39d3324", "depth": "origin", "era": "5G-A", "feature": "ai_air_interface", "first_seen": "2026-10-08", "id": "RAN1-124b-8.1-a003", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 124, "meeting_end": null, "meeting_suffix": "b", "release": "Rel-19", "seq": 3, "source": {"minutes_version": 100, "para": 373}, "summary_zh": null, "tags": [], "text_en": "For UE-sided model, regarding the resource type for data collection purpose, only always-on SSB and P/SP CSI-RS are supported.", "wg": "RAN1"}, {"agenda_item": "8.1", "agenda_title": "Maintenance on Artificial Intelligence (AI)/Machine Learning (ML) for NR Air Interface", "content_hash": "sha256:73c7ffd697c022188f34c82488eefd14df42fcaf763f1da53b5e0a45c05bb0c2", "depth": "origin", "era": "5G-A", "feature": "ai_air_interface", "first_seen": "2026-10-08", "id": "RAN1-124b-8.1-a004", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 124, "meeting_end": null, "meeting_suffix": "b", "release": "Rel-19", "seq": 4, "source": {"minutes_version": 100, "para": 373}, "summary_zh": null, "tags": [], "text_en": "For UE-sided model, regarding a CSI-ReportConfig for data collection,\nReuse the existing CPU occupation time for a CSI report with CSI-ReportConfig with reportQuantity set to 'none' and TRS-info not configured\nSummary of change: Reflect the RAN1 agreements accurately in Section 5.2.1.6 of TS 38.214. Include periodic CSI report for UE-side data collection for beam management.\nConsequence if not approved: Incorrect UE behaviour for CPU duration for UE-side data collection for training.\n| 5.2.1.6 CSI processing criteria \u003c Unchanged parts are omitted > For a CSI report with CSI-ReportConfig with higher layer parameter reportQuantity set to 'none' and CSI-RS-ResourceSet with higher layer parameter trs-Info not configured, or reportQuantity set to 'none-bm-r19', the CPU(s) are occupied for a number of OFDM symbols as follows: - A semi-persistent CSI report (excluding an initial semi-persistent CSI report on PUSCH after the PDCCH triggering the report) occupies CPU(s) from the first symbol of the earliest one of each transmission occasion of periodic or semi-persistent CSI-RS/SSB resource for channel measurement for L1-RSRP computation, until symbols after the last symbol of the latest one of the CSI-RS/SSB resource for channel measurement for L1-RSRP computation in each transmission occasion. - An aperiodic CSI report occupies CPU(s) from the first symbol after the PDCCH triggering the CSI report until the last symbol between symbols after the first symbol after the PDCCH triggering the CSI report and symbols after the last symbol of the latest one of each CSI-RS/SSB resource for channel measurement for L1-RSRP computation. For a CSI report with CSI-ReportConfig with higher layer parameter reportQuantity set to 'none-csi-r19', the CPU(s) are occupied for a number of OFDM symbols as follows: - CSI report occupies CPU(s) from the first symbol of each transmission occasion of periodic or semi-persistent CSI-RS resource for channel measurement, until symbols after the transmission occasion of periodic or semi-persistent CSI-RS resource for channel measurement. where are defined in the table 5.4-2. For a CSI report with CSI-ReportConfig with higher layer parameter reportQuantity set to 'none-bm-r19', the CPU(s) are occupied for a number of OFDM symbols as follows: - CSI report occupies CPU(s) from the first symbol of the earliest one of each transmission occasion of periodic or semi-persistent CSI-RS/SSB resource for channel measurement for L1-RSRP computation, until symbols after the last symbol of the latest one of the CSI-RS/SSB resource for channel measurement for L1-RSRP computation in each transmission occasion. where are defined in the table 5.4-2. \u003c Unchanged parts are omitted > |\n| --- |\nThe corresponding final CR in:\nR1-2603379\tCorrection on AI/ML for beam management in TS38214\tModerator (Samsung), ZTE, Pengcheng Laboratory, LG Electronics\n(Rel-19, 38.214, NR_AIML_air-Core, CR0751, Cat F) is agreed.", "wg": "RAN1"}, {"agenda_item": "8.1", "agenda_title": "Maintenance on Artificial Intelligence (AI)/Machine Learning (ML) for NR Air Interface", "content_hash": "sha256:8e3f50e2d23a27b2867d27c01292e3916f62478a9bb60a6b530db5f63272f8d2", "depth": "origin", "era": "5G-A", "feature": "ai_air_interface", "first_seen": "2026-10-08", "id": "RAN1-124b-8.1-c001", "impact": null, "kind": "conclusion", "llm_status": "skipped_by_depth", "meeting": 124, "meeting_end": null, "meeting_suffix": "b", "release": "Rel-19", "seq": 1, "source": {"minutes_version": 100, "para": 380}, "summary_zh": null, "tags": [], "text_en": "There is no RAN1 consensus on the following:\nFor virtual resource blocks mapping of PDSCH in TS38.211, rate matching of the resource elements in the corresponding physical resource blocks are not performed around the NZP CSI-RS only configured in Set A for CSI report for inference.\nFinal summary in R1-2603261.", "wg": "RAN1"}, {"agenda_item": "9.1.1", "agenda_title": "CSI spatial/frequency compression without temporal aspects (“Case 0”)", "content_hash": "sha256:659d6ff53ee1bd15879bbcda7229edf8235f52d01072bf1f111a90bb14cac7df", "depth": "origin", "era": "5G-A", "feature": "ai_air_interface", "first_seen": "2026-10-08", "id": "RAN1-124b-9.1.1-a001", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 124, "meeting_end": null, "meeting_suffix": "b", "release": "Rel-19", "seq": 1, "source": {"minutes_version": 100, "para": 952}, "summary_zh": null, "tags": [], "text_en": "For the standardized SQ codebook when NW does not exchange a codebook, support [1/8, 3/8, 5/8, 7/8] for Q=2 and [1/4, 3/4] for Q=1.", "wg": "RAN1"}, {"agenda_item": "9.1.1", "agenda_title": "CSI spatial/frequency compression without temporal aspects (“Case 0”)", "content_hash": "sha256:59cb6f2ef12742447e2cd52137e94254c383138e670d1d79c21faa80ef67c229", "depth": "origin", "era": "5G-A", "feature": "ai_air_interface", "first_seen": "2026-10-08", "id": "RAN1-124b-9.1.1-a002", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 124, "meeting_end": null, "meeting_suffix": "b", "release": "Rel-19", "seq": 2, "source": {"minutes_version": 100, "para": 954}, "summary_zh": null, "tags": [], "text_en": "For precoding matrix feedback via two-sided model, support upto 128 ports, upto rank 4 and upto 19 subbands.", "wg": "RAN1"}, {"agenda_item": "9.1.1", "agenda_title": "CSI spatial/frequency compression without temporal aspects (“Case 0”)", "content_hash": "sha256:a4620f60cfffbecce489dd026264270653e3d12659b2737f3ff21d016d4daf10", "depth": "origin", "era": "5G-A", "feature": "ai_air_interface", "first_seen": "2026-10-08", "id": "RAN1-124b-9.1.1-a003", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 124, "meeting_end": null, "meeting_suffix": "b", "release": "Rel-19", "seq": 3, "source": {"minutes_version": 100, "para": 956}, "summary_zh": null, "tags": [], "text_en": "Support two-part UCI for CSI feedback via two-sided model, where\nUCI part 1 contains CQI, RI and CRI.\nUCI part 2 contains the PMI (i.e., CSI feedback of all layers).\nLayer 1 to  are mapped to Group 1, Layer  to layer  are mapped to Group 2.\nNote: The bits sequence is mapped based on their indices inside each layer, followed by the bit sequence of the next layer. The layers are ordered from the strongest to the weakest.\nR1-2602997\tFL summary 2 on 9.1.1 for CSI compression via two-sided model\tQualcomm Incorporated\nFrom Wednesday session", "wg": "RAN1"}, {"agenda_item": "9.1.1", "agenda_title": "CSI spatial/frequency compression without temporal aspects (“Case 0”)", "content_hash": "sha256:f26e117c6467e75721cf923d813e56298407a83b05d50f5310cdf55cbeb04561", "depth": "origin", "era": "5G-A", "feature": "ai_air_interface", "first_seen": "2026-10-08", "id": "RAN1-124b-9.1.1-a004", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 124, "meeting_end": null, "meeting_suffix": "b", "release": "Rel-19", "seq": 4, "source": {"minutes_version": 100, "para": 964}, "summary_zh": null, "tags": [], "text_en": "For NW side data collection, support target CSI quantization\nDown-selection between 1a (real-imaginary) and 1b (amplitude-phase), i.e., {1a-33, 1b-34}.\nR1-2602998\tFL summary 3 on 9.1.1 for CSI compression via two-sided model\tQualcomm Incorporated\nPresented in Thursday session.\nR1-2602999\tFL summary 4 on 9.1.1 for CSI compression via two-sided model\tQualcomm Incorporated\nFrom Friday session\nPotential agreement from session notes in R1-2603273:\nFor performance monitoring:\nSupport using paired CSI feedback and target CSI samples for performance monitoring\nSupport using L3 signaling framework to collect at least target CSI samples.\nDetailed signaling upto RAN2\nFFS how to associate target CSI sample with CSI feedback sample.\nSupport using L1 signalling\nFFS: Details of L1 signalling\nUE assisted monitoring\nTarget CSI reporting via L1 signaling with legacy PMI codebook\nTarget CSI reporting using L1 signaling with high resolution quantization of partial target CSI\nStrong concern from Nokia and CATT\nNokia and CATT state that Network sides performance monitoring can be supported by implementation means which makes this proposal or any specification impact is not needed.\nOther companies claim based on WID, we have to specify performance monitoring.\nCSI feedback enhancement, encompassing (two-sided model) [RAN1, RAN2]:\nCSI spatial/frequency compression without temporal aspects (“Case 0”),\nSpecify necessary signalling/mechanism(s) as per the identified potential specification impacts in FS_NR_AIML_Air , including:\nModel pairing procedure including ID and applicability reporting\nInference aspects including target CSI type, measurement and report configuration, CQI RI determination, payload determination, quantization configuration codebook, UCI mapping, CSI processing criteria and timeline, priority rules for CSI reports\nNW and UE side data collection for training,\nTarget CSI format\nNote The framework defined in BM and CSI prediction use cases could be reused\nSpecify performance monitoring\nFrom Friday session", "wg": "RAN1"}, {"agenda_item": "9.1.1", "agenda_title": "CSI spatial/frequency compression without temporal aspects (“Case 0”)", "content_hash": "sha256:0599748c96342b03b34b3b781573d11de0522c0740293ad0029904f17c9bf526", "depth": "origin", "era": "5G-A", "feature": "ai_air_interface", "first_seen": "2026-10-08", "id": "RAN1-124b-9.1.1-a005", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 124, "meeting_end": null, "meeting_suffix": "b", "release": "Rel-19", "seq": 5, "source": {"minutes_version": 100, "para": 995}, "summary_zh": null, "tags": [], "text_en": "For performance monitoring:\nSupport using paired CSI feedback and target CSI samples for performance monitoring, and further investigate the feasibility of following options and downselect one,\nOption 1: Support using L3 signaling framework to collect target CSI samples.\nCompanies to report details about how to associate target CSI sample with CSI feedback sample.\nOption 2: Support using L1 signalling, considering\nUE assisted monitoring\nCSI reporting via L1 signaling with legacy PMI codebook\nCSI reporting using L1 signaling with high resolution quantization of partial target CSI", "wg": "RAN1"}, {"agenda_item": "9.1.2", "agenda_title": "Inter-vendor training collaboration for two-sided AI/ML models", "content_hash": "sha256:eb0d1430410c87204e33a02ca306d1a915c8a98f418e11b743b2c432c0114277", "depth": "origin", "era": "5G-A", "feature": "ai_air_interface", "first_seen": "2026-10-08", "id": "RAN1-124b-9.1.2-a001", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 124, "meeting_end": null, "meeting_suffix": "b", "release": "Rel-19", "seq": 1, "source": {"minutes_version": 100, "para": 1044}, "summary_zh": null, "tags": [], "text_en": "For Option 4-1 under Direction A in AI/ML based CSI compression, when the target CSI is precoding matrix with port-subband domain representation and the target CSI set k is associated with  set of CSI feedback set,\nSupport per-layer CSI feedback payload parameter pair\nFor layer 1/2/3, support {32, 2}, {64, 2}, {96,2}, {128, 2}, {192, 2}, {32,1}\nFor layer 4, support {32, 2}, {64, 2}, {96,2}, {32,1}\nFFS: The number of layers in the CSI feedback set is \u003c= the number of layers in the target CSI set.\nNote: NW may only exchange a subset of the CSI feedback payload from the list.", "wg": "RAN1"}, {"agenda_item": "9.1.2", "agenda_title": "Inter-vendor training collaboration for two-sided AI/ML models", "content_hash": "sha256:12dad00ab78b2beef41f753aee1e0b9f95417ed402fff6defbd87b84067fc7e7", "depth": "origin", "era": "5G-A", "feature": "ai_air_interface", "first_seen": "2026-10-08", "id": "RAN1-124b-9.1.2-a002", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 124, "meeting_end": null, "meeting_suffix": "b", "release": "Rel-19", "seq": 2, "source": {"minutes_version": 100, "para": 1051}, "summary_zh": null, "tags": [], "text_en": "For Option 4-1 under Direction A in AI/ML based CSI compression, the performance targets are exchanged per layer  per CSI feedback set (), where the CSI feedback set () is the mth out of Mk CSI feedbacks set corresponding to the kth target CSI set.\nR1-2602691\tFL summary # 2 for inter-vendor training collaboration\tApple\nPresented in Wednesday session.\nR1-2602692\tFL summary # 3 for inter-vendor training collaboration\tApple\nFrom Thursday session", "wg": "RAN1"}, {"agenda_item": "9.1.2", "agenda_title": "Inter-vendor training collaboration for two-sided AI/ML models", "content_hash": "sha256:7c350cf3f905a3025f7aeabdd721ffbf8fd74e0fe3c31844425adf647714a0e1", "depth": "origin", "era": "5G-A", "feature": "ai_air_interface", "first_seen": "2026-10-08", "id": "RAN1-124b-9.1.2-a003", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 124, "meeting_end": null, "meeting_suffix": "b", "release": "Rel-19", "seq": 3, "source": {"minutes_version": 100, "para": 1057}, "summary_zh": null, "tags": [], "text_en": "For Option 4-1 under Direction A in AI/ML based CSI compression,\nOne-to-one mapping between pairing ID and exchanged dataset. There is no linkage between different data sets.\nFinal summary in R1-2602693.", "wg": "RAN1"}, {"agenda_item": "10.2.1", "agenda_title": "Waveform", "content_hash": "sha256:448795db33b149db9517468103cb9cb26bcda8c90000bd4de8bc52a139e49f38", "depth": "full", "era": "6G", "feature": "waveform", "first_seen": "2026-10-08", "id": "RAN1-124-10.2.1-a001", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 1, "source": {"minutes_version": 20, "para": 3988}, "summary_zh": null, "tags": [], "text_en": "Extend the RAN1#123 endorsed table to characterize each (waveform) proposal as a potential RAN1 observation as follows to cover also impacts to transmitter and receiver processing operation:\n|  | Description |\n| --- | --- |\n| Name of the proposal |  |\n| Motivation of the proposal | E.g. TN, NTN, ISAC, etc… |\n| Applicable link direction | DL/UL/both |\n| Enhancement to CP-OFDM? | No/Yes |\n| Enhancement to DFT-s-OFDM? | No/Yes |\n| Additional OFDM-compatible waveform? | No/Yes |\n| Target channel(s)/signal(s) | PDCCH/PDSCH/PUCCH/PUSCH/xxx |\n| Target modulation |  |\n| Motivation / use case | Improved spectral efficiency, … |\n| Key Metric / KPI | Spectral efficiency, … |\n| Key spec impact foreseen |  |\n| MRSS compatibility | Please explain |\n| Multiplexing/coexistence with other waveforms | Please explain |\n| Multi-user multiplexing | Please explain |\n| MIMO compatibility | Please explain |\n| Implementation/operation impacts on transmitter processing | Please explain |\n| Implementation/operation impacts on receiver processing | Please explain |\nR1-2600787\tFeature Lead summary #2 on 6G waveform\tNokia\nFrom Wednesday session", "wg": "RAN1"}, {"agenda_item": "10.2.1", "agenda_title": "Waveform", "content_hash": "sha256:d33578455639dbfa31686d5c6cd2d5b4ee75f81f6483368a7301fc9b3b0590d9", "depth": "full", "era": "6G", "feature": "waveform", "first_seen": "2026-10-08", "id": "RAN1-124-10.2.1-a002", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 2, "source": {"minutes_version": 20, "para": 4000}, "summary_zh": null, "tags": [], "text_en": "For the evaluations of spectrum extension and spectrum truncation for UL low-PAPR solutions, the number of subcarriers A before extension / truncation is\nOption 1: 12 * 2x3y5z subcarriers\nOption 2: 2x3y5z subcarriers\nFFS: whether the maximum value for A is needed\nNote: Companies are encouraged to investigate above options and bring inputs to RAN1#124bis.\nNote: the occupied bandwidth B is given in terms of number of RBs.", "wg": "RAN1"}, {"agenda_item": "10.2.1", "agenda_title": "Waveform", "content_hash": "sha256:e9df575eff485b2f702d3f8621e5fa962047345bb6858effb53e02482ca6508e", "depth": "full", "era": "6G", "feature": "waveform", "first_seen": "2026-10-08", "id": "RAN1-124-10.2.1-a003", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 3, "source": {"minutes_version": 20, "para": 4007}, "summary_zh": null, "tags": [], "text_en": "NR Rel-15 DFT-s-OFDM should be used as the baseline reference when evaluating the gains of UL low-PAPR proposals.\nR1-2600788\tFeature Lead summary #3 on 6G waveform\tNokia\nFrom Thursday session", "wg": "RAN1"}, {"agenda_item": "10.2.1", "agenda_title": "Waveform", "content_hash": "sha256:fb66ff0157ab01a07932ab7da93105e5a82b8170b1fb5ebe11ba65a79422d5be", "depth": "full", "era": "6G", "feature": "waveform", "first_seen": "2026-10-08", "id": "RAN1-124-10.2.1-a004", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 4, "source": {"minutes_version": 20, "para": 4011}, "summary_zh": null, "tags": [], "text_en": "Following metrics are used for SLS evaluations for multi-layer UL DFT-s-OFDM and CP-OFDM studies.\nUser perceived throughput (UPT), including:\nHigh percentile (90%)\nmean\nmedian\ncell edge (5 & 10-percentile)\nOptional for full buffer traffic only: cell average throughput\nCompanies are encouraged to report the CDF of instantaneous UL TX power across all UEs\nCompanies are encouraged to report the statistics on the UL TX rank.\nCompanies are encouraged to report the statistics on the applied MCS.", "wg": "RAN1"}, {"agenda_item": "10.2.1", "agenda_title": "Waveform", "content_hash": "sha256:c60891ac65a26e3de32b28ac5f5d59a8ba5f6de8f4d96bf899ee9496eb912677", "depth": "full", "era": "6G", "feature": "waveform", "first_seen": "2026-10-08", "id": "RAN1-124-10.2.1-a005", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 5, "source": {"minutes_version": 20, "para": 4022}, "summary_zh": null, "tags": [], "text_en": "Following metrics are used for LLS evaluation for multi-layer UL DFT-s-OFDM and CP-OFDM studies.\nBLER curves (for a subset of NR MCS (covering whole range with spanning), HARQ re-transmissions disabled) for same transmission rank, for same resource allocation and same transmission power for DFT-s-OFDM and CP-OFDM\nCompanies may derive Link-level throughput vs SNR based on BLER curves\nNetgain", "wg": "RAN1"}, {"agenda_item": "10.2.1", "agenda_title": "Waveform", "content_hash": "sha256:f5c808a7ec21714f029bff6adda2ae226b38b1c8f47e0d7dfdb19592e4f7ccd1", "depth": "full", "era": "6G", "feature": "waveform", "first_seen": "2026-10-08", "id": "RAN1-124-10.2.1-a006", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 6, "source": {"minutes_version": 20, "para": 4027}, "summary_zh": null, "tags": [], "text_en": "For 2-layer/2Tx UL DFT-s-OFDM and CP-OFDM studies, following two cases are considered.\nUE capable of only non-coherent precoder\nFor UL CP-OFDM and DFT-s-OFDM rank-2 transmission, only non-coherent precoder option is allowed.\nUE capable of fully-coherent precoder\nFor UL CP-OFDM rank-2 transmission, all NR precoder options are allowed.\nFor UL DFT-s-OFDM rank-2 transmission, only non-coherent precoder option is allowed.", "wg": "RAN1"}, {"agenda_item": "10.2.1", "agenda_title": "Waveform", "content_hash": "sha256:dd333e290c5383c04144ec300a23241ba34a4f22d2a622a9a9400cb9de87834d", "depth": "full", "era": "6G", "feature": "waveform", "first_seen": "2026-10-08", "id": "RAN1-124-10.2.1-a007", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 7, "source": {"minutes_version": 20, "para": 4034}, "summary_zh": null, "tags": [], "text_en": "For the multi-layer UL DFT-s-OFDM and CP-OFDM studies, the NR reference should be evaluated assuming the Release 16 full power mode 1 to be enabled.\nR1-2600789\tFeature Lead summary #4 on 6G waveform\tNokia\nFrom Friday session", "wg": "RAN1"}, {"agenda_item": "10.2.1", "agenda_title": "Waveform", "content_hash": "sha256:001fd6e4d997127cdd1855f5c9124dda298022573566cb36f7059aecdef7a80f", "depth": "full", "era": "6G", "feature": "waveform", "first_seen": "2026-10-08", "id": "RAN1-124-10.2.1-a008", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 8, "source": {"minutes_version": 20, "para": 4038}, "summary_zh": null, "tags": [], "text_en": "The following UL low-PAPR proposals for DFT-s-OFDM are for further consideration:\nNon-AI-ML-based\nFDSS (R1-2601092, R1-2600751, R1-2600801, R1-2600823, R1-2600914, R1-2601156)\nFDSS – spectrum extension (R1-2600027, R1-2601092, R1-2600823, R1-2600751, R1-2600914, R1-2601156, R1-2600261)\nFDSS – spectrum truncation for π/2 BPSK (R1-2601268, R1-2601212, R1-2601092, R1-2601156)\nTone Reservation (R1-2600261, R1-2600716, R1-2601268)\nFor π/2 BPSK or other modulation orders\nGMSK-Approximation based FDSS (R1-2600823)\n3-tap filter based FDSS (R1-2508684)\nCFR-SE (R1-2600499)\nOffset-QAM or π/2-PAM with FDSS-spectrum truncation (R1-2600909, R1-2600138, R1-2601268, R1-2600751)\nOffset-QAM or π/2-PAM with FDSS-spectrum extension (R1-2600909, R1-2600138, R1-2600751, R1-2600823)\nInterpolation-based modulation (R1-2600261)\nAFDM based on DFT-s-OFDM (R1-2600999, R1-2601019)\nAI-ML-based\nAI/ML-based waveform (R1-2600499, R1-2600751)\nNote: tdoc numbers described in each proposal provide information on the proposal for further consideration, and it does not mean these tdocs support the proposal.", "wg": "RAN1"}, {"agenda_item": "10.2.1", "agenda_title": "Waveform", "content_hash": "sha256:6f2a4550ea5d7ef7118904dbe6216bdc1ae0402ea981436b019ff4760d45c3fd", "depth": "full", "era": "6G", "feature": "waveform", "first_seen": "2026-10-08", "id": "RAN1-124-10.2.1-c001", "impact": null, "kind": "conclusion", "llm_status": "pending", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 1, "source": {"minutes_version": 20, "para": 3993}, "summary_zh": null, "tags": [], "text_en": "DFT-s-OFDM waveform including related enhancements for 6GR Downlink will be no further discussed as part of AI 10.2.1.\nNote: for DL signal (e.g., SS, WUS, sensing), it may or may not be separately discussed in corresponding AI.", "wg": "RAN1"}, {"agenda_item": "10.2.1", "agenda_title": "Waveform", "content_hash": "sha256:70a22da4dfd8cc5f5522b8b23b40ff173ddb85e0ead9f059f36d179354cc14b5", "depth": "full", "era": "6G", "feature": "waveform", "first_seen": "2026-10-08", "id": "RAN1-124-10.2.1-c002", "impact": null, "kind": "conclusion", "llm_status": "pending", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 2, "source": {"minutes_version": 20, "para": 3996}, "summary_zh": null, "tags": [], "text_en": "Studies on UL coverage improvements through low UL PAPR enhancement for DFT-s-OFDM are to be handled with high priority in AI 10.2.1.", "wg": "RAN1"}, {"agenda_item": "10.2.1", "agenda_title": "Waveform", "content_hash": "sha256:25a7f1e6aecbaaeee6e35e202437e9c6d8c5272a1da752e0040197c222c0059c", "depth": "full", "era": "6G", "feature": "waveform", "first_seen": "2026-10-08", "id": "RAN1-124-10.2.1-c003", "impact": null, "kind": "conclusion", "llm_status": "pending", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 3, "source": {"minutes_version": 20, "para": 3998}, "summary_zh": null, "tags": [], "text_en": "Studies on DFT-s-OFDM for multi-rank UL MIMO are to be handled with high priority in AI 10.2.1.", "wg": "RAN1"}, {"agenda_item": "10.2.1", "agenda_title": "Waveform", "content_hash": "sha256:48977203d150c0e52ed1f04b4c03270103302d341ba33753e4596c56d2ed4160", "depth": "full", "era": "6G", "feature": "waveform", "first_seen": "2026-10-08", "id": "RAN1-124-10.2.1-c004", "impact": null, "kind": "conclusion", "llm_status": "pending", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 4, "source": {"minutes_version": 20, "para": 4056}, "summary_zh": null, "tags": [], "text_en": "Further clarifications on evaluations of UL low-PAPR proposals for DFT-s-OFDM:\nIn the evaluation assumptions, companies should disclose the necessary knowledge (e.g., filter coefficients, extension scheme, …) of the waveform at the receiver to process if any.\nR1-2601696\tFeature Lead summary #5 on 6G waveform\tModerator (Nokia)", "wg": "RAN1"}, {"agenda_item": "10.3.1", "agenda_title": "Channel coding", "content_hash": "sha256:18c8b20d7422ef2bfd9ade74778ec10affa699e46737ae034d2a847239598c77", "depth": "full", "era": "6G", "feature": "channel_coding", "first_seen": "2026-10-08", "id": "RAN1-124-10.3.1-a001", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 1, "source": {"minutes_version": 20, "para": 4109}, "summary_zh": null, "tags": [], "text_en": "For the study of LDPC extension beyond NR range, the following options of the maximum code block size are identified in RAN1#124 for further study\nOption 1: 8448\nOption 2: 8448*2", "wg": "RAN1"}, {"agenda_item": "10.3.1", "agenda_title": "Channel coding", "content_hash": "sha256:66b0927dddbf8a281e092e243f2a235ee8bfea59cf9c0fb23e194ada6d99342c", "depth": "full", "era": "6G", "feature": "channel_coding", "first_seen": "2026-10-08", "id": "RAN1-124-10.3.1-a002", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 2, "source": {"minutes_version": 20, "para": 4113}, "summary_zh": null, "tags": [], "text_en": "For the study of LDPC extension beyond NR range, the following options of the number of information columns in BG are identified in RAN1#124 for further study\nOption 1: 22\nOption 2: 44\nOption 3: 33\nR1-2601568\tFL summary#2 for 6G channel coding\tModerator(ZTE)\nFrom Tuesday session", "wg": "RAN1"}, {"agenda_item": "10.3.1", "agenda_title": "Channel coding", "content_hash": "sha256:11b428282aeac6b118031054d112f3190a05eccb5500125c3a59c62b0dd545fb", "depth": "full", "era": "6G", "feature": "channel_coding", "first_seen": "2026-10-08", "id": "RAN1-124-10.3.1-a003", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 3, "source": {"minutes_version": 20, "para": 4120}, "summary_zh": null, "tags": [], "text_en": "For the study of LDPC extension beyond NR range, the following options of puncturing before rate matching are identified in RAN1#124 for further study\nOption 1: no puncturing\nOption 2: puncture 1 column\nOption 3: puncture 2 columns", "wg": "RAN1"}, {"agenda_item": "10.3.1", "agenda_title": "Channel coding", "content_hash": "sha256:8cc27edc536be16efe07f585803fc7e353d5023c51194b42abf7eee48eb0d5ab", "depth": "full", "era": "6G", "feature": "channel_coding", "first_seen": "2026-10-08", "id": "RAN1-124-10.3.1-a004", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 4, "source": {"minutes_version": 20, "para": 4125}, "summary_zh": null, "tags": [], "text_en": "For performance evaluation purposes, the corresponding evaluation assumptions for study the Polar code segmentation enhancement used for L1 uplink control information with payload size beyond NR range and larger than 1706 bits, following evaluation assumptions are considered.\n| Channel | AWGN |\n| --- | --- |\n| Modulation | QPSK other modulation orders can be reported by companies |\n| UL | Code rate: 1/8, 1/6, 1/5, 1/4, 1/3, 1/2, 2/3, 3/4 Information bit length (bits w/o CRC) A: 1706+S: S: X Coded bit length X is up to companies to report. S: 16 |\n| Decoding algorithm for Polar code | CRC-aided SCL decoding Companies to report the list sizes either 8 or 16. |\n| Target BLER of UCI payload | 10-2, 10-3 |\nNote: 11 bits CRC per segment, rate matching, channel interleaver and code-block concatenation follow NR.\nNote: Companies to report other values that are used in their evaluations.\nR1-2601569\tFL summary#3 for 6G channel coding\tModerator(ZTE)\nFrom Wednesday session", "wg": "RAN1"}, {"agenda_item": "10.3.1", "agenda_title": "Channel coding", "content_hash": "sha256:7d9340591b0906853c1f7352e1bf9dfe416d7d68c08e44f2a0b79e7d5b34a135", "depth": "full", "era": "6G", "feature": "channel_coding", "first_seen": "2026-10-08", "id": "RAN1-124-10.3.1-a005", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 5, "source": {"minutes_version": 20, "para": 4132}, "summary_zh": null, "tags": [], "text_en": "For the study of LDPC extension beyond NR range, the maximum lifting size is not larger than 384\nFFS: the exact value of the maximum lifting size\nR1-2601666\tFL summary#4 for 6G channel coding\tModerator (ZTE)\nFrom Thursday session", "wg": "RAN1"}, {"agenda_item": "10.3.1", "agenda_title": "Channel coding", "content_hash": "sha256:c3ba732bab372a7d45604d70b87e91b90d59f56247f265574da6519dc2ae7cda", "depth": "full", "era": "6G", "feature": "channel_coding", "first_seen": "2026-10-08", "id": "RAN1-124-10.3.1-a006", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 6, "source": {"minutes_version": 20, "para": 4137}, "summary_zh": null, "tags": [], "text_en": "For the base graph of LDPC extension beyond NR range, the following is identified in RAN1#124 for further study\nThe LDPC extension is quasi-cyclic LDPC codes, the parity check matrix of quasi-cyclic LDPC Codes is defined at least by a matrix H of size (mb×z)×(nb×z), which consists of sub-block matrices of size z×z, where each sub-block matrix is composed by circularly shifted matrices or zero matrices. Wherein, mb, nb and z are integers larger than 1.\nThe values of mb, nb and z are FFS.\nThe row weight of circularly shifted matrices is less than or equal to 2.\nFFS: Whether row weight of all circularly shifted matrices is 1, or the row weight of some circularly shifted matrices is 1 and the row weight of some circularly shifted matrices is 2.", "wg": "RAN1"}, {"agenda_item": "10.3.1", "agenda_title": "Channel coding", "content_hash": "sha256:c65df2186cab646fc233374f18e96be0d15fa422ce326aab5fc0d4a996acfae5", "depth": "full", "era": "6G", "feature": "channel_coding", "first_seen": "2026-10-08", "id": "RAN1-124-10.3.1-a007", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 7, "source": {"minutes_version": 20, "para": 4143}, "summary_zh": null, "tags": [], "text_en": "For study of LDPC extension beyond NR range, at least the following metrics are considered for the performance comparison among BG1 and BG(s)/PCM(s) proposed by companies\nComputational complexity difference to achieve the same BLER performance as BG1 under the reference maximum number of iterations of BG1.\nSNR performance difference with the same computation complexity as BG1 under the reference maximum number of iterations of BG1.\nThe reference maximum number of iterations is 5, 7, 10, 15 based on BG1.\nOther values can be also reported by companies\nNote: Companies can report the average number of iterations difference to achieve the same performance as BG1 under the reference maximum number of iterations of BG1.\nFinal summary in R1-2601667.", "wg": "RAN1"}, {"agenda_item": "10.3.2", "agenda_title": "Modulation, Joint channel coding and modulation", "content_hash": "sha256:41083c25d083d1345f71881d6eb8bea3dc1cd6ff047388423cb11631629efd16", "depth": "full", "era": "6G", "feature": "channel_coding", "first_seen": "2026-10-08", "id": "RAN1-124-10.3.2-a001", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 1, "source": {"minutes_version": 20, "para": 4184}, "summary_zh": null, "tags": [], "text_en": "Parameters affect the PS complexity/storage/latency and BLER and throughput performance trade-off are at least:\nDM output length in unit of I/Q symbol,\n# of bits shaped per I/Q,\n# of shaping parameters\n# of DM blocks needed to support the target throughput of 6GR\nDM algorithm and bit-width of variables in the DM algorithm\nImpact of mismatch on the quantization bitwidth between DM and DDM.\nParameters affect the GS complexity/storage/latency and BLER and throughput performance trade-off are at least:\n1D-NUC or 2D-NUC\nConstellations and  # of constellations\nBitwidth for describing the constellation\nBits to constellation mapping\nThe values of these parameters used in evaluations shall be submitted together with performance results.\nCompanies are encouraged to provide evaluations for different combination parameters to study different performance and complexity/storage/latency trade-offs to provide proper assessment including feasibility .\nR1-2601549\tFL summary #2 on modulation, joint channel coding and modulation\tModerator (Qualcomm)\nPresented in Tuesday session,\nR1-2601550\tFL summary #3 on modulation, joint channel coding and modulation\tModerator (Qualcomm)\nFrom Wednesday session", "wg": "RAN1"}, {"agenda_item": "10.3.2", "agenda_title": "Modulation, Joint channel coding and modulation", "content_hash": "sha256:09d5bf1a92f2722b4e871b78837901b1a401fbcdeceadacc1feab293641c62a5", "depth": "full", "era": "6G", "feature": "channel_coding", "first_seen": "2026-10-08", "id": "RAN1-124-10.3.2-a002", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 2, "source": {"minutes_version": 20, "para": 4203}, "summary_zh": null, "tags": [], "text_en": "For the study of introducing DL 4K uniform QAM and UL 1K uniform QAM, focus on the following use cases:\nFWA deployed outdoor\nFWA deployed indoor\nFFS: In-door hot-spot.\nFor SLS of DL 4K uniform QAM and UL 1K uniform QAM for CPE under FWA scenarios, assume the following:\nFor layout\nDense Urban\nUMA\nFFS: Other SLS parameters\nR1-2601551\tFL summary #4 on modulation, joint channel coding and modulation\tModerator (Qualcomm)\nFrom Wednesday session", "wg": "RAN1"}, {"agenda_item": "10.3.2", "agenda_title": "Modulation, Joint channel coding and modulation", "content_hash": "sha256:913b23e415bf3bdab9ac07e9281b98a47b2d1beb622566615c64c6d82d9eef5b", "depth": "full", "era": "6G", "feature": "channel_coding", "first_seen": "2026-10-08", "id": "RAN1-124-10.3.2-a003", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 3, "source": {"minutes_version": 20, "para": 4215}, "summary_zh": null, "tags": [], "text_en": "Send LS to RAN4 to kindly provide the EVM and MPR values for DL 4K uniform QAM without shaping and UL 1K uniform QAM without shaping.", "wg": "RAN1"}, {"agenda_item": "10.3.2", "agenda_title": "Modulation, Joint channel coding and modulation", "content_hash": "sha256:13cc7cd5c99beeff733dfe613eb51943c349aadf34c728e2917242706bbce223", "depth": "full", "era": "6G", "feature": "channel_coding", "first_seen": "2026-10-08", "id": "RAN1-124-10.3.2-a004", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 4, "source": {"minutes_version": 20, "para": 4217}, "summary_zh": null, "tags": [], "text_en": "For PS, potential impact to the TX/RX chain functionality blocks are identified as follows:\nTX chain\n(Modified) TBS calculation\n(Modified) CB segmentation\n(New) DM functionalities\nBit splitting: Split to shaped bits and unshaped bits\nDM\nBit concatenation/multiplexing: Concatenate/multiplex DM output and unshaped bits\n(Modified) Bit interleaver and Bit selection\n(Modified) Scrambling: shaped bits should not be scrambled to keep the target distribution\n(Modified) Modulation: Power normalization needed for shaped constellation\nRX chain\n(Modified) TBS calculation\n(New) DM functionalities\nBit splitting: Split to shaped bits and unshaped bits\nDDM\nBit concatenation/demultiplexing: Concatenate/demultiplex DDM output with unshaped bits\n(Modified) Bit de-interleaver and Bit selection\n(Modified) Descrambling:\n(Modified) Demodulation: Prior probability used in demodulation\n(Modified) CB concatenation\nCompanies are encouraged to provide design details for the modification needed for above functionalities.\nCompanies are encouraged to explain the reason if a functionality block is not impacted.\nR1-2601662\tFL summary #5 on modulation, joint channel coding and modulation\tModerator (Qualcomm)\nFrom Thursday session\nR1-2601663\tDraft LS to RAN4 for 4K QAM and 1K QAM EVM and MPR\tQualcomm", "wg": "RAN1"}, {"agenda_item": "10.3.2", "agenda_title": "Modulation, Joint channel coding and modulation", "content_hash": "sha256:c23fa455a9c36316e6eaa03c7cc68f26abf9e9277fa5d5eb17956d4a20644981", "depth": "full", "era": "6G", "feature": "channel_coding", "first_seen": "2026-10-08", "id": "RAN1-124-10.3.2-a005", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 5, "source": {"minutes_version": 20, "para": 4244}, "summary_zh": null, "tags": [], "text_en": "The draft LS in R1-2601663 is endorsed. The final LS is approved in R1-2601664.", "wg": "RAN1"}, {"agenda_item": "10.3.2", "agenda_title": "Modulation, Joint channel coding and modulation", "content_hash": "sha256:0c3094bcc2b6494c86baa3b7c5692cfc304d679015cae620c0ab7c0066e388f6", "depth": "full", "era": "6G", "feature": "channel_coding", "first_seen": "2026-10-08", "id": "RAN1-124-10.3.2-a006", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 6, "source": {"minutes_version": 20, "para": 4246}, "summary_zh": null, "tags": [], "text_en": "For GS, potential impact to the TX/RX chain functionality blocks compared to NR are identified as follows:\nTX chain\nMapper\nBit to constellation symbol mapping\nModulation symbol generation\nRX chain\nDemodulation of received symbols\nDemapper\nCompanies are encouraged to identify potential impact on TX, RX chains if both NUC and uniform QAM are supported.\nCompanies are encouraged to provide design details for the modification needed for above functionalities.\nCompanies are encouraged to explain the reason if a functionality block is not impacted.\nR1-2601699\tFL summary #6 on modulation, joint channel coding and modulation\tModerator (Qualcomm)", "wg": "RAN1"}, {"agenda_item": "10.8.1", "agenda_title": "Evaluations", "content_hash": "sha256:34b4ee5aa1865236eaf72e2f61f035c579b6396ef7ef3cecad629b15bba24ebc", "depth": "full", "era": "6G", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-124-10.8.1-a001", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 1, "source": {"minutes_version": 20, "para": 1517}, "summary_zh": null, "tags": [], "text_en": "For Rel-20 study, adopt the updated TP in Moderator’s evaluation summary attached in R1-2600466 into TR38.769.", "wg": "RAN1"}, {"agenda_item": "10.8.1", "agenda_title": "Evaluations", "content_hash": "sha256:86917ead4a1c3c288c894400e3ef4a5679e4070105dfa68076a7c6b2d9a12322", "depth": "full", "era": "6G", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-124-10.8.1-a002", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 2, "source": {"minutes_version": 20, "para": 1519}, "summary_zh": null, "tags": [], "text_en": "In addition to energy harvesting/storage assumptions used to obtain the reported data rates from companies are provided and agreed in RAN1#123, the followings (highlighted in red) are further provided during the Rel-20 study,\n| Source | Energy harvesting/storage assumptions |\n| --- | --- |\n| Source [NEC] | Energy source: Solar energy Energy storage capacity: 10~100µF with voltage of 3V For device 2b, 10~100µF with voltage of 3V, i.e., 30~300uJ; For device C, 0.5~5mF with voltage of 3V, i.e., 1.5~15mJ; Reported data rate: 1 kbps or 5 – 7 kbps Other information: Device 2b and Device C harvest energy at similar rate. |\n| Source [FUTUREWEI] | Energy sources: Solar, thermal, vibration etc. Energy storage capacity: For device 2b with 500uW peak power consumption: 0.5 milli-joules or 500 F using 2V power supply Low rate: 0.1kbps: ~5000 J /~5000 F Middle rate: 1kbps: ~500 J /~500 F High rate: 5kbps: ~100 J /~100 F For device C with 10mW peak power consumption: 10 milli-joules or 10000 F using 2V power supply Low rate: 0.1kbps: ~100 mJ /~100 mF Middle rate: 1kbps: ~10mJ /~10 mF High rate: 5kbps: ~1 mJ /~1000 F Reported data rate: 0.1kbps, 1kbps, 5kbps Other information: It is observed that using RF energy harvesting is challenging as the energy source for Device 2b based on the following description. Typical leakage current for 500 F capacitors is at least higher than 3 A. With a supply voltage of 2 volts, the leakage current translates to ~ -22.2 dBm leakage power. Using RF harvesting is challenging in this case. For the maximum message size, 1000 bits is assumed for single PRDCH/PDRCH transmission. The rated voltage is 2V and min voltage is 1.4V (70% of the rated voltage). It should be noted that the reported capacity is for single PRDCH/PDRCH transmission. To sustain whole procedure of DT, DO-DTT, DO-A, larger capacity is required. |\n| Source [CATT] | Energy source: Solar Energy storage capacity: ~100mF Reported data rate: 0.1kbps, 1kbps, 5~7kbps, 48~60kbps Other information: Assumptions of power consumption: 100uW and 1mW for R2D reception 200uW and 5mW for D2R transmission |\n| Source [Samsung] | Energy source: Solar Energy storage capacity: >10μJ5μJ for device 2b, 100μJ30μJ for device C Reported data rate: 5.3 kbps for DL 20 bits, 6.7 kbps for UL 20 bits, 7.2 kbps for DL 96 bits, 8.4 kbps for UL 96 bits; with an average of 40% charging time |\n| Source [Ericsson] | Energy source: RF signal/ Solar Energy storage capacity: Device 2b: 10s µF to a few 100 µF Device C: a few mF Reported data rates: 1kbps, 7kbps, and 50 kbps Other information: For device 2b: with tx power of -10dBm we considered the power consumption of 400 µW, to transmit 400 bits with the data rate of 1 kbps, the needed storage capacity is around 140 µF. For device C: with tx power of 5dBm we considered the power consumption of 12.6 mW, to transmit 400 bits with the data rate of 1 kbps, the needed storage capacity is around 4.5 mF. |\nR1-2600463\tFL summary #2 for Ambient IoT: “9.3.1 Evaluations”\tModerator (Huawei)\nFrom Tuesday session", "wg": "RAN1"}, {"agenda_item": "10.8.1", "agenda_title": "Evaluations", "content_hash": "sha256:0b9967d425cc32d05a7e84e81e880cf81cf5157a1959bb319ad2e66fc7f6dc83", "depth": "full", "era": "6G", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-124-10.8.1-a003", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 3, "source": {"minutes_version": 20, "para": 1524}, "summary_zh": null, "tags": [], "text_en": "For Rel-20 study, adopt the following TPs into section 7.3 of TR38.769.\n| ------ Start of TP------ RAN1 has evaluated the coverage for Device 2b and Device C respectively. Evaluation results from companies in terms of different achievable cell edge data rate and achievable maximum distance under different scenarios, penetration margins and Tx power have been observed for R2D and D2R in the tables of following sub-sections. For R2D coverage, based on evaluation results, the achievable cell edge data rate and achievable maximum distance are observed at least for the following scenarios For cell edge data rate around 1 kbps, For UMa NLOS pathloss model, penetration margin 0 dB Device 2b: the achievable maximum distance is at least 500 meters at BLER 10% when BS Tx power is from 33dBm to 43dBm and at BLER 1% when BS Tx power is from 38dBm to 43dBm. The achievable maximum distance can be smaller or larger than 500 meters at BLER 1% (about 370~1800 meters) when BS Tx power is 33dBm Device C: the achievable maximum distance is at least 500 meters at BLER 10% and 1% when BS Tx power is from 33dBm to 43dBm For UMa NLOS pathloss model, penetration margin 20 dB Device 2b: the achievable maximum distance can be smaller or larger than 500 meters at BLER 10% (about 190~1340 meters) and at BLER 1% (about 110~1000 meters) when BS Tx power is from 33dBm to 43dBm Device C: the achievable maximum distance is at least 500 meters at BLER 10% and 1% when BS Tx power is from 33dBm to 43dBm For cell edge data rate around 5~7 kbps, For UMa NLOS pathloss model, penetration margin 0 dB Device 2b: the achievable maximum distance is at least 500 meters at BLER 10% when BS Tx power is from 38dBm to 43dBm and at BLER 1% when BS Tx power is 43dBm. The achievable maximum distance can be smaller or larger than 500 meters at BLER 10% (about 480~2300 meters) when BS Tx power is 33dBm and at BLER 1% (about 210~1700 meters) when BS Tx power is from 33dBm to 38dBm Device C: the achievable maximum distance is at least 500 meters at BLER 10% when BS Tx power is from 33dBm to 43dBm and at BLER 1% when BS Tx power is from 38dBm to 43dBm. The achievable maximum distance can be smaller or larger than 500 meters at BLER 1% (about 430~1500 meters) when BS Tx power is 33dBm For UMa NLOS pathloss model, penetration margin 20 dB Device 2b: the achievable maximum distance can be smaller or larger than 500 meters at BLER 10% (about 150~1280 meters) and at BLER 1% (about 70~710 meters) when BS Tx power is from 33dBm to 43dBm Device C: the achievable maximum distance is at least 500 meters at BLER 10% when BS Tx power is 43dBm. The achievable maximum distance can be smaller or larger than 500 meters at BLER 10% (about 280~1070 meters) when BS Tx power is from 33dBm to 38dBm and at BLER 1% (about 130~810 meters) when BS Tx power is from 33dBm to 43dBm For D2R coverage, based on evaluation results, the achievable cell edge data rate and achievable maximum distance are observed at least for the following scenarios For cell edge data rate around 0.1 kbps, For UMa NLOS pathloss model, penetration margin 0 dB Device 2b: the achievable maximum distance is smaller than 500 meters at BLER 10% (about 80~370 meters) and BLER 1% (about 40~300 meters) when device Tx power is -20dBm. The achievable maximum distance can be smaller or larger than 500 meters at BLER 10% (about 150~660 meters) and at BLER 1% (about 80~540 meters) when device Tx power is -10dBm Device C: the achievable maximum distance is at least 500 meters at BLER 10% and 1% when device Tx power is from -3dBm to 5dBm For UMa NLOS pathloss model, penetration margin 20 dB Device 2b: the achievable maximum distance is smaller than 500 meters at BLER 10% (about 20~200 meters) and at BLER 1% (10~160 meters) when device Tx power is from -20dBm to -10dBm Device C: the achievable maximum distance is at least 500 meters at BLER 10% when device Tx power is 5dBm. The achievable maximum distance can be smaller or larger than 500 meters at BLER 10% (about 320~680 meters) when device Tx power is from -3dBm to 0dBm and at BLER 1% (about 260~730 meters) when device Tx power is from -3dBm to 5dBm For cell edge data rate around 1 kbps, For UMa NLOS pathloss model, penetration margin 0 dB Device 2b: the achievable maximum distance can be smaller or larger than 500 meters at BLER 10% (about 110~810 meters) and at BLER 1% (about 50~600 meters) when device Tx power is -10dBm. The achievable maximum distance is smaller than 500 meters at BLER 10% (about 60~450 meters) and BLER 1% (about 30~230 meters) when device Tx power is -20dBm. Device C: the achievable maximum distance is at least 500 meters at BLER 10% when device Tx power is from 0dBm to 5dBm and at BLER 1% when device Tx power is 5dBm. The achievable maximum distance can be smaller or larger than 500 meters at BLER 10% (about 460~1230 meters) when device Tx power is -3dBm and at BLER 1% (about 310~1090 meters) when device Tx power is from -3dBm to 0dBm For UMa NLOS pathloss model, penetration margin 20 dB Device 2b: the achievable maximum distance is smaller than 500 meters at BLER 10% (about 20~250 meters) and at BLER 1% (about 10~180 meters) when device Tx power is from -20dBm to -10dBm Device C: the achievable maximum distance can be smaller or larger than 500 meters at BLER 10% (about 230~600 meters) when device Tx power is 5dBm. The achievable maximum distance is smaller than 500 meters at BLER 10% (about 140~450 meters) when device Tx power is from -3dBm to 0dBm and at BLER 1% (about 100~450 meters) when device Tx power is from -3dBm to 5dBm. For cell edge data rate around 5~7 kbps, For UMa NLOS pathloss model, penetration margin 0 dB Device 2b: the achievable maximum distance can be smaller or larger than 500 meters at BLER 10% (about 100~680 meters) when device Tx power is -10dBm. The achievable maximum distance is smaller than 500 meters at BLER 10% (about 60~270 meters) when device Tx power is -20dBm and at BLER 1% (about 40~390 meters) when device Tx power is from -20dBm to -10dBm Device C: the achievable maximum distance can be smaller or larger than 500 meters at BLER 10% (about 300~1220 meters) and at BLER 1% (about 240~960 meters) when device Tx power is from -3dBm to 5dBm For UMa NLOS pathloss model, penetration margin 20 dB Device 2b: the achievable maximum distance is smaller than 500 meters at BLER 10% (about 20~150 meters) and at BLER 1% (10~120 meters) when device Tx power is from -20dBm to -10dBm Device C: the achievable maximum distance is smaller than 500 meters at BLER 10% (about 90~380 meters) and at BLER 1% (70~300 meters) when device Tx power is from -3dBm to 5dBm ------ End of TP ------ |\n| --- |", "wg": "RAN1"}, {"agenda_item": "10.8.1", "agenda_title": "Evaluations", "content_hash": "sha256:a8b1689d651d34842a3817ba7a7eacfd2fa33208ae5a440a780898c9d1d390ef", "depth": "full", "era": "6G", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-124-10.8.1-a004", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 4, "source": {"minutes_version": 20, "para": 1527}, "summary_zh": null, "tags": [], "text_en": "For Rel-20 study, RAN1 has identified the followings\nDevice C achieves better coverage than Device 2b for both R2D and D2R\nDevice 2b is applicable to outdoor scenarios for short distance e.g. 50-200m\nDevice C is applicable to outdoor scenarios for both short and large distance e.g. 50-500m\nNote: Necessity of Device 2b and C in terms of aspects other than coverage is up to RAN decision\nR1-2600464\tFL summary #3 for Ambient IoT: “9.3.1 Evaluations”\tModerator (Huawei)\nFrom Wednesday session", "wg": "RAN1"}, {"agenda_item": "10.8.1", "agenda_title": "Evaluations", "content_hash": "sha256:7dc075efea9e863ba52858a18199273675fdac1a0a833c820fd3b27275a422f2", "depth": "full", "era": "6G", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-124-10.8.1-a005", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 5, "source": {"minutes_version": 20, "para": 1535}, "summary_zh": null, "tags": [], "text_en": "RAN1 observes 5 dBm as the maximum transmit power for Device C to achieve maximum coverage in outdoor scenarios.\nValues between -3dBm and 5dBm are feasible to achieve different coverage.\nThis does not preclude RAN to select any value(s) between -3 dBm and 5 dBm as maximum transmit power for Device C.\nFinal summary in R1-2601637.", "wg": "RAN1"}, {"agenda_item": "8.1", "agenda_title": "Maintenance on Artificial Intelligence (AI)/Machine Learning (ML) for NR Air Interface", "content_hash": "sha256:b1a153840f1dd2931ae7f014c5ec6bd8faaaafa9bbd7fa56a957585ea081a1db", "depth": "origin", "era": "5G-A", "feature": "ai_air_interface", "first_seen": "2026-10-08", "id": "RAN1-124-8.1-a001", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 1, "source": {"minutes_version": 20, "para": 395}, "summary_zh": null, "tags": [], "text_en": "The following TP for TS 38.214 Clause 5.2.1.4.2 for Rel-19 is endorsed.\nReason for change: There is a bracket related to Set A description. Report quantity name and RRC parameters name are not aligned with the latest TS38.331.\nSummary of change: Remove the bracket related to Set A description and align the report quantity name and RRC parameters name.\nConsequences if not approved: The description related to Set A is unclear.\n| 5.2.1.4.2 Report quantity configurations \u003comitted texts> If the UE is configured with a CSI-ReportConfig with reportQuantity-r19 set to 'p-cri-r19p-CRI-r19', 'p-cri-RSRP-r19p-CRI-RSRP-r19', 'p-ssb-index-r19p-SSB-Index-r19' or 'p-ssb-index-RSRP-r19p-SSB-Index-RSRP-r19', and with nrofreportedpredictedrs-r19nrofReportedPredictedRS-r19 and/or nroftimeinstance-r19nrofTimeInstance-r19, the following applies: the UE is not required to update measurements for more than 64 CSI-RS or SSB resources given by resourcesForChannelMeasurement,[ and is not expected to predict for more than 64 CSI-RS or SSB resources given by resourcesForSetA-r19]resourcesForChannelPrediction-r19, the UE shall report one of the following in a single report: - nrofreportedpredictedrs-r19nrofReportedPredictedRS-r19 different P-CRIs or P-SSBRIs of the second Resource Setting, if nroftimeinstance-r19nrofTimeInstance-r19 is not configured and reportQuantity-r19 is set to ' p-cri-r19p-CRI-r19' or ' p-ssb-index-r19p-SSB-Index-r19', - nrofreportedpredictedrs-r19nrofReportedPredictedRS-r19 different P-CRIs or P-SSBRIs of the second Resource Setting, with corresponding predicted L1-RSRP(s), if nroftimeinstance-r19nrofTimeInstance-r19 is not configured and reportQuantity-r19 set to ' p-cri-RSRP-r19p-CRI-RSRP-r19' or ' p-ssb-index-RSRP-r19p-SSB-Index-RSRP-r19', - nrofreportedpredictedrs-r19nrofReportedPredictedRS-r19 different P-CRIs or P-SSBRIs of the second Resource Setting for each of nroftimeinstance-r19nrofTimeInstance-r19 time instance(s), if nroftimeinstance-r19nrofTimeInstance-r19 is configured and reportQuantity-r19 set to 'p-cri-r19' or ' p-ssb-index-RSRP-r19p-SSB-Index-RSRP-r19', - nrofreportedpredictedrs-r19nrofReportedPredictedRS-r19 different P-CRIs or P-SSBRIs of the second Resource Setting for each of nroftimeinstance-r19nrofTimeInstance-r19 time instance(s), with corresponding predicted L1-RSRP(s), if nroftimeinstance-r19nrofTimeInstance-r19 is configured and reportQuantity-r19 set to ' p-cri-RSRP-r19p-CRI-RSRP-r19' or ' p-ssb-index-RSRP-r19p-SSB-Index-RSRP-r19'. \u003comitted texts> |\n| --- |\nFinal CR in:\nR1-2601645\tCorrection on AI/ML for beam management\tModerator (Samsung), Sharp, Qualcomm\n(Rel-19, 38.214, NR_AIML_air-Core, CR0736, Cat F) is agreed.", "wg": "RAN1"}, {"agenda_item": "8.1", "agenda_title": "Maintenance on Artificial Intelligence (AI)/Machine Learning (ML) for NR Air Interface", "content_hash": "sha256:63026b6a9158ea511c09ff875042cef58685aa3530fa4a4041a64f12feb6a976", "depth": "origin", "era": "5G-A", "feature": "ai_air_interface", "first_seen": "2026-10-08", "id": "RAN1-124-8.1-a002", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 2, "source": {"minutes_version": 20, "para": 404}, "summary_zh": null, "tags": [], "text_en": "Adopt the following TP for TS 38.214 Clause 5.2.1.6.\nReason for change: The notation of “and/or ” is mistakenly used to describe occupied CPU for CPU occupation time for CSI report for monitoring.\nSummary of change: Adding correct notation of occupied CPU for CPU occupation time for CSI report for monitoring.\nConsequences if not approved: The notation of occupied CPU for CPU occupation time for CSI report for monitoring is incorrect.\n| 5.2.1.6 CSI processing criteria \u003comitted texts> For a CSI report with CSI-ReportConfig with higher layer parameter reportQuantity not set to 'none', or a CSI report with LTM-CSI-ReportConfig, or reportQuantity not set to 'none-bm-r19' or 'none-csi-r19', the CPU(s) (including and/or , for CSI reports with reportQuantity set to 'p-cri-r19', 'p-cri-RSRP-r19', 'p-ssb-index-r19', or 'p-ssb-index-RSRP-r19', or ‘csi-pai-r19’, or ‘rs-pai-r19’, and CSI reports configured with the higher layer parameter csi-InferencePrediction-r19, and for CSI report with reportQuantity set to ‘rs-pai-r19’ or ‘csi-pai-r19’) are occupied for a number of OFDM symbols as follows: - A periodic or semi-persistent CSI report (excluding an initial semi-persistent CSI report on PUSCH after the PDCCH triggering the report, a semi-persistent CSI report on PUSCH configured with reportQuantity set to 'csi-pai-r19', and a semi-persistent CSI report on PUSCH configured with the higher layer parameter codebookType set to 'typeII-Doppler-r18' or 'typeII-Doppler-PortSelection-r18') occupies CPU(s) from the first symbol of the earliest one of each CSI-RS/CSI-IM/SSB resource, or each CSI-RS/CSI-IM resource associated with all configured sub-configurations for periodic CSI report corresponding to a CSI-ReportConfig that contains a list of sub-configurations provided by csi-ReportSubConfigToAddModList, or each CSI-RS/CSI-IM resource associated with all activated/triggered sub-configurations for semi-persistent CSI report corresponding to a CSI-ReportConfig that contains a list of sub-configurations provided by csi-ReportSubConfigToAddModList, for channel or interference measurement, respective latest CSI-RS/CSI-IM/SSB occasion no later than the corresponding CSI reference resource, until the last symbol of the configured PUSCH/PUCCH carrying the report. \u003comitted texts> |\n| --- |\nFinal CR in R1-2601645 (Rel-19, 38.214, NR_AIML_air-Core, CR0736, Cat F).\nR1-2600737\tFL summary #1 for AI/ML in beam management\tModerator (Samsung)\nSpecification support for positioning accuracy enhancements\nFrom AI 5\nR1-2600012\tLS on definition of \"ground truth label\" in AI/ML-based Positioning Case 3a\tRAN3, Huawei\nRAN3 is asking RAN1 to consider the RAN3 captured definition of “ground truth label” and provide feedback - Moderator Yuan Li (Huawei)\nR1-2601585\tSummary#1 for the LS reply to RAN3 on ground-truth label definition\tModerator (Huawei)\nR1-2601675\tSummary#2 for the LS reply to RAN3 on ground-truth label definition\tModerator (Huawei)\nR1-2601676\tDraft LS reply to RAN3 LS on ground-truth label definition\tModerator (Huawei)\nWithdrawn as there is no RAN1 consensus to reply the RAN3 LS.\nInput contribution on AI/ML pos.\nR1-2601082\tMaintenance on AI/ML for NR Air Interface\tNokia\nR1-2601646\tFL summary #2 for AI/ML in beam management\tModerator (Samsung)\nDiscussion may continue in the next meeting.\nSpecification support for CSI prediction\nR1-2601565\tSummary #1 of maintenance on CSI prediction\tModerator (LG Electronics)\nFrom Monday session", "wg": "RAN1"}, {"agenda_item": "8.1", "agenda_title": "Maintenance on Artificial Intelligence (AI)/Machine Learning (ML) for NR Air Interface", "content_hash": "sha256:d13ca5c6dfb4f82be970c46c8283b24958be27e045e919c845ef57c5184b1962", "depth": "origin", "era": "5G-A", "feature": "ai_air_interface", "first_seen": "2026-10-08", "id": "RAN1-124-8.1-a003", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 3, "source": {"minutes_version": 20, "para": 427}, "summary_zh": null, "tags": [], "text_en": "Adopt the following TP for TS 38.214 Clause 5.2.1.4.6.\n| Reason for change | In current TS 38.214, for CSI-PAI reporting, the non-predicted PMI (ground-truth) is corresponding to the S-th time instance of the report of the first Reporting Setting, based on the CSI-RS resource(s) whose transmission occasion is contained within the same slot of the S-th time instance of the report of the first Reporting Setting (inference report). However, for CSI prediction, the reported predicted PMI refers to the precoder matrix for slot interval(s) rather than for individual slot(s). |\n| --- | --- |\n| Summary of change | Correct the definition of the CSI-RS resource(s) corresponding to the non-predicted PMI. |\n| Consequences if not approved | There is misalignment between the descriptions in CSI-PAI reporting and predicted PMI reporting. |\n| 5.2.1.4.6 CSI-PAI reporting \u003cUnchanged part omitted> - to report CSI-PAI for the second Reporting Setting, the UE is expected to be configured in the second Report Setting with codebookType set to 'typeII-r16' and it shall: determine predicted PMI (see Clause 5.2.2.2.10 or Clause 5.2.2.2.11) for each of the subband(s) configured by csi-ReportingBand and numberOfPMI-SubbandsPerCQI-Subband for the -th time instance configured by timeinstanceforCSImonitoring-r19 in the second Reporting Setting ( , with >1 provided in the first Reporting Setting), based on the CSI prediction performed by the UE using the channel measurement corresponding to the first Reporting Setting, determine non-predicted PMI for each of the subband(s) configured by csi-ReportingBand and numberOfPMI-SubbandsPerCQI-Subband, which is corresponding to the -th time instance of the report of the first Reporting Setting, based on the CSI-RS resource(s) whose transmission occasion is contained within the same slot interval of the S-th time instance of the report of the first Reporting Setting in the resource set for channel measurement for the report corresponding to the second Reporting Setting. \u003cUnchanged part omitted> |  |\nFinal CR for Rel-19, TS 38.214 in:\nR1-2601635\tCorrection on Rel-19 AI/ML based CSI prediction\tModerator (LG Electronics), NEC, CATT, Nokia, Pengcheng Laboratory\n(Rel-19, 38.214, NR_AIML_air-Core, CR0735, Cat F) is agreed.\nMCC: To add CR# on cover page before submission to RAN.\nAgreeement:\nAdopt the following TP for TS 38.214 Clause 5.2.1.4.6.\n| Reason for change | 1. when N4=1, CSI-PAI report is not possible, performance monitoring is not supported; 2. Misalignment between timeinstanceforCSImonitoring-r19 used in TS 38.214 and timeInstanceForCSI-PAI-r19 used in TS 38.331 |\n| --- | --- |\n| Summary of change | 1. Add CSI-PAI report when N4=1; 2. Change timeinstanceforCSImonitoring to timeInstanceForCSI-PAI-r19 |\n| Consequences if not approved | 1. Performance monitoring is not supported for CSI prediction when N4=1; 2. Misaligned parameters for indicating the time instance between TS 38.214 and TS38.331 |\n| 5.2.1.4.6
