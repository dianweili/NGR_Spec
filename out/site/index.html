 CSI-PAI reporting \u003cUnchanged part omitted> - to report CSI-PAI for the second Reporting Setting, the UE is expected to be configured in the second Report Setting with codebookType set to 'typeII-r16' and it shall: determine predicted PMI (see Clause 5.2.2.2.10) for each of the subband(s) configured by csi-ReportingBand and numberOfPMI-SubbandsPerCQI-Subband if 1, or determine predicted PMI (see Clause 5.2.2.2.10 or Clause 5.2.2.2.11) for each of the subband(s) configured by csi-ReportingBand and numberOfPMI-SubbandsPerCQI-Subband for the -th time instance configured by timeInstanceForCSI-PAI-r19timeinstanceforCSImonitoring-r19 in the second Reporting Setting ( , with >1 provided in the first Reporting Setting), based on the CSI prediction performed by the UE using the channel measurement corresponding to the first Reporting Setting, determine non-predicted PMI for each of the subband(s) configured by csi-ReportingBand and numberOfPMI-SubbandsPerCQI-Subband, which is corresponding to the time instance of the report of the first Reporting Setting if 1 or the -th time instance of the report of the first Reporting Setting if >1, based on the CSI-RS resource(s) whose transmission occasion is contained within the same slot of the time instance of the report of the first Reporting Setting if 1 or the S-th time instance of the report of the first Reporting Setting if >1 in the resource set for channel measurement for the report corresponding to the second Reporting Setting. \u003cUnchanged part omitted> |  |\nFinal CR in R1-2601635 (Rel-19, 38.214, NR_AIML_air-Core, CR0735, Cat F) is agreed.", "wg": "RAN1"}, {"agenda_item": "8.1", "agenda_title": "Maintenance on Artificial Intelligence (AI)/Machine Learning (ML) for NR Air Interface", "content_hash": "sha256:30ef49e32ae5d9b70433cc35e52cd7232c8a23fbb3c1bf0e340e7082dbc57067", "depth": "origin", "era": "5G-A", "feature": "ai_air_interface", "first_seen": "2026-10-08", "id": "RAN1-124-8.1-a004", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 4, "source": {"minutes_version": 20, "para": 438}, "summary_zh": null, "tags": [], "text_en": "Adopt the following TP for TS 38.214 Clause 5.2.1.6.\nReason for change: CPU duration for UE-sided data collection for CSI prediction is not captured correctly.\nSummary of change: Reflect the RAN1 agreements accurately in Section 5.2.1.6 of TS 38.214.", "wg": "RAN1"}, {"agenda_item": "8.1", "agenda_title": "Maintenance on Artificial Intelligence (AI)/Machine Learning (ML) for NR Air Interface", "content_hash": "sha256:81b199610c3108017b6f204f6d67a310b3b463d681e20ccad68af0a8fa60a0ab", "depth": "origin", "era": "5G-A", "feature": "ai_air_interface", "first_seen": "2026-10-08", "id": "RAN1-124-8.1-a005", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 5, "source": {"minutes_version": 20, "para": 442}, "summary_zh": null, "tags": [], "text_en": "For CSI prediction using UE-side model, for data collection for training,\nOCPU=1\nthe CPU occupancy starts from the first symbol of each P/SP-CSI-RS occasion till Z3’ symbols after the P/SP-CSI-RS occasion.\nConsequence if not approved: Incorrect behaviour for CPU duration.\n| 5.2.1.6 CSI processing criteria \u003c Unchanged parts are omitted > For a CSI report with CSI-ReportConfig with higher layer parameter reportQuantity set to 'none' and CSI-RS-ResourceSet with higher layer parameter trs-Info not configured, or reportQuantity set to 'none-bm-r19', the CPU(s) are occupied for a number of OFDM symbols as follows: - A semi-persistent CSI report (excluding an initial semi-persistent CSI report on PUSCH after the PDCCH triggering the report) occupies CPU(s) from the first symbol of the earliest one of each transmission occasion of periodic or semi-persistent CSI-RS/SSB resource for channel measurement for L1-RSRP computation, until symbols after the last symbol of the latest one of the CSI-RS/SSB resource for channel measurement for L1-RSRP computation in each transmission occasion. - An aperiodic CSI report occupies CPU(s) from the first symbol after the PDCCH triggering the CSI report until the last symbol between symbols after the first symbol after the PDCCH triggering the CSI report and symbols after the last symbol of the latest one of each CSI-RS/SSB resource for channel measurement for L1-RSRP computation. For a CSI report with CSI-ReportConfig with higher layer parameter reportQuantity set to 'none-csi-r19', the CPU(s) are occupied for a number of OFDM symbols as follows: - CSI report occupies CPU(s) from the first symbol of each transmission occasion of periodic or semi-persistent CSI-RS resource for channel measurement, until symbols after the transmission occasion of periodic or semi-persistent CSI-RS resource for channel measurement in each transmission occasion. where are defined in the table 5.4-2. \u003c Unchanged parts are omitted > |\n| --- |\nFinal CR in R1-2601635 (Rel-19, 38.214, NR_AIML_air-Core, CR0735, Cat F) is agreed.", "wg": "RAN1"}, {"agenda_item": "8.1", "agenda_title": "Maintenance on Artificial Intelligence (AI)/Machine Learning (ML) for NR Air Interface", "content_hash": "sha256:a2638b1783339f4174485c0e201b71ed756cc40d5439a2b3e31e7de961f0f928", "depth": "origin", "era": "5G-A", "feature": "ai_air_interface", "first_seen": "2026-10-08", "id": "RAN1-124-8.1-c001", "impact": null, "kind": "conclusion", "llm_status": "skipped_by_depth", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 1, "source": {"minutes_version": 20, "para": 449}, "summary_zh": null, "tags": [], "text_en": "There is no consensus in RAN1 to further discuss on CMR configuration alignment between CSI-pai report and inference report for CSI prediction.\nR1-2601566\tSummary #2 of maintenance on CSI prediction\tModerator (LG Electronics)", "wg": "RAN1"}, {"agenda_item": "9.1.1", "agenda_title": "CSI spatial/frequency compression without temporal aspects (“Case 0”)", "content_hash": "sha256:1c30ca0bd81997e83732ad5fb13180239d5e50dfade1af29f8b9e86ff131abfb", "depth": "origin", "era": "5G-A", "feature": "ai_air_interface", "first_seen": "2026-10-08", "id": "RAN1-124-9.1.1-a001", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 1, "source": {"minutes_version": 20, "para": 1207}, "summary_zh": null, "tags": [], "text_en": "For precoding matrix feedback via two-sided model, support following payload combination for the payload of 384 bits of rank 1. The layers are reported in the order of decreasing strength.\n| Rank1 | Rank2 | Rank3 | Rank4 |\n| --- | --- | --- | --- |\n| {192, 2} | {192, 2}, {192, 2} | {96, 2}, {96, 2}, {192, 2} | {96, 2}, {96, 2}, {96, 2}, {96, 2} |", "wg": "RAN1"}, {"agenda_item": "9.1.1", "agenda_title": "CSI spatial/frequency compression without temporal aspects (“Case 0”)", "content_hash": "sha256:1ba2afff62e7d2d9ff8e7d2c2c9fa30454f76ba2efc411d4a669d7a585814c91", "depth": "origin", "era": "5G-A", "feature": "ai_air_interface", "first_seen": "2026-10-08", "id": "RAN1-124-9.1.1-a002", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 2, "source": {"minutes_version": 20, "para": 1210}, "summary_zh": null, "tags": [], "text_en": "For precoding matrix feedback via two-sided model, support following payload combination for the payload of 32/64 bits of rank 1. The layers are reported in the order of decreasing strength.\n| Rank1 | Rank2 | Rank3 | Rank4 |\n| --- | --- | --- | --- |\n| {32, 1} | {32, 1}, {32, 1} | N/A | N/A |\n| {32, 2} | {32, 2}, {32, 2} | {32, 1}, {32, 1}, {32, 2} | {32, 1}, {32, 1}, {32, 1}, {32, 1} |\nNote: UE should report whether or not the UE supports parameter combination or per-layer payload pair {32,1} or Q=1.  Details of the reporting method is to be discussed in corresponding UE feature discussion.\nR1-2601253\tFL summary 2 on 9.1.1 for CSI compression via two-sided model\tModerator (Qualcomm Incorporated)\nFrom Wednesday session", "wg": "RAN1"}, {"agenda_item": "9.1.1", "agenda_title": "CSI spatial/frequency compression without temporal aspects (“Case 0”)", "content_hash": "sha256:93b382de0733366f4b64f023878818cf958419e432139cfa1ec8f6a9cdfac380", "depth": "origin", "era": "5G-A", "feature": "ai_air_interface", "first_seen": "2026-10-08", "id": "RAN1-124-9.1.1-a003", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 3, "source": {"minutes_version": 20, "para": 1216}, "summary_zh": null, "tags": [], "text_en": "Down-select up to two options from the following options for target CSI format for NW side data collection at RAN1#124bis.\nOption 1a-33: real / imaginary part quantization via 3-bit, i.e., k1=k2=3\nOption 1a-55: real / imaginary part quantization via 5-bit, i.e., k1=k2=5\nOption 1b-34: amplitude quantization via 3-bit, phase quantization via 4-bit, k1=3, k2=4\nOption 1b-46: amplitude quantization via 4-bit, phase quantization via 6-bit, k1=4, k2=6\nNote1: SGCS metric 1 is used as the metric, i.e., SGCS between target CSI FL32 and reconstructed CSI inferred by model trained using target CSI of the respective format.\nNote2: Companies should try to optimize the normalization methods to minimize the quantization error, e.g., for each target CSI sample on a subband and a layer, normalized according to the amplitude of the strongest coefficients or real/imaginary part (Alt2-1).\nNote3: If two options are selected  they should belong to the same category (i.e. 1a or 1b).", "wg": "RAN1"}, {"agenda_item": "9.1.1", "agenda_title": "CSI spatial/frequency compression without temporal aspects (“Case 0”)", "content_hash": "sha256:69bf69146c093cadddc9f3ea202129e2a3c2d657f5fbc996884a397a3492d6c4", "depth": "origin", "era": "5G-A", "feature": "ai_air_interface", "first_seen": "2026-10-08", "id": "RAN1-124-9.1.1-a004", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 4, "source": {"minutes_version": 20, "para": 1225}, "summary_zh": null, "tags": [], "text_en": "Support layer-based UCI mapping and omission.\nFFS the details of layer-grouping to facilitate CSI mapping and omission.\nNote: Partial omission of layers is not supported.\nR1-2601254\tFL summary 3 on 9.1.1 for CSI compression via two-sided model\tModerator (Qualcomm Incorporated)\nFrom Friday session", "wg": "RAN1"}, {"agenda_item": "9.1.1", "agenda_title": "CSI spatial/frequency compression without temporal aspects (“Case 0”)", "content_hash": "sha256:8d44ad531b67064c9d81aa97cb727368111fd9e569f73574dc721fdb0080f312", "depth": "origin", "era": "5G-A", "feature": "ai_air_interface", "first_seen": "2026-10-08", "id": "RAN1-124-9.1.1-a005", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 5, "source": {"minutes_version": 20, "para": 1231}, "summary_zh": null, "tags": [], "text_en": "For the evaluation of the target CSI format options for NW side data collection, consider following quantization values:\nFor real / image part quantization of option 1a, consider\nCB1:  for , j=1, 2\nCompanies are encouraged to apply different scaling factor for CB1.\nFor amplitude / phase quantization of option 1b, consider\nAmplitude: Reuse e-Type II quantization tables. Replace the value of reserved codepoints to (1/2)15/4.\nPhase: uniform distribution, , for", "wg": "RAN1"}, {"agenda_item": "9.1.1", "agenda_title": "CSI spatial/frequency compression without temporal aspects (“Case 0”)", "content_hash": "sha256:c0ad637d3a0ed9e60840d700685bef3e056883ac87503ebca52a8d89e0e351d1", "depth": "origin", "era": "5G-A", "feature": "ai_air_interface", "first_seen": "2026-10-08", "id": "RAN1-124-9.1.1-c001", "impact": null, "kind": "conclusion", "llm_status": "skipped_by_depth", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 1, "source": {"minutes_version": 20, "para": 1239}, "summary_zh": null, "tags": [], "text_en": "There is no consensus on determining the actual payload size of the inference report based on UE indications other than RI.", "wg": "RAN1"}, {"agenda_item": "9.1.1", "agenda_title": "CSI spatial/frequency compression without temporal aspects (“Case 0”)", "content_hash": "sha256:268f8062840be6fec26e29ce7a97ccff44b0a9ce3606edb2952b78ed93a11fbe", "depth": "origin", "era": "5G-A", "feature": "ai_air_interface", "first_seen": "2026-10-08", "id": "RAN1-124-9.1.1-c002", "impact": null, "kind": "conclusion", "llm_status": "skipped_by_depth", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 2, "source": {"minutes_version": 20, "para": 1241}, "summary_zh": null, "tags": [], "text_en": "Configuration of pairing ID in the CSI report for inference is sufficient to distinguish the CSI feedback with two-sided model with other legacy CSI reports.\nFinal summary in R1-2601255.", "wg": "RAN1"}, {"agenda_item": "9.1.2", "agenda_title": "Inter-vendor training collaboration for two-sided AI/ML models", "content_hash": "sha256:533848427c4a86944b8f62600d0a2006c8df8577fa446a01cf7c162ec77b3852", "depth": "origin", "era": "5G-A", "feature": "ai_air_interface", "first_seen": "2026-10-08", "id": "RAN1-124-9.1.2-a001", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 1, "source": {"minutes_version": 20, "para": 1281}, "summary_zh": null, "tags": [], "text_en": "For Option 4-1 under Direction A in AI/ML based CSI compression, for target CSI format, adopt scalar quantization (same format as NW side data collection).\nFFS: Larger k1 and k2 values can be considered as opposed to NW data collection.", "wg": "RAN1"}, {"agenda_item": "9.1.2", "agenda_title": "Inter-vendor training collaboration for two-sided AI/ML models", "content_hash": "sha256:13669313cb1069f6674f9d3d1c26907e0a32f4d338bf0a1ff47e31855145e761", "depth": "origin", "era": "5G-A", "feature": "ai_air_interface", "first_seen": "2026-10-08", "id": "RAN1-124-9.1.2-a002", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 2, "source": {"minutes_version": 20, "para": 1284}, "summary_zh": null, "tags": [], "text_en": "For model pairing procedure at least for inference, a pairing ID corresponding to Direction C is associated with a fully standardized reference model.\nR1-2601151\tFL summary # 2 for inter-vendor training collaboration\tModerator (Apple)\nFrom Wednesday session", "wg": "RAN1"}, {"agenda_item": "9.1.2", "agenda_title": "Inter-vendor training collaboration for two-sided AI/ML models", "content_hash": "sha256:b1d2197cd96b842cbe79e1af2f770077f0a596151093a9e409b9198f7ce33b3b", "depth": "origin", "era": "5G-A", "feature": "ai_air_interface", "first_seen": "2026-10-08", "id": "RAN1-124-9.1.2-a003", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 3, "source": {"minutes_version": 20, "para": 1288}, "summary_zh": null, "tags": [], "text_en": "For Direction A Option 3a-1, support exchange of single pairing ID along with model parameter exchange corresponding to the standardized reference encoder model structure.\nR1-2601152\tFL summary # 3 for inter-vendor training collaboration\tModerator (Apple)\nFrom Friday session", "wg": "RAN1"}, {"agenda_item": "9.1.2", "agenda_title": "Inter-vendor training collaboration for two-sided AI/ML models", "content_hash": "sha256:7ccacb5695517fa0438db9bfa8e86bd01f4d0e9de8b625715ab1f7f9ae346c8d", "depth": "origin", "era": "5G-A", "feature": "ai_air_interface", "first_seen": "2026-10-08", "id": "RAN1-124-9.1.2-a004", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 4, "source": {"minutes_version": 20, "para": 1296}, "summary_zh": null, "tags": [], "text_en": "The draft LS R1-2601717 is endorsed with the following changes and re-arrangement of the paragraph before the table.\nBased on the above RAN4 LS, RAN1 will work on the signaling design and parameter set exchange to support Direction A option 3a-1, RAN1 assumes that the RAN4 specified reference model structure(s) will be scalable across different number of Tx ports, and/or different subbands configurations, and/or different CSI payload size configurations.\nRAN1 agreed the following CSI payload size configurations of different {d, Q} for SQ, where d denotes the length of latent message and Q denotes the number of quantization bit(s) per element in the latent message. Support of {32,1} is up to UE capability.\nThe final LS is approved in R1-2601718.\nFinal summary in R1-2601153.", "wg": "RAN1"}, {"agenda_item": "9.1.2", "agenda_title": "Inter-vendor training collaboration for two-sided AI/ML models", "content_hash": "sha256:a8a16991ff0d1a011c762a17f889df5c238141c3e30b1ba06687c5cbf9ebe5f0", "depth": "origin", "era": "5G-A", "feature": "ai_air_interface", "first_seen": "2026-10-08", "id": "RAN1-124-9.1.2-c001", "impact": null, "kind": "conclusion", "llm_status": "skipped_by_depth", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 1, "source": {"minutes_version": 20, "para": 1292}, "summary_zh": null, "tags": [], "text_en": "For the signaling discussion of direction A option 3a-1, RAN1 assumes the same model parameter description format for parameter exchange as RAN4 will use to describe the reference model in Direction C.\nNote: RAN1 will not discuss dedicated model parameter description format for option 3a-1.\nR1-2601717\tDraft LS on RAN1 inquiry about the scalability of the option 3a-1 model structure\tModerator (Apple)", "wg": "RAN1"}, {"agenda_item": "9.5.1", "agenda_title": "Evaluation assumptions and performance evaluation", "content_hash": "sha256:aeeaf4566f0a4fc0908db9be7835fc164a58e1b556a576504099e0babbb38ac4", "depth": "origin", "era": "5G-A", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-124-9.5.1-a001", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 1, "source": {"minutes_version": 20, "para": 3439}, "summary_zh": null, "tags": [], "text_en": "The definition on time stamp from existing specifications, e.g., TS 38.455, TS 38.355, TS 37.355 are reused as baseline.\nNo more discussion on time stamp is expected from RAN1 study perspective.", "wg": "RAN1"}, {"agenda_item": "9.5.1", "agenda_title": "Evaluation assumptions and performance evaluation", "content_hash": "sha256:b29b65847c9f0332ee650fcdffedd9ac27fa63e81a66d80fcd9279f11c7b6bf5", "depth": "origin", "era": "5G-A", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-124-9.5.1-a002", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 2, "source": {"minutes_version": 20, "para": 3442}, "summary_zh": null, "tags": [], "text_en": "From RAN1 perspective, the measurement of Level D reported from RAN is per gNB.\nNote: RAN1’s understanding is that gNB can associate with one or multiple TRPs.\nR1-2601381\tSummary #2 on evaluations for NR ISAC\tModerator (Xiaomi)\nFrom Tuesday session\nR1-2601594\tTP on Reference_6.2_6.3.0_6.3.1_AnnexB in TR 38.765\tModerator (Xiaomi)", "wg": "RAN1"}, {"agenda_item": "9.5.1", "agenda_title": "Evaluation assumptions and performance evaluation", "content_hash": "sha256:79c6fd50c7fe066733a16717b03322d10898104d7e9a6e2f5633239b3119dd5b", "depth": "origin", "era": "5G-A", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-124-9.5.1-a003", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 3, "source": {"minutes_version": 20, "para": 3448}, "summary_zh": null, "tags": [], "text_en": "The Text Proposal to TR 38.765 in R1-2601594 is endorsed.\nR1-2601595\tTP on 6.3.2 in TR 38.765\tModerator (Xiaomi)", "wg": "RAN1"}, {"agenda_item": "9.5.1", "agenda_title": "Evaluation assumptions and performance evaluation", "content_hash": "sha256:c4b8481a8fda68f2ed7a8c6613a9c7da005907909a53dbb039dfcf1e871b1c5a", "depth": "origin", "era": "5G-A", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-124-9.5.1-a004", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 4, "source": {"minutes_version": 20, "para": 3451}, "summary_zh": null, "tags": [], "text_en": "The Text Proposal to TR 38.765 in R1-2601595 is endorsed.\nR1-2601596\tTP on 6.3.3 in TR 38.765\tModerator (Xiaomi)", "wg": "RAN1"}, {"agenda_item": "9.5.1", "agenda_title": "Evaluation assumptions and performance evaluation", "content_hash": "sha256:5166a5fa2a9a619fe7d79ea67430f063c0ed727ce9f9865f90dbf584ca8272b7", "depth": "origin", "era": "5G-A", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-124-9.5.1-a005", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 5, "source": {"minutes_version": 20, "para": 3454}, "summary_zh": null, "tags": [], "text_en": "The Text Proposal to TR 38.765 in R1-2601596 is endorsed", "wg": "RAN1"}, {"agenda_item": "9.5.1", "agenda_title": "Evaluation assumptions and performance evaluation", "content_hash": "sha256:b0d2534c917ac41185ca7f8b9571ee9bc54e6c5d389451bd57a57cc2f3a38337", "depth": "origin", "era": "5G-A", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-124-9.5.1-a006", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 6, "source": {"minutes_version": 20, "para": 3456}, "summary_zh": null, "tags": [], "text_en": "From RAN1 perspective, on measurement quantization of Level C/D for position/velocity measurement, quantization methods in existing specifications, e.g., TS 23.032, TS 38.455, TS 38.355, TS 37.355 can be considered.\nFrom RAN1 perspective, on measurement quantization of Level C for delay/angle measurement, quantization methods in existing specifications, e.g., TS 38.133 can be considered.\nFor Doppler measurement, same number of quantized bits as radial velocity can be considered.\nNote: above does not take into account the potential impact from measurement quantization on the sensing performance.", "wg": "RAN1"}, {"agenda_item": "9.5.1", "agenda_title": "Evaluation assumptions and performance evaluation", "content_hash": "sha256:9764ce31d1e004c186c6ab5830418cfea0982bc3d028d9e0eadc03f94d3ed6d1", "depth": "origin", "era": "5G-A", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-124-9.5.1-a007", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 7, "source": {"minutes_version": 20, "para": 3461}, "summary_zh": null, "tags": [], "text_en": "The velocity measurement of Option C1/C3/C4 is radial velocity.\nR1-2601382\tSummary #3 on evaluations for NR ISAC\tModerator (Xiaomi)\nFrom Wednesday session", "wg": "RAN1"}, {"agenda_item": "9.5.1", "agenda_title": "Evaluation assumptions and performance evaluation", "content_hash": "sha256:ced4d8fbcd9f0e8c1acab419cf491167ef82303ab461771830e9f90ff48091c2", "depth": "origin", "era": "5G-A", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-124-9.5.1-a008", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 8, "source": {"minutes_version": 20, "para": 3465}, "summary_zh": null, "tags": [], "text_en": "The following Text Proposal to Conclusion section in TR 38.765 is endorsed.\n| The performance for UAV sensing use case with gNB monostatic sensing is evaluated based on the evaluation assumptions in Annex A (including UMa-AV, Sensing Tx/Rx operating simultaneously, FR1), with detailed assumptions and modelling reported by the companies as captured in Annex B. Among all the reported evaluation results as captured in Annex B, Baseline 1 (high BS TX power 52dBm with 80dB antenna isolation) By utilizing measurements from multiple or all TRPs, results from 9/10 sources achieve the performance objectives. By utilizing measurements from single TRP, results from 3/11 sources achieve the performance objectives. Baseline 2 (low BS TX power 37dBm with 65dB antenna isolation) By utilizing measurements from multiple or all TRPs, results from 7/9 sources achieve the performance objectives. By utilizing measurements from single TRP, results from 2/9 sources achieve the performance objectives |\n| --- |", "wg": "RAN1"}, {"agenda_item": "9.5.1", "agenda_title": "Evaluation assumptions and performance evaluation", "content_hash": "sha256:27591a610694b8d828910bd7694201b027b9751ab9197b6642f6f1118d060b1b", "depth": "origin", "era": "5G-A", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-124-9.5.1-a009", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 9, "source": {"minutes_version": 20, "para": 3472}, "summary_zh": null, "tags": [], "text_en": "The velocity measurement of Option D1/D4 is 3D velocity, optional radial velocity.\nNote: in the deployment where 3D velocity cannot be reported, Level D should not be reported.", "wg": "RAN1"}, {"agenda_item": "9.5.1", "agenda_title": "Evaluation assumptions and performance evaluation", "content_hash": "sha256:0b2dbc2e651aabe19ef3f4484ed05fd711605c6df3350626732a5dec43748001", "depth": "origin", "era": "5G-A", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-124-9.5.1-a010", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 10, "source": {"minutes_version": 20, "para": 3475}, "summary_zh": null, "tags": [], "text_en": "The velocity measurement of Option C2/C5 is radial velocity.", "wg": "RAN1"}, {"agenda_item": "9.5.1", "agenda_title": "Evaluation assumptions and performance evaluation", "content_hash": "sha256:4c32724ee03388069bcde1db87d3753dc43336bf98409fa4130473206ad1c0f5", "depth": "origin", "era": "5G-A", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-124-9.5.1-a011", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 11, "source": {"minutes_version": 20, "para": 3479}, "summary_zh": null, "tags": [], "text_en": "Confirm the definition of measurement Level B by removing the square brackets\nLevel B: Amplitude and phase profile of delay, and/or Doppler, and/or angle per TRP for a given time stamp by using window(s) of the [consecutive] samples in at least one profile of delay, and/or Doppler and/or angle domain\nR1-2601383\tSummary #4 on evaluations for NR ISAC\tModerator (Xiaomi)\nFrom Thursday session", "wg": "RAN1"}, {"agenda_item": "9.5.1", "agenda_title": "Evaluation assumptions and performance evaluation", "content_hash": "sha256:08bdbf07b6eee0c2b7c16ffc61fd1ea36281c3e24b0b1fa7c928c41253445b44", "depth": "origin", "era": "5G-A", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-124-9.5.1-a012", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 12, "source": {"minutes_version": 20, "para": 3484}, "summary_zh": null, "tags": [], "text_en": "From RAN1 perspective, the following methods can be considered to define the quantization for the measurements of Level A/B,\ne.g., floating point, uniform scalar, non-uniform scalar\nother quantization method is not precluded.\nNote: above doesn’t take into account the potential impact from the measurement quantization on sensing performance.\nNote: No more discussion on measurement quantization on Level A/B is expected in the study item from RAN1 perspective.", "wg": "RAN1"}, {"agenda_item": "9.5.1", "agenda_title": "Evaluation assumptions and performance evaluation", "content_hash": "sha256:5519201fe10d299f5d9041c7f6c6209d45556a32a62567e71bbc1061c02c2896", "depth": "origin", "era": "5G-A", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-124-9.5.1-a013", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 13, "source": {"minutes_version": 20, "para": 3490}, "summary_zh": null, "tags": [], "text_en": "From RAN1 perspective, the metric related to power can be considered for Level C measurement report.\nFrom RAN1 perspective, the metric related to power (if applicable) can be considered for Level D measurement report.\nNote: metric related to power may be different from those defined for communication and between Level C and Level D.\nFrom RAN1 perspective, confidence metrics for the measurements can be considered for Level C/D measurement report.\nNo more discussion on the metric related to power and confidence metrics is expected in the study item from RAN1 study perspective.", "wg": "RAN1"}, {"agenda_item": "9.5.1", "agenda_title": "Evaluation assumptions and performance evaluation", "content_hash": "sha256:08bbc4a57448908186285aa17d309e3447db9ce5690e2bfefe2a9dabae799769", "depth": "origin", "era": "5G-A", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-124-9.5.1-a014", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 14, "source": {"minutes_version": 20, "para": 3496}, "summary_zh": null, "tags": [], "text_en": "For Level C, at least the following examples of assistance information are identified as needed to assist the further processing at Sensing Function. The assistance information may or may not be provided by RAN.\nLocation of TRP if at least delay/range, Doppler/radial velocity or angle is reported.\nIf a measurement is reported in LCS, LCS to GCS transformation information.\nFor level D, if radial velocity is not reported, no assistance information is identified from RAN1 perspective.\nNo more discussion on the assistance information on Level C/D from RAN to SF is expected in the study item from RAN1 perspective.\nR1-2601384\tSummary #5 on evaluations for NR ISAC\tModerator (Xiaomi)\nFrom Thursday session", "wg": "RAN1"}, {"agenda_item": "9.5.1", "agenda_title": "Evaluation assumptions and performance evaluation", "content_hash": "sha256:20b49eddd9d443610e23d4caa3a718f84b6c402a68f51fb7adc0150692db7fec", "depth": "origin", "era": "5G-A", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-124-9.5.1-a015", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 15, "source": {"minutes_version": 20, "para": 3504}, "summary_zh": null, "tags": [], "text_en": "From RAN1 perspective, on measurement quantization of Level C/D for confidence metric, the existing specifications, e.g., TS 23.032, TS 38.455, TS 38.355, TS 37.355 can be considered.\nNote: above does not take into account the potential impact from measurement quantization on the sensing performance.\nNote: No more discussion on measurement quantization on Level C/D for the metric related to power and confidence metric is expected in the study item from RAN1 perspective", "wg": "RAN1"}, {"agenda_item": "9.5.1", "agenda_title": "Evaluation assumptions and performance evaluation", "content_hash": "sha256:f533cec3a59297d8c9448e321ee2eb413a02991933c28538de0d98687f38ed6d", "depth": "origin", "era": "5G-A", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-124-9.5.1-a016", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 16, "source": {"minutes_version": 20, "para": 3508}, "summary_zh": null, "tags": [], "text_en": "For Level A/B, at least the following examples of assistance information are identified as needed to assist the further processing at Sensing Function. The assistance information may or may not be provided by RAN.\nLevel A\nLocation of TRP\nStep size in delay domain if samples in delay domain is reported\nTime information related to OFDM symbols used for measurement\nAntenna configuration and/or beam information\nLevel B\nLocation of TRP\nLCS to GCS transformation information\nInformation related to sampling of delay, doppler and/or angle profile\nAdditional assistance information is not precluded\nNo more discussion on the assistance information on Level A/B from RAN to SF is expected in the study item from RAN1 perspective", "wg": "RAN1"}, {"agenda_item": "9.5.1", "agenda_title": "Evaluation assumptions and performance evaluation", "content_hash": "sha256:9d58e0674990653c678a849c1d58d123a5c75aa08e806188672ee02d79d8351f", "depth": "origin", "era": "5G-A", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-124-9.5.1-a017", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 17, "source": {"minutes_version": 20, "para": 3521}, "summary_zh": null, "tags": [], "text_en": "The payload size estimation of each measurement level/option for NR ISAC can be done by the following formulas\nLevel A: Msubcarrier* Ncpi *Mtxport*Nrxport*Ntrp*(Nquan1+ Nquan2)\nWhere,\nMsubcarrier: number of subcarriers in a OFDM symbols\nNcpi: number of OFDM symbols within CPI\nMtxport: number of reference signal antenna port for sensing purpose\nNrxport: number of Rx antenna ports\nNtrp: number of TRPs for payload size calculation\nNquan1: number of quantized bits for amplitude\nNquan2: number of quantized bits for angle\nLevel B:\nDelay-Doppler Profile: Mdelay *Ndoppler *Mtxport* Nrxport *Ntrp *(Nquan1+ Nquan2)\nDelay-angle Profile: Mdelay * Ncpi *Mtxport*Nangle *Ntrp *(Nquan1+ Nquan2)\nDelay-Doppler-angle Profile: Mdelay *Ndoppler *Mtxport*Nangle *Ntrp *(Nquan1+ Nquan2)\nDelay Profile: Mdelay *Ncpi*Mtxport*Nrxport *Ntrp *(Nquan1+ Nquan2)\nWhere,\nMdelay: number of delay samples in the window\nNdoppler: number of Doppler samples in the window\nNangle: number of angle samples in the window\nLevel C:\nC1/C2/C3: Np1*Ntrp *\nC4/C5: Np2*Ntrp *\nWhere,\nNp1 is total number of paths\nNp2 is total number of points\nNparam is 5 including e.g.,\nC1/C3/C4: delay, Doppler, horizontal angle, vertical angle, power measurement\nC2/C5: position (x, y, z), radial velocity, power measurement\nNquan,i: number of quantized bits\nNtrp: number of TRPs for payload size calculation\nLevel D:\nNobject*Ngnb * for options D1/2\nMpoints* Ngnb * for options D3/4\nWhere,\nNobject is total number of targets\nMpoints is total number of scattering points of all targets\nNgnb is fixed to 1", "wg": "RAN1"}, {"agenda_item": "9.5.1", "agenda_title": "Evaluation assumptions and performance evaluation", "content_hash": "sha256:0396c7faea22079e7d5c8d16643dc6cf93b7a6279029ff51e7c75184ea669d97", "depth": "origin", "era": "5G-A", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-124-9.5.1-a018", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 18, "source": {"minutes_version": 20, "para": 3559}, "summary_zh": null, "tags": [], "text_en": "The following assumptions on the parameters can be used to estimate payload size of different Levels/Options of measurements for NR ISAC for calculation purpose\n| Parameters | Assumptions | Relation to maximum payload calculation |\n| --- | --- | --- |\n| Nsubcarriers | 3276 for 100MHz, 30kHz SCS |  |\n| Ncpi | Min 64, medium 160, max 320 symbols per CPI |  |\n| Mtxport | 1, medium 4, max 9 | Note: value obtained based on evaluation assumptions |\n| Nrxport | 64 |  |\n| Ntrp | 3 |  |\n| Ngnb | 1 |  |\n| Nquan1, i.e., amplitude | Min 16, medium 16, max 32 |  |\n| Nquan2, i.e., phase | Min 16, medium 16, max 32 |  |\n|  | Min 16, medium 16, max 32 |  |\n| Mdelay | Min 288 (CP length, UMa) Medium/max: 467 for 2*570m (UMa) Max: 1436 for 2*1732m (RMa) |  |\n| Ndoppler | same as Ncpi |  |\n| Nangle | B2/B3: 32, 360 | Note: value obtained based on evaluation assumptions Note: 32 assumes non-uniform sampling Note: 360 assumes uniform oversampling |\n| Np | 30, 60, 120 | to calculate min/medium/max for Level-C Note: value obtained based on evaluation assumptions |\n| Nobject for D1/D2 | 15 | Note: value obtained based on evaluation assumptions |\n| Mpoints for D3/D4 | 20 | Note: value obtained based on evaluation assumptions |\nFor Level C\nNparam=5 parameters for measurements\nFor Level D\nNparam=7 parameters for measurements\nfor D2/D3/D4, one more parameter of target ID is assumed\nNote: for B2/B3, minimum value and maximum value can be different between non-uniform sampling case and uniform oversampling case\nNote: RAN1 does not require all the parameters to take the minimum values at the same time or the maximum values at the same time\nNote: above does not take into account the potential impact from measurement quantization on the sensing performance.\nNote: above does not take into account the potential impact of different Levels/Options on the sensing performance.", "wg": "RAN1"}, {"agenda_item": "9.5.1", "agenda_title": "Evaluation assumptions and performance evaluation", "content_hash": "sha256:10cb8b6e6e152cda5592de7c2695bb8868aa694db9d384e6280566ea16979351", "depth": "origin", "era": "5G-A", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-124-9.5.1-a019", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 19, "source": {"minutes_version": 20, "para": 3571}, "summary_zh": null, "tags": [], "text_en": "The following Text Proposal to Conclusion section in TR 38.765 is endorsed.\n| The study in physical layer has identified a number of Levels/Options for measurement report as described in Clause 5. Different Levels/Options for measurement report are associated with different payload overhead, assistance information and other higher layer aspects. |\n| --- |\nR1-2601668\tUpdated evaluation results of NR ISAC\tModerator (Xiaomi)\nR1-2601669\tUpdated evaluation details on NR ISAC reported by companies\tModerator (Xiaomi)\nR1-2601385\tSummary #6 on evaluations for NR ISAC\tModerator (Xiaomi)\nR1-2601701\tSummary #7 on evaluations for NR ISAC\tModerator (Xiaomi)", "wg": "RAN1"}, {"agenda_item": "9.5.1", "agenda_title": "Evaluation assumptions and performance evaluation", "content_hash": "sha256:d42c253e22946d0afde45ec2ffab26fc9af6e1b1a5cd705daea601e2dd86de8d", "depth": "origin", "era": "5G-A", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-124-9.5.1-c001", "impact": null, "kind": "conclusion", "llm_status": "skipped_by_depth", "meeting": 124, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 1, "source": {"minutes_version": 20, "para": 3468}, "summary_zh": null, "tags": [], "text_en": "From RAN1 perspective, the <script>
const DATA = JSON.parse(document.getElementById('ngr-data').textContent);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
// 折叠行里的预览截断必须留标记 —— 否则读者会把半条决议当完整决议读。
// 与 markdown 层的 _preview() 同一约定。
const cut = (s, n) => (s = String(s ?? ''), s.length <= n ? s : s.slice(0, n) + '…');
let filterFeature = null;

function render() {
  const rows = DATA.features.map(f => {
    const evs = DATA.events.filter(e => e.feature === f.slug);
    const agr = evs.filter(e => e.kind === 'agreement');
    const n6 = agr.filter(e => e.era === '6G').length;
    const nl = agr.filter(e => e.era === '5G-A').length;
    return `<tr><td><a href="#" data-slug="${esc(f.slug)}">${esc(f.name_zh)}</a></td>
      <td>${esc(f.stage || '—')}</td>
      <td>${f.has_legacy ? '5G-A→6G' : '6G 原生'}</td>
      <td>${n6} / ${nl}</td>
      <td>${(f.open_issues || []).length}</td></tr>`;
  }).join('');

  const shown = DATA.events.filter(e => !filterFeature || e.feature === filterFeature);
  const items = shown.sort((a, b) => b.meeting - a.meeting ||
      String(b.meeting_suffix || '').localeCompare(String(a.meeting_suffix || ''))).map(e =>
    `<details><summary>[${esc(e.era)} ${esc(e.wg)}#${esc(e.meeting)}${esc(e.meeting_suffix || '')}]
       ${esc(e.agenda_item)} — ${esc(e.summary_zh || cut(e.text_en, 90))}</summary>
     <pre>${esc(e.text_en)}</pre></details>`).join('');

  document.getElementById('board').innerHTML =
    `<table><thead><tr><th>特性</th><th>阶段</th><th>血统</th>
     <th>累计 Agr. (6G/5G-A)</th><th>未决</th></tr></thead><tbody>${rows}</tbody></table>
     <h2>事件（${shown.length} 条）</h2>${items || '<p>无</p>'}`;

  document.querySelectorAll('[data-slug]').forEach(a => a.onclick = ev => {
    ev.preventDefault();
    filterFeature = filterFeature === a.dataset.slug ? null : a.dataset.slug;
    render();
  });
}
render();
</script>
