he UE continues to apply searchSpaceZero and controlResourceSetZero in OD-SIB1 Config. Consequences if not approved: After receiving on-demand SIB1, ambiguity occurs for PDCCH monitoring in a search space set with index 0 or in a CORESET with index 0. 23 UE procedure to request SIB1 reception \u003c Unchanged parts are omitted > When the UE monitors PDCCH according to a CSS set with search space set index 0 or in a CORESET with index 0, or upon receiving a PWS notification or paging indicating system information change [12, TS 38.331], and if for FR1 or for FR2, the UE continues to apply searchSpaceZero and controlResourceSetZero in OD-SIB1 Config. \u003c Unchanged parts are omitted > |\n| --- |\nR1-2606825\tSummary #1 of NES maintenance\tModerator (LG Electronics)", "wg": "RAN1"}, {"agenda_item": "8.1", "agenda_title": "Maintenance on AI/ML for NR Air interface, NR MIMO Phase 5,  NES and NTN for NR and IoT", "content_hash": "sha256:cb921c63887fffdb3b01ab0ec70f09929e1dcbacc4c8c924775dc7fb8d08207b", "depth": "origin", "era": "5G-A", "feature": "ai_air_interface", "first_seen": "2026-10-08", "id": "RAN1-126-8.1-a010", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 10, "source": {"minutes_version": 20, "para": 455}, "summary_zh": null, "tags": [], "text_en": "The following TP for TS 38.211 Clause 6.3.3.1 is endorsed.\nThe corresponding CR for Rel-19, TS 38.211 in R1-2606849 is agreed.\n(Rel-19, TS 38.211, Netw_Energy_NR_enh-Core, CR 0184, Cat F)\n| Reason for change: The parameter sib1-RestrictedSetConfig of UL-WUS configuration for SIB1 request in TS 38.331 is not captured in TS 38.211. Summary of change: Add description for parameter sib1-RestrictedSetConfig of TS 38.211 according to the IE sib1-RestrictedSetConfig defined in the TS 38.331. Consequence if not approved: Ambiguity occurs for the sib1-RestrictedSetConfig for on demand SIB1. 6.3.3 Physical random-access channel 6.3.3.1 Sequence generation The set of random-access preambles shall be generated according to from which the frequency-domain representation shall be generated according to where , , , or depending on the PRACH preamble format as given by Tables 6.3.3.1-1 and 6.3.3.1-2. There are 64 preambles defined in each time-frequency PRACH occasion, enumerated in increasing order of first increasing cyclic shift of a logical root sequence, and then in increasing order of the logical root sequence index, starting with the index obtained from the higher-layer parameter - prach-RootSequenceIndex or rootSequenceIndex-BFR or by msgA-PRACH-RootSequenceIndex if configured and a type-2 random-access procedure is initiated as described in clause 8.1 of [5, TS 38.213], or by - prach-RootSequenceIndex in EarlyUL-SyncConfig if the PRACH transmission is for a candidate cell, or by - prach-RootSequenceIndex in RACH-ConfigTwoTA if the PRACH transmission is associated with an additional PCI different from serving cell PCI, or by - prach-RootSequenceIndex in SIB1-RequestConfig if the PRACH transmission is for SIB1 request. Additional preamble sequences, in case 64 preambles cannot be generated from a single root Zadoff-Chu sequence, are obtained from the root sequences with the consecutive logical indexes until all the 64 sequences are found. The logical root sequence order is cyclic; the logical index 0 is consecutive to . The sequence number is obtained from the logical root sequence index according to Tables 6.3.3.1-3 to 6.3.3.1-4B. The cyclic shift is given by where is given by Tables 6.3.3.1-5 to 6.3.3.1-7. The type of restricted sets (unrestricted, restricted type A, restricted type B) is given by - the higher-layer parameter msgA-RestrictedSetConfig, if provided; - or the higher-layer parameter ltm-restrictedSetConfig associated with a candidate cell indicated in Cell indicator field of a PDCCH order, if provided; - or the higher-layer parameter twoTA-restrictedSetConfig associated with an additional PCI indicated in PRACH association indicator field of a PDCCH order, if provided; - or the higher-layer parameter sib1-RestrictedSetConfig in SIB1-RequestConfig if the PRACH transmission is for SIB1 request; - otherwise, the higher-layer parameter restrictedSetConfig. \u003c Unchanged Text Omitted > |\n| --- |", "wg": "RAN1"}, {"agenda_item": "8.1", "agenda_title": "Maintenance on AI/ML for NR Air interface, NR MIMO Phase 5,  NES and NTN for NR and IoT", "content_hash": "sha256:16fade752d3d164acb5ad1664596d496b146a5a7950b381f244340650ad81ca9", "depth": "origin", "era": "5G-A", "feature": "ai_air_interface", "first_seen": "2026-10-08", "id": "RAN1-126-8.1-a011", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 11, "source": {"minutes_version": 20, "para": 460}, "summary_zh": null, "tags": [], "text_en": "The following TP for TS 38.213 Clause 11.1 is endorsed.\nThe corresponding CR for Rel-19, TS 38.213 in R1-2606850 is agreed.\n(Rel-19, TS 38.213, Netw_Energy_NR_enh-Core, CR 0781, Cat F)\n| Reason for change: The slot configuration for on demand SIB1 is unclear due to missing IE sib1-tdd-UL-DL-ConfigurationCommon. Summary of change: Add missing IE sib1-tdd-UL-DL-ConfigurationCommon for slot configuration for on demand SIB1. The SSB symbols indicated by OD-SIB1-Config cannot be indicated as uplink by sib1-tdd-UL-DL-ConfigurationCommon, and the PRACH symbols indicated by OD-SIB1-Config cannot be indicated as downlink by sib1-tdd-UL-DL-ConfigurationCommon. Consequence if not approved: Ambiguity occurs for the slot configuration for on demand SIB1. 11.1 Slot configuration A slot format includes downlink symbols, uplink symbols, and flexible symbols. The following are applicable for each serving cell. If a UE is provided tdd-UL-DL-ConfigurationCommon or sib1-tdd-UL-DL-ConfigurationCommon, the UE sets the slot format per slot over a number of slots as indicated by tdd-UL-DL-ConfigurationCommon or sib1-tdd-UL-DL-ConfigurationCommon. The tdd-UL-DL-ConfigurationCommon or sib1-tdd-UL-DL-ConfigurationCommon provides - a reference SCS configuration by referenceSubcarrierSpacing - a pattern1. The pattern1 provides - a slot configuration period of msec by dl-UL-TransmissionPeriodicity - a number of slots with only downlink symbols by nrofDownlinkSlots - a number of downlink symbols by nrofDownlinkSymbols - a number of slots with only uplink symbols by nrofUplinkSlots - a number of uplink symbols by nrofUplinkSymbols A value msec is valid only for , . A value msec is valid only for , . A value msec is valid only for,. A value msec is valid only for , or . A slot configuration period of msec includes slots with SCS configuration . From the slots, a first slots include only downlink symbols and a last slots include only uplink symbols. The symbols after the first slots are downlink symbols. The symbols before the last slots are uplink symbols. The remaining are flexible symbols. The first symbol every periods is a first symbol in an even frame. If tdd-UL-DL-ConfigurationCommon or sib1-tdd-UL-DL-ConfigurationCommon provides both pattern1 and pattern2, the UE sets the slot format per slot over a first number of slots as indicated by pattern1 and the UE sets the slot format per slot over a second number of slots as indicated by pattern2. The pattern2 provides - a slot configuration period of msec by dl-UL-TransmissionPeriodicity - a number of slots with only downlink symbols by nrofDownlinkSlots - a number of downlink symbols by nrofDownlinkSymbols - a number of slots with only uplink symbols by nrofUplinkSlots - a number of uplink symbols by nrofUplinkSymbols The applicable values of are same as the applicable values for . A slot configuration period of msec includes first slots and second slots. From the slots, a first slots include only downlink symbols and a last include only uplink symbols. The symbols after the first slots are downlink symbols. The symbols before the last slots are uplink symbols. The remaining are flexible symbols. A UE expects that divides 20 msec. The first symbol every periods is a first symbol in an even frame. A UE expects that the reference SCS configuration is smaller than or equal to a SCS configuration for any configured DL BWP or UL BWP. Each slot provided by pattern1 or pattern2 is applicable to consecutive slots in the active DL BWP or the active UL BWP where the first slot starts at a same time as a first slot for the reference SCS configuration and each downlink or flexible or uplink symbol for the reference SCS configuration corresponds to consecutive downlink or flexible or uplink symbols for the SCS configuration . A downlink or flexible symbol provided by tdd-UL-DL-ConfigurationCommon can include an UL sub-band provided by ul-SubbandlocationAndBandwidth, a first DL sub-band provided by firstDL-SubbandlocationAndBandwidth and may additionally include a second DL sub-band provided by secondDL-SubbandlocationAndBandwidth, for a SCS configuration of any configured UL BWP or DL BWP, respectively, as provided by scs-SpecificCarrierList [4, TS 38.211]. The downlink or flexible symbol is then referred to as an SBFD symbol; otherwise, it is referred to as a non-SBFD symbol. Unless otherwise stated, the UE considers symbols in a slot indicated as downlink and as SBFD by tdd-UL-DL-ConfigurationCommon to be available for transmissions. Uplink symbols by tdd-UL-DL-ConfigurationCommon are non-SBFD symbols. An SBFD symbol or a non-SBFD symbol provided by tdd-UL-DL-ConfigurationCommon cannot change to a non-SBFD symbol or to an SBFD symbol, respectively, by other information. The UE is not provided coresetPoolIndex and is not configured to receive PDSCH according to more than one TCI states mapped to one TCI codepoint [6, TS 38.214] for a serving cell where the UE is provided SBFD symbols. For a PUCCH or a PUSCH transmission in flexible symbols indicated as SBFD by tdd-UL-DL-ConfigurationCommon and associated with PRACH transmission in first PRACH occasions, the UE assumes the flexible symbols as non-SBFD symbols in this RACH attempt. The frequency location of an UL sub-band, or a first DL sub-band, or a second DL sub-band, starts at RB and includes a number of contiguous RBs provided by ul-SubbandlocationAndBandwidth, or firstDL-SubbandlocationAndBandwidth or secondDL-SubbandlocationAndBandwidth, respectively, that indicates an offset and a length as RIV according to [6, TS 38.214], setting , and a value provided by offsetToCarrier for the subcarrierSpacing. SBFD symbols are consecutive, start from a first slot provided by SBFD-StartingSlotIndex and from a first symbol in the first slot provided by SBFD-StartingSymbolIndex, and end in a second slot provided by SBFD-EndingSlotIndex and in a second symbol in the second slot provided by SBFD-EndingSymbolIndex. SBFD symbols can be provided in any of pattern1 and, if provided, pattern2. A configuration period for SBFD symbols is msec when only pattern1 is provided, or when pattern2 is additionally provided. Except for a PRACH transmission in a PRACH occasion determined based on a second RACH configuration provided by sbfd-RACHDualConfig as described in clause 8, the UE transmits or receives a physical channel or signal either only in SBFD symbols or only in non-SBFD symbols. For a PUCCH transmission with SP-CSI reports, or for a PUCCH with SR, LRR, UEIRI, UE doesn’t transmit the PUCCH transmission occasion that is mapped to SBFD symbols and non-SBFD symbols. When the UE is provided sbfd-Config2-Transmission, the UE can - transmit a first PUCCH or PUSCH or a first repetition of a PUCCH or PUSCH in non-SBFD symbols, and - transmit a second PUCCH or PUSCH or a second repetition of the PUCCH or PUSCH, in SBFD symbols When the UE is provided sbfd-Config2-Reception, the UE can - receive a first PDSCH or a first repetition of a PDSCH in non-SBFD symbols, and - receive a second PDSCH or a second repetition of the PDSCH in SBFD symbols When a UE is not provided sbfd-Config2-Transmission - for a PUCCH or PUSCH transmission with repetitions, if the first repetition is either in SBFD symbols or in non-SBFD symbols, the remaining repetitions are also either in SBFD symbols or in non-SBFD symbols, respectively - for a Type 2 CG PUSCH transmission, or for a PUSCH transmission with SP-CSI reports, if the first transmission after a latest activation is either in SBFD symbols or in non-SBFD symbols, the remaining transmissions associated with the latest activation are also either in SBFD symbols or in non-SBFD symbols, respectively - for a Type 1 CG PUSCH, or for a PUCCH transmission with SP-CSI reports, or for a PUCCH with SR, LRR, UEIRI, or P-CSI, or SRS, all respective transmissions are either only in SBFD symbols or only in non-SBFD symbols as indicated by the respective configurations [12, TS 38.331] When a UE is not provided sbfd-Config2-Reception, - for a PDSCH reception with repetitions, if the first repetition is either in SBFD symbols or in non-SBFD symbols, the remaining repetitions are also either in SBFD symbols or in non-SBFD symbols, respectively - for a SPS PDSCH reception, if the first reception after a latest activation is either in SBFD symbols or in non-SBFD symbols, the remaining receptions associated with the latest activation are also either in SBFD symbols or in non-SBFD symbols, respectively In an SBFD symbol, and except for cross-link interference measurements [6, TS 38.214], the UE transmits or receives only in RBs that are both in the active UL BWP and in the UL sub-band, or both in the active DL BWP and the DL sub-band(s), respectively. The UE does not transmit in SBFD symbols indicated for presence of SS/PBCH blocks within the active DL BWP by ssb-PositionsInBurst in SIB1 or in ServingCellConfigCommon. If the UE is additionally provided tdd-UL-DL-ConfigurationDedicated, the parameter tdd-UL-DL-ConfigurationDedicated overrides only flexible symbols per slot over the number of slots as provided by tdd-UL-DL-ConfigurationCommon. The tdd-UL-DL-ConfigurationDedicated provides - a set of slot configurations by slotSpecificConfigurationsToAddModList - for each slot configuration from the set of slot configurations - a slot index for a slot provided by slotIndex - a set of symbols for a slot by symbols where - if symbols = allDownlink, all symbols in the slot are downlink - if symbols = allUplink, all symbols in the slot are uplink - if symbols = explicit, nrofDownlinkSymbols provides a number of downlink first symbols in the slot and nrofUplinkSymbols provides a number of uplink last symbols in the slot. If nrofDownlinkSymbols is not provided, there are no downlink first symbols in the slot and if nrofUplinkSymbols is not provided, there are no uplink last symbols in the slot. The remaining symbols in the slot are flexible For each slot having a corresponding index provided by slotIndex, the UE applies a format provided by a corresponding symbols. The UE does not expect tdd-UL-DL-ConfigurationDedicated to indicate as uplink or as downlink a symbol that tdd-UL-DL-ConfigurationCommon indicates as a downlink or as an uplink symbol, respectively. For a set of symbols of a slot that are indicated as SBFD by tdd-UL-DL-ConfigurationCommon, the UE ignores symbols provided by tdd-UL-DL-ConfigurationDedicated, if any. For each slot configuration provided by tdd-UL-DL-ConfigurationDedicated, a reference SCS configuration is the reference SCS configuration provided by tdd-UL-DL-ConfigurationCommon. A slot configuration period and a number of downlink symbols, uplink symbols, and flexible symbols in each slot of the slot configuration period are determined from tdd-UL-DL-ConfigurationCommon and tdd-UL-DL-ConfigurationDedicated and are common to each configured BWP. A UE considers symbols in a slot indicated as downlink by tdd-UL-DL-ConfigurationCommon or sib1-tdd-UL-DL-ConfigurationCommon, or tdd-UL-DL-ConfigurationDedicated to be available for receptions and considers symbols in a slot indicated as uplink by tdd-UL-DL-ConfigurationCommon or sib1-tdd-UL-DL-ConfigurationCommon, or by tdd-UL-DL-ConfigurationDedicated to be available for transmissions. If a UE is not configured to monitor PDCCH for DCI format 2_0, for a set of symbols of a slot that are indicated as flexible by tdd-UL-DL-ConfigurationCommon and tdd-UL-DL-ConfigurationDedicated if provided, or when tdd-UL-DL-ConfigurationCommon and tdd-UL-DL-ConfigurationDedicated are not provided to the UE - the UE receives PDSCH or CSI-RS in the set of symbols of the slot if the UE receives a corresponding indication by a DCI format - the UE transmits PUSCH, PUCCH, PRACH, or SRS in the set of symbols of the slot if the UE receives a corresponding indication by a DCI format, a RAR UL grant, fallbackRAR UL grant, or successRAR For operation on a single carrier in unpaired spectrum, if a UE is configured by higher layers to receive a PDCCH, or a PDSCH, or a CSI-RS, or a DL PRS in a set of symbols of a slot, the UE receives the PDCCH, the PDSCH, the CSI-RS, or the DL PRS if the UE does not detect a DCI format that indicates to the UE to transmit a PUSCH, a PUCCH, a PRACH, or a SRS in at least one symbol of the set of symbols of the slot; otherwise, the UE does not receive the PDCCH, or the PDSCH, or the CSI-RS, or the DL PRS in the set of symbols of the slot. For a UE operation with shared spectrum channel access in FR1, or in FR2-2 when the UE is provided ChannelAccessMode2 = 'enabled', if the UE is provided csi-RS-ValidationWithDCI, is not provided CO-DurationsPerCell, and is not provided SlotFormatCombinationsPerCell, and if the UE is configured by higher layers to receive a CSI-RS in a set of symbols of a slot, the UE cancels the CSI-RS reception in the set of symbols of the slot if the UE does not detect a DCI format indicating an aperiodic CSI-RS reception or scheduling a PDSCH reception in the set of symbols of the slot. If a UE is provided channelAccessMode ='dynamic' and is provided availableRB-SetsToAddModList and availableRB-SetsToReleaseList, the UE expects to be provided co-DurationsPerCellToAddModList and co-DurationsPerCellToReleaseList and/or slotFormatCombToAddModList and slotFormatCombToReleaseList. For operation on a single carrier in unpaired spectrum, if a UE is configured by higher layers to transmit SRS, or PUCCH, or PUSCH, or PRACH in a set of symbols of a slot and the UE detects a DCI format indicating to the UE to receive CSI-RS or PDSCH in a subset of symbols from the set of symbols, then - If the UE does not indicate the capability of partialCancellationPUCCH-PUSCH-PRACH-TX, the UE does not expect to cancel the transmission of the PUCCH or PUSCH or PRACH in the set of symbols if the first symbol in the set occurs within relative to a last symbol of a PDCCH reception where the UE detects the DCI format; otherwise, the UE cancels the PUCCH, or the PUSCH, or an actual repetition of the PUSCH [6, TS 38.214], determined from clauses 9, 9.2.5 and 9.2.6 or clause 6.1 of [6, TS 38.214], or the PRACH transmission in the set of symbols. - If the UE indicates the capability of partialCancellationPUCCH-PUSCH-PRACH-TX, the UE does not expect to cancel the transmission of the PUCCH or PUSCH or PRACH in symbols from the set of symbols that occur within relative to a last symbol of a PDCCH reception where the UE detects the DCI format. The UE cancels the PUCCH, or the PUSCH, or an actual repetition of the PUSCH [6, TS 38.214], determined from clauses 9, 9.2.5 and 9.2.6 or clause 6.1 of [6, TS 38.214], or the PRACH transmission in remaining symbols from the set of symbols. - The UE does not expect to cancel the transmission of SRS in symbols from the subset of symbols that occur within relative to a last symbol of a PDCCH reception where the UE detects the DCI format. The UE cancels the SRS transmission in remaining symbols from the subset of symbols. is the PUSCH preparation time for the corresponding UE processing capability [6, TS 38.214] assuming and corresponds to the smallest SCS configuration between the SCS configuration of the PDCCH carrying the DCI format and the SCS configuration of the SRS, PUCCH, PUSCH or , where corresponds to the SCS configuration of the PRACH if it is 15kHz or higher; otherwise . For a set of symbols of a slot that are indicated to a UE as uplink by tdd-UL-DL-ConfigurationCommon or sib1-tdd-UL-DL-ConfigurationCommon, or tdd-UL-DL-ConfigurationDedicated, the UE does not receive PDCCH, PDSCH, or CSI-RS when the PDCCH, PDSCH, or CSI-RS overlaps, even partially, with the set of symbols of the slot. For a set of symbols of a slot that are indicated to a UE as uplink by tdd-UL-DL-ConfigurationCommon, or tdd-UL-DL-ConfigurationDedicated, the UE does not receive DL PRS in the set of symbols of the slot, if the UE is not provided with a measurement gap. For a set of symbols of a slot that are indicated to a UE as downlink by tdd-UL-DL-ConfigurationCommon or sib1-tdd-UL-DL-ConfigurationCommon, or tdd-UL-DL-ConfigurationDedicated and, when applicable, are indicated as non-SBFD by tdd-UL-DL-ConfigurationCommon, the UE does not transmit PUSCH, PUCCH, PRACH, or SRS when the PUSCH, PUCCH, PRACH, or SRS overlaps, even partially, with the set of symbols of the slot. For a set of symbols of a slot that are indicated to a UE as flexible by tdd-UL-DL-ConfigurationCommon, and tdd-UL-DL-ConfigurationDedicated if provided, or are indicated as SBFD by tdd-UL-DL-ConfigurationCommon, the UE does not expect to receive both dedicated higher layer parameters configuring transmission from the UE in the set of symbols of the slot and dedicated higher layer parameters configuring reception by the UE in the set of symbols of the slot. For operation on a single carrier in unpaired spectrum, for a set of symbols of a slot indicated to a UE for reception of SS/PBCH blocks by ssb-PositionsInBurst in SIB1 or by ssb-PositionsInBurst in ServingCellConfigCommon or as described in Clause 4.4 or, if the UE is not provided dl-OrJointTCI-StateList, by ssb-PositionsInBurst in SSB-MTCAdditionalPCI associated to physical cell ID with active TCI states for PDCCH or PDSCH, or for a set of symbols of a slot corresponding to SS/PBCH blocks configured for L1 beam measurement/reporting, the UE does not transmit PUSCH, PUCCH, PRACH in the slot if a transmission would overlap with any symbol from the set of symbols and the UE does not transmit SRS in the set of symbols of the slot. The UE does not expect the set of symbols of the slot to be indicated as uplink by tdd-UL-DL-ConfigurationCommon or sib1-tdd-UL-DL-ConfigurationCommon, or tdd-UL-DL-ConfigurationDedicated, when provided to the UE. \u003c Unchanged Text Omitted > |\n| --- |", "wg": "RAN1"}, {"agenda_item": "8.1", "agenda_title": "Maintenance on AI/ML for NR Air interface, NR MIMO Phase 5,  NES and NTN for NR and IoT", "content_hash": "sha256:1b0c6a8c04f5176fcd682f350687bb9fa9823244ee1ad6e3ade1439e382bbec0", "depth": "origin", "era": "5G-A", "feature": "ai_air_interface", "first_seen": "2026-10-08", "id": "RAN1-126-8.1-a012", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 12, "source": {"minutes_version": 20, "para": 465}, "summary_zh": null, "tags": [], "text_en": "The following TP for TS 38.213 Clause 11.1 is endorsed.\nThe corresponding CR for Rel-19, TS 38.213 in R1-2606851 is agreed.\n(Rel-19, TS 38.213, Netw_Energy_NR_enh-Core, CR 0782, Cat F)\n| Reason for change: OD-SIB1 configuration configures search space 0 and CORESET 0 for NES Cell. The set of symbols of CORESET 0 in a slot is used for downlink reception and should not be configured as uplink by sib1-tdd-UL-DL-ConfigurationCommon or tdd-UL-DL-ConfigurationDedicated. The current specification is not clear for this case while it is clear for other cases (e.g., CORESET 0 configured by pdcch-ConfigSIB1 in MIB). Summary of change: Clarify the symbols of CORESET 0 of NES Cell configured by OD-SIB1 configurations cannot be configured as uplink. Consequence if not approved: The symbols of CORESET 0 configured by OD-SIB1 configuration from cell A may be configured as uplink by NES cell which makes the UE behaviour unclear. 11.1 Slot configuration A slot format includes downlink symbols, uplink symbols, and flexible symbols. The following are applicable for each serving cell. \u003c Unchanged Text Omitted > For a set of symbols of a slot indicated to a UE by pdcch-ConfigSIB1 in MIB for a CORESET for Type0-PDCCH CSS set, the UE does not expect the set of symbols to be indicated as uplink by tdd-UL-DL-ConfigurationCommon, or tdd-UL-DL-ConfigurationDedicated. For a set of symbols of a slot indicated to a UE by controlResourceSetZero in OD-SIB1-Config for a CORESET for Type0-PDCCH CSS set, the UE does not expect the set of symbols to be indicated as uplink by tdd-UL-DL-ConfigurationCommon, tdd-UL-DL-ConfigurationDedicated or sib1-tdd-UL-DL-ConfigurationCommon. For a set of symbols of a slot corresponding to CORESETs provided in MIB, or in SIB1, or in ServingCellConfigCommonSIB and are indicated as SBFD by tdd-UL-DL-ConfigurationCommon, the UE does not expect to receive dedicated higher layer parameters configuring transmission from the UE in the set of symbols of the slot. \u003c Unchanged Text Omitted > |\n| --- |", "wg": "RAN1"}, {"agenda_item": "8.1", "agenda_title": "Maintenance on AI/ML for NR Air interface, NR MIMO Phase 5,  NES and NTN for NR and IoT", "content_hash": "sha256:8251f0b2074764f0816c083b6c73afdfd322f4425e8cf2d45996efafbe547e8d", "depth": "origin", "era": "5G-A", "feature": "ai_air_interface", "first_seen": "2026-10-08", "id": "RAN1-126-8.1-a013", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 13, "source": {"minutes_version": 20, "para": 470}, "summary_zh": null, "tags": [], "text_en": "The following TP for TS 38.213 Clause 4.1 is endorsed.\nThe corresponding CR for Rel-19, TS 38.213 in R1-2606852 is agreed.\n(Rel-19, TS 38.213, Netw_Energy_NR_enh-Core, CR 0783, Cat F)\n| Reason for change: The periodicity of on-demand SSB can be configured differently than the always-on SSB. However, the current spec says the UE can assume a periodicity of a half frame when the always-on SSB periodicity parameter is absent. When the on-demand SSB periodicity is different than the always-on SSB periodicity this then conflicts with the following statement in the spec which says the UE can assume the periodicity of all SS/PBCH blocks in the serving cell is the same. Summary of Change: Clarify that the assumption of the same periodicity from all SS/PBCH blocks in the serving cell does not hold for on-demand SSB. Consequences if not approved: Incorrect UE assumption on the periodicity of the SSB. 4.1 Cell search \u003c Unchanged Text Omitted > A UE can be provided per serving cell by ssb-periodicityServingCell a periodicity of the half frames for reception of the SS/PBCH blocks for the serving cell. If the UE is not configured a periodicity of the half frames for receptions of the SS/PBCH blocks, the UE assumes a periodicity of a half frame. A UE assumes that the periodicity is same for all SS/PBCH blocks in the serving cell, expect for SS/PBCH blocks provided by OD-SSB-Config, as described in Clause 4.4. \u003c Unchanged Text Omitted > |\n| --- |\nNR/IoT-NTN\nR1-2605806\tMaintenance on NR NTN Phase 3\tSamsung\nR1-2605943\tMaintenance on AIML BM and NTN for NR and IoT\t\tEricsson\nRevised in R1-2606745\nWith respect to R1-2605943 (R1-2606745)\nR1-2606813\tModerator Summary Rel-19 Maintenance on IoT-NTN and NR-NTN\tModerator (Ericsson)", "wg": "RAN1"}, {"agenda_item": "8.1", "agenda_title": "Maintenance on AI/ML for NR Air interface, NR MIMO Phase 5,  NES and NTN for NR and IoT", "content_hash": "sha256:3c3c1d68cba34521ea39e87aeeedbc6735bd877699969095b4f3350767fc3e10", "depth": "origin", "era": "5G-A", "feature": "ai_air_interface", "first_seen": "2026-10-08", "id": "RAN1-126-8.1-a014", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 14, "source": {"minutes_version": 20, "para": 481}, "summary_zh": null, "tags": [], "text_en": "The following TP for TS 36.213 Clause 8.6.1 is endorsed.\nThe corresponding CR for Rel-19, TS 36.213 in R1-2606871 is agreed.\n(Rel-19, TS36.213, IoT_NTN_Ph3, CR 1463, Cat F)\n| Spec | TS 36.213 |\n| --- | --- |\n| Reason for change: | The value of the initial redundancy version for the support of CB-Msg3-EDT for LTE-MTC NTN is missing. |\n|  |  |\n| Summary of change: | Incorporating in clause 8.6.1 of TS 36.213 for LTE-MTC NTN, a statement related to the support of PUSCH for CB-Msg3-EDT as to apply the same solution as for preconfigured uplink resources and the same solution as in NB-IoT NTN for CB-Msg3-EDT. |\n|  |  |\n| Consequences if not approved: | The initial redundancy version for the support of CB-Msg3-EDT for LTE-MTC NTN will remain missing, remaining unclear what the value of the initial redundancy version is. |\n| Clauses affected | 8.6.1 |\n| --------------------------------------------------------------- Text Start ----------------------------------------------------------------- 8.6.1 Modulation order and redundancy version determination -------------------------------------------------------------- Text Omitted --------------------------------------------------------------- For a BL/CE UE configured in CEModeA, is determined by the 'Redundancy version' field in DCI format 6-0A, if present. For a BL/CE UE configured in CEModeA, if the UE is configured with higher layer parameter ce-PUSCH-MultiTB-Config and multiple TB are scheduled in the corresponding DCI, and the 'Redundancy version' field for a scheduled TB is not present in the corresponding DCI, for all TBs scheduled by the DCI. For a BL/CE UE configured with CEModeB, . For a BL/CE UE, for a PUSCH transmission using preconfigured uplink resource or a PUSCH transmission using CB-Msg3-EDT. ---------------------------------------------------------------- Text End ------------------------------------------------------------------ |  |", "wg": "RAN1"}, {"agenda_item": "8.1", "agenda_title": "Maintenance on AI/ML for NR Air interface, NR MIMO Phase 5,  NES and NTN for NR and IoT", "content_hash": "sha256:e2466d825db96f39b873691ffef894b6c4cffe47fdef32cf757eec2548cfff30", "depth": "origin", "era": "5G-A", "feature": "ai_air_interface", "first_seen": "2026-10-08", "id": "RAN1-126-8.1-a015", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 15, "source": {"minutes_version": 20, "para": 486}, "summary_zh": null, "tags": [], "text_en": "The following TP for TS 36.213 Clause 16.5 is endorsed.\nThe corresponding CR for Rel-19, TS 36.213 in R1-2606906 is agreed.\n(Rel-19, TS 36.213, IoT_NTN_Ph3,  CR 1467, Cat F)\n| Spec | TS 36.213 |\n| --- | --- |\n| Reason for change: | In NB-IoT NTN TDD operation, it was concluded to do not “specify further enhancements for NPUSCH format 1 scheduling delays”. This was adopted based on the understanding that legacy scheduling values (8, 16, 32, 64) can be used under the assumption that if the scheduled uplink transmission falls into a guard period subframe (muted subframe) then the most immediate available subframe is used. However, this assumption/behavior is currently not described into the 3GPP technical specifications. |\n|  |  |\n| Summary of change: | Incorporating in clause 16.5.1 of TS 36.213 for NB-IoT NTN TDD operation, a statement that aligns terminology of legacy procedures (i.e., “a slot is considered an NB-IoT UL slot if is it fully contained within an NB-IoT UL subframe”) to reflect that if because of the scheduling delay value the NPUSCH format 1 transmission happens to coincide with a guard period subframe, then the NPUSCH format 1 transmission shall be performed at the first available subframe of the U consecutive uplink subframes of NB-IoT NTN TDD operation. |\n|  |  |\n| Consequences if not approved: | If the behavior is not described, there is no guarantee that all implementations will have to assume that a scheduled uplink transmission that falls into a guard period subframes should be understood to be postponed to the most immediate available uplink subframe. |\n| Clauses affected | 16.5 |\n| --------------------------------------------------------------- Text Start ----------------------------------------------------------------- 16.5 Narrowband physical uplink shared channel related procedures For a NB-IoT UE that supports twoHARQ-Processes-r14 or the UE is configured with higher layer parameter npusch-MultiTB-Config, there shall be a maximum of 2 uplink HARQ processes. -------------------------------------------------------------- Text Omitted --------------------------------------------------------------- - for IoT NTN TDD, a NB-IoT UE shall assume a subframe as a NB-IoT UL subframe if it is one of the U consecutive uplink subframes according to the frame structure type 1 for IoT NTN TDD and a slot is considered a NB-IoT UL slot if it is fully contained within NB-IoT UL subframe(s), the value of U is defined in [3]. ---------------------------------------------------------------- Text End ------------------------------------------------------------------ |  |\nR1-2606840\tSummary of enabling inter-slot OCC operation\tModerator (Samsung)\nWith respect to LS discussion:\nR1-2606834\tModerator summary on LS on scheduling restriction for RACH related signals and channels\tModerator (Huawei)\nR1-2606877\tModerator summary #2 on LS on scheduling restriction for RACH related signals and channels\tModerator (Huawei)", "wg": "RAN1"}, {"agenda_item": "8.1", "agenda_title": "Maintenance on AI/ML for NR Air interface, NR MIMO Phase 5,  NES and NTN for NR and IoT", "content_hash": "sha256:f8bb5c6a4453fe977772c080feed5085f01db5683926dc6e9ccd117c316f24c6", "depth": "origin", "era": "5G-A", "feature": "ai_air_interface", "first_seen": "2026-10-08", "id": "RAN1-126-8.1-a016", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 16, "source": {"minutes_version": 20, "para": 497}, "summary_zh": null, "tags": [], "text_en": "Capture the following in the Draft LS response to R1-2605188.\nThe misalignment between transmission of PRACH at UE side and monitoring of PRACH at NW side may occur in beam hopping operation when RO periodicity is \u003c160ms. Some companies have the view that the misalignment is due to configuration or NW implementation.\nThe misalignment may also occur in beam hopping operation when RO periodicity is 160ms and cells served by the same hopping beam have overlapping valid PRACH occasions, e.g. due to the aligned SFN and same PRACH time-domain configuration and SSB-to-RO mapping, while the corresponding satellite Rx beam is not active for a footprint at such PRACH occasions.\nThe draft LS in R1-2606882 is endorsed by changing “kindly” to “respectfully”.\nThe final LS in R1-2606892 is approved.", "wg": "RAN1"}, {"agenda_item": "8.1", "agenda_title": "Maintenance on AI/ML for NR Air interface, NR MIMO Phase 5,  NES and NTN for NR and IoT", "content_hash": "sha256:70de26aa654b40b9f6bb8a9dcc6315684d297f44017f93398960cf3cdff7bcbc", "depth": "origin", "era": "5G-A", "feature": "ai_air_interface", "first_seen": "2026-10-08", "id": "RAN1-126-8.1-c001", "impact": null, "kind": "conclusion", "llm_status": "skipped_by_depth", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 1, "source": {"minutes_version": 20, "para": 437}, "summary_zh": null, "tags": [], "text_en": "There is no consensus in RAN1 to support the following change from R1-2605805 of Clause 5.2.1.5.4.1 in TS 38.214:\n| 5.2.1.5.4.1 UE Initiated CSI reporting \u003cUnchanged parts are omitted> The counter of the event instances for such reference signal is reset: - if the reference signal in the indicated TCI state is updated and newBeamResourceSet is a NZP-CSI-RS-ResourceSet configured with repetition, or the SS/PBCH block which is QCLed with the reference signal in the indicated TCI state is updated and newBeamResourceSet is a CSI-SSB-ResourceSet when the UE is configured with a CSI-ReportConfig with the higher layer parameter eventType set to ‘event2’ or ‘event1’, or - if the reference signal with the valueOfQ-th highest L1-RSRP out of the reference signals among the activated TCI states is updated and newBeamResourceSet is a NZP-CSI-RS-ResourceSet configured with repetition, or the SS/PBCH block with the valueOfQ-th highest L1-RSRP out of the SS/PBCH blocks QCLed with the reference signals among the activated TCI states, which determines event instance(s), is updated and newBeamResourceSet is a CSI-SSB-ResourceSet when the UE is configured with a CSI-ReportConfig with the higher layer parameter eventType set to ‘event7’, or - if eventThreshold or valueOfQ or eventInstanceCount or eventDetectionTimeWindow in the CSI-ReportConfig are reconfigured. \u003cUnchanged parts are omitted> |\n| --- |", "wg": "RAN1"}, {"agenda_item": "8.1", "agenda_title": "Maintenance on AI/ML for NR Air interface, NR MIMO Phase 5,  NES and NTN for NR and IoT", "content_hash": "sha256:446a764b2d021731e23019f03a06db6185d9e9a96325e180ff56f6b9d9e5e8fc", "depth": "origin", "era": "5G-A", "feature": "ai_air_interface", "first_seen": "2026-10-08", "id": "RAN1-126-8.1-c002", "impact": null, "kind": "conclusion", "llm_status": "skipped_by_depth", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 2, "source": {"minutes_version": 20, "para": 440}, "summary_zh": null, "tags": [], "text_en": "There is no consensus in RAN1 to support the TP from R1-2605669 of Clause 6.3.2.1.2 in TS 38.212 and Clause 5.2.1.5.4.1 in TS 38.214.\nNES\nR1-2605328\tMaintenance on enhancements of network energy savings for NR\tSharp\nR1-2605670\tMaintenance of Enhancements of NES\tOfinno\nR1-2605801\tdraft CR for applying controlResourceSetZero and searchSpaceZero in OD-SIB1-config\tSamsung, Ofinno, LG Electronic, Sharp, Ericsson, vivo\nR1-2606716\tCorrection in TS 38.213 for Rel-19 Network Energy Savings\tHuawei, HiSilicon\nWith respect to LS discussion:\nR1-2606831\tSummary #1 of Rel-19 NES maintenance (LS related)\tModerator (Samsung)", "wg": "RAN1"}, {"agenda_item": "8.1", "agenda_title": "Maintenance on AI/ML for NR Air interface, NR MIMO Phase 5,  NES and NTN for NR and IoT", "content_hash": "sha256:a9d4365474cb3c75ef1b9ddecb1bcd19049fb1d52da84fbf416770c9b149a90a", "depth": "origin", "era": "5G-A", "feature": "ai_air_interface", "first_seen": "2026-10-08", "id": "RAN1-126-8.1-c003", "impact": null, "kind": "conclusion", "llm_status": "skipped_by_depth", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 3, "source": {"minutes_version": 20, "para": 495}, "summary_zh": null, "tags": [], "text_en": "The misalignment issue was discussed in Rel-19 NR NTN WI without consensus. RAN1 is not pursuing enhancement in Rel-19 NR-NTN to address the issue raised by RAN4 in R1-2605188.", "wg": "RAN1"}, {"agenda_item": "9.1.1", "agenda_title": "CSI spatial/frequency compression without temporal aspects (“Case 0”)", "content_hash": "sha256:fbeaa7f966447f9f53602b8d8d324865a6f00e1067632bb691bcc67774ce770e", "depth": "origin", "era": "5G-A", "feature": "ai_air_interface", "first_seen": "2026-10-08", "id": "RAN1-126-9.1.1-a001", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 1, "source": {"minutes_version": 20, "para": 675}, "summary_zh": null, "tags": [], "text_en": "Send LS to RAN2 to study, and if deemed feasible, specify L3 signaling for performance monitoring, including the following aspects\nReporting of pair-wise of target CSI sample and the corresponding CSI feedback sample of the corresponding inference report\nFull and partial target CSI reporting is allowed, where partial target CSI = subset of subbands / layers of the CSI feedback of the inference report)\nSame set of layers are considered for target CSI sample and CSI feedback sample.\nMechanism to collect multiple samples\nSample is a pair of target CSI and CSI feedback sample\nLinking to corresponding inference configuration (detailed solution upto RAN2)", "wg": "RAN1"}, {"agenda_item": "9.1.1", "agenda_title": "CSI spatial/frequency compression without temporal aspects (“Case 0”)", "content_hash": "sha256:8fa3fbbeca38ccf93f1d115ed0c42512218aa890b721af2c3638b29c436e5316", "depth": "origin", "era": "5G-A", "feature": "ai_air_interface", "first_seen": "2026-10-08", "id": "RAN1-126-9.1.1-a002", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 2, "source": {"minutes_version": 20, "para": 683}, "summary_zh": null, "tags": [], "text_en": "Support L1 signaling for performance monitoring, down-selection from the following alternatives:\nAlt1: NW side monitoring via legacy eType II format with potential spec impact\nAlt2: NW side monitoring via partial / full target CSI reporting via same format as NW data collection\nAlt3: UE assisted monitoring via SGCS / monitoring output reporting\nAlt 4: NW side monitoring via legacy eType II without spec impact\nNote: From RAN1 point of view, monitoring based on L3 signalling and L1 signalling are independently considered.\nR1-2606362\tFL summary #3 on 9.1.1 for CSI compression via two-sided model\tQualcomm Incorporated", "wg": "RAN1"}, {"agenda_item": "9.1.1", "agenda_title": "CSI spatial/frequency compression without temporal aspects (“Case 0”)", "content_hash": "sha256:503cc7ec64e8a082b47d239391b2615ee7b8e1f309b7b0702004c59811578d5f", "depth": "origin", "era": "5G-A", "feature": "ai_air_interface", "first_seen": "2026-10-08", "id": "RAN1-126-9.1.1-a003", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 3, "source": {"minutes_version": 20, "para": 691}, "summary_zh": null, "tags": [], "text_en": "The following text for Draft LS in R1-2606881 is endorsed.\nRegarding performance monitoring, RAN1 has the following agreement on using L3 signaling to collect pair-wise of target CSI sample and CSI feedback sample.", "wg": "RAN1"}, {"agenda_item": "9.1.1", "agenda_title": "CSI spatial/frequency compression without temporal aspects (“Case 0”)", "content_hash": "sha256:da15e09bb9e13dc295acd6024466f99d235a77f9ca1f7679d50313d93567ebe6", "depth": "origin", "era": "5G-A", "feature": "ai_air_interface", "first_seen": "2026-10-08", "id": "RAN1-126-9.1.1-a004", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 4, "source": {"minutes_version": 20, "para": 694}, "summary_zh": null, "tags": [], "text_en": "Send LS to RAN2 to study, and if deemed feasible, specify L3 signaling for performance monitoring, including the following aspects\nReporting of pair-wise of target CSI sample and the corresponding CSI feedback sample of the corresponding inference report\nFull and partial target CSI reporting is allowed, where partial target CSI = subset of subbands / layers of the CSI feedback of the inference report)\nSame set of layers are considered for target CSI sample and CSI feedback sample.\nMechanism to collect multiple samples\nSample is a pair of target CSI and CSI feedback sample\nLinking to corresponding inference configuration (detailed solution upto RAN2)\nRAN1 asks RAN2 if they would be so kind as to consider the agreement above in their future work.\nThe corresponding final LS in R1-2606893 is endorsed.\nRevised in R1-2606930 to correct the source to RAN WG1.", "wg": "RAN1"}, {"agenda_item": "9.1.1", "agenda_title": "CSI spatial/frequency compression without temporal aspects (“Case 0”)", "content_hash": "sha256:536935671ae55eb26380f855dd62474b7d0abc3b051a596dd218dbb3a91d7750", "depth": "origin", "era": "5G-A", "feature": "ai_air_interface", "first_seen": "2026-10-08", "id": "RAN1-126-9.1.1-a005", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 5, "source": {"minutes_version": 20, "para": 698}, "summary_zh": null, "tags": [], "text_en": "Support following configuration for inference configuration\nPairing ID\nSubband configuration (reuse csi-ReportingBand)\nResources for channel and interference measurement (reuse legacy configuration)\nportMappingMethod (reuse legacy configuraiton)\ncodebookConfig-r20\nPayload parameter combination configuration\nN1, N2 configuration\nRank restriction (reuse legacy)\nFFS: reportQuantity\nR1-2606363\tFL summary #4 on 9.1.1 for CSI compression via two-sided model\tQualcomm Incorporated", "wg": "RAN1"}, {"agenda_item": "9.1.2", "agenda_title": "Inter-vendor training collaboration for two-sided AI/ML models", "content_hash": "sha256:11474d54a01a8567959540f4b78902220b5d84b9cf7483ad804e2745ea9b5d7e", "depth": "origin", "era": "5G-A", "feature": "ai_air_interface", "first_seen": "2026-10-08", "id": "RAN1-126-9.1.2-a001", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 1, "source": {"minutes_version": 20, "para": 751}, "summary_zh": null, "tags": [], "text_en": "For the association between Target CSI and CSI feedback in Option 4-1, support CSI feedback rank as part of each CSI feedback set metadata.", "wg": "RAN1"}, {"agenda_item": "9.1.2", "agenda_title": "Inter-vendor training collaboration for two-sided AI/ML models", "content_hash": "sha256:37398940b2d107c27d448d7a05bb228b6f550b9c45992494d2463c3c420d27fa", "depth": "origin", "era": "5G-A", "feature": "ai_air_interface", "first_seen": "2026-10-08", "id": "RAN1-126-9.1.2-a002", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 2, "source": {"minutes_version": 20, "para": 753}, "summary_zh": null, "tags": [], "text_en": "For Option 4-1, for a CSI feedback set associated with the -th Target CSI set andthe m-th payload size configuration,\nthe NMSE value associated with the l-th layer of the s-th CSI feedback sample is defined by\nwhere  is the generated CSI feedback vector for the l-th layer, the m-th payload size configuration, and the -th Target CSI set corresponding to .  is the floating-point CSI feedback vector for the same l-th layer, the same m-th payload size configuration, and the same -th Target CSI set provided in the exchanged dataset.\nThe average NMSE and X-percentile of NMSE are derived based on the  .", "wg": "RAN1"}, {"agenda_item": "9.1.2", "agenda_title": "Inter-vendor training collaboration for two-sided AI/ML models", "content_hash": "sha256:561492bde20e335290dfc170269453d4a5ad1adab24fa1e60c3fc943122c9c86", "depth": "origin", "era": "5G-A", "feature": "ai_air_interface", "first_seen": "2026-10-08", "id": "RAN1-126-9.1.2-a003", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 3, "source": {"minutes_version": 20, "para": 758}, "summary_zh": null, "tags": [], "text_en": "For Option 4-1 under Direction A in AI/ML based CSI compression, for the format of the NMSE and SGCS performance target, use the 32-bit floating point representation.", "wg": "RAN1"}, {"agenda_item": "9.1.2", "agenda_title": "Inter-vendor training collaboration for two-sided AI/ML models", "content_hash": "sha256:8a2a071aec6d26342351eac7ecc303669801800b963ad58a3ecc3511cae95941", "depth": "origin", "era": "5G-A", "feature": "ai_air_interface", "first_seen": "2026-10-08", "id": "RAN1-126-9.1.2-a004", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 4, "source": {"minutes_version": 20, "para": 760}, "summary_zh": null, "tags": [], "text_en": "For Direction A, Option 3a-1, combination(s) of the configuration parameters to which the exchanged model parameters apply are provided along with the model parameters. These configuration parameters include:\nThe port number configuration of N1 and N2, subband size and BWP info (NR ARFCN of the lowest PRB of the BWP and BWP size and the SCS),\nCSI payload size configuration per layer\nSubband configuration\nRank\nNote: The port mapping method is separately discussed for both Option 3a-1 and Option 4-1 whether to be applied to either or both or none of them.\nR1-2606013\tFL summary # 3 for inter-vendor training collaboration\tApple\nFinal post-meeting summary for this agenda item.", "wg": "RAN1"}, {"agenda_item": "10.2.1", "agenda_title": "Waveform", "content_hash": "sha256:f319b2290a5069ef3184e2390a3f143ae61c66d40008a634724ddc623dc8c7bd", "depth": "full", "era": "6G", "feature": "waveform", "first_seen": "2026-10-08", "id": "RAN1-124b-10.2.1-a001", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 124, "meeting_end": null, "meeting_suffix": "b", "release": "Rel-20", "seq": 1, "source": {"minutes_version": 100, "para": 2052}, "summary_zh": null, "tags": [], "text_en": "Prioritize the following cases in the RAN1 study on UL coverage improvements through low UL PAPR enhancement for DFT-s-OFDM, based on Table in 5.3.1 of R1-2603312:\nFDSS [for π/2 BPSK, QPSK, 16QAM]\nOpt1: Transparent filter\nFilter defined through transmitter requirement such as spectrum flatness by RAN4\nOpt2: non-transparent filter\nFilter coefficients specified in RAN1\nNote: This includes all the listed FDSS filtering variants\nFDSS for [π/2 BPSK, QPSK, 16QAM] with spectral extension\nFor FDSS part,\nOpt1: Transparent filter\nFilter defined through transmitter requirement such as spectrum flatness by RAN4\nOpt2: non-transparent filter\nFilter coefficients specified in RAN1\nNote: This includes all the listed variants of the spectrum extension\nFDSS for π/2 BPSK with spectral truncation\nFor FDSS part,\nOpt1: Transparent filter\nFilter defined through transmitter requirement such as spectrum flatness by RAN4\nOpt2: non-transparent filter\nFilter coefficients specified in RAN1\nNote: This includes all the listed variants of the spectrum truncation\nNote: At least one variant of spectral extension, offset-QPSK with smaller DFT size can result in the same signal as the FDSS for π/2 BPSK-ST\nNote: companies are encouraged to report whether transparent CFR is used or not\nR1-2603313\tFeature Lead summary #4 on 6G waveform\tModerator (Nokia)\nFrom Thursday session", "wg": "RAN1"}, {"agenda_item": "10.2.1", "agenda_title": "Waveform", "content_hash": "sha256:93745ebb4052066aa3a8f84f0076a12b49628509d5529e689bd303ff474a0f3c", "depth": "full", "era": "6G", "feature": "waveform", "first_seen": "2026-10-08", "id": "RAN1-124b-10.2.1-c001", "impact": null, "kind": "conclusion", "llm_status": "pending", "meeting": 124, "meeting_end": null, "meeting_suffix": "b", "release": "Rel-20", "seq": 1, "source": {"minutes_version": 100, "para": 2078}, "summary_zh": null, "tags": [], "text_en": "The study on the following listed proposals is noted. Further discussion on these is not planned under the waveform agenda item in RAN1 unless tasked by RAN at or after RAN#112.", "wg": "RAN1"}, {"agenda_item": "10.2.1", "agenda_title": "Waveform", "content_hash": "sha256:1939f15798ca0ddc1c2043b517ef8e3e0d3ada5d36408977979c262883d53e39", "depth": "full", "era": "6G", "feature": "waveform", "first_seen": "2026-10-08", "id": "RAN1-124b-10.2.1-o001", "impact": null, "kind": "observation", "llm_status": "pending", "meeting": 124, "meeting_end": null, "meeting_suffix": "b", "release": "Rel-20", "seq": 1, "source": {"minutes_version": 100, "para": 2081}, "summary_zh": null, "tags": [], "text_en": "Max-rank = 2 for UL DFT-s-OFDM\nCompanies report negligible SNR loss from DFT-s-OFDM with larger number of aNB Rx antenna elements, such as at least 16 or 32. Link level loss with 4 layers has not been studied. A lower number of aNB antenna elements may result with SNR loss at the receiver\nAll companies acknowledge that when the UE is Tx power limited, there is a Tx power gain from DFT-s-OFDM, highest reported gain of around 2.5dB.\nThe system level impact depends on scenario and scheduling strategy due to vastly differing probabilities for UE to be power limited and use rank=2, as well as the used traffic model and the assumed number of aNB Rx antenna elements. The reference setup to compare with varied and had also an impact to the findings, including also system loading, link adaptation, scheduling strategy, the used UE antenna model and the number of aNB Rx antenna elements.\nTwo companies reported cases with average system level throughput loss [R1-2601827, R1-2602177], of which one company indicated cell edge throughput loss [R1-2602177]. One company reported no average and cell-edge system level throughput gain [R1-2602254], while 6 companies reported cases with average system level throughput gains and/or cell edge throughput gains [R1-2602004, R1-2603056, R1-2602468, R1-2603008, R1-2603286 , R1-2601921].\nCodebook for multi-layer UL DFT-s-OFDM\nThe lower PAPR property of DFT-s-OFDM is diminished with coherent precoders due to mixing of two (or more) layers for each power amplifier.\nRAN1#124 agreed to focus the DFT-s-OFDM studies to non-coherent CB only (with the exception of lower number of layers than Tx antennas) for 2Tx UE for waveform evaluation purposes.\nFour companies report moderate system level gains for DFT-s-OFDM non-coherent codebook only relative to CP-OFDM non-coherent codebook [R1-2603056, R1-2602468, R1-2603008, R1-2603286], while two companies report system level loss for DFT-s-OFDM non-coherent codebook only relative to CP-OFDM non-coherent codebook [R1-2601827, R1-2602177].\nOne company reports system level gains also for DFT-s-OFDM with coherent codebook relative to CP-OFDM with coherent codebook [R1-2602468].\nSix companies report system level gains for DFT-s-OFDM with non-coherent multi-layer codebook and coherent single-layer codebook relative to CP-OFDM with coherent single/multi-layer codebook [R1-2602426, R1-2602468, R1-2602004, R1-2603008, R1-2603286, R1-2601921], while one company reports no system level gain for DFT-s-OFDM with non-coherent multi-layer codebook and coherent single-layer codebook relative to CP-OFDM with coherent single/multi-layer codebook [R1-2602254].\nDynamic waveform switching\nOne company observes comparable system level performance for DWS among DFT-s-OFDM for both 1- and 2-layer and CP-OFDM with both 1-layer and 2-layer compared to DWS among DFT-s-OFDM for only 1-layer and CP-OFDM for both 1- and 2-layer for full buffer traffic only and observes gain for non-full buffer traffic [R1-2603286].\nOne company observes system level loss of DFT-s-OFDM for both 1- and 2-layer compared to DFT-s-OFDM for only 1-layer and CP-OFDM for both 1- and 2-layer with waveform switching [R1-2601827].\nOne company observes comparable system level performance for DWS among DFT-s-OFDM for both 1- and 2-layer and CP-OFDM with both 1-layer and 2-layer compared to DWS among DFT-s-OFDM for only 1-layer and CP-OFDM for both 1- and 2-layer. [R1-2602254].\nOne company observes system level performance loss of DFT-s-OFDM for 1-layer and DFT-s-OFDM/CP-OFDM for 2-layer compared to DFT-s-OFDM for only 1-layer and CP-OFDM for both 1-layer and 2-layer with waveform switching [R1-2602177].\nNote: this observation is not intended to be captured as it is in TR.\nR1-2603314\tFeature Lead summary #5 on 6G waveform\tModerator (Nokia)\nPresented in Friday session\nR1-2603315\tFeature Lead summary #6 on 6G waveform\tModerator (Nokia)", "wg": "RAN1"}, {"agenda_item": "10.2.1", "agenda_title": "Waveform", "content_hash": "sha256:17c78cbb43b87a4993d2a490729cb2f58066157da77e35701c4d2a7e31af36fe", "depth": "full", "era": "6G", "feature": "waveform", "first_seen": "2026-10-08", "id": "RAN1-124b-10.2.1-p001", "impact": null, "kind": "proposal", "llm_status": "pending", "meeting": 124, "meeting_end": null, "meeting_suffix": "b", "release": "Rel-20", "seq": 1, "source": {"minutes_version": 100, "para": 2080}, "summary_zh": null, "tags": [], "text_en": "Company providing evaluation (please include the Tdoc#)\nBased on your results, indicate if you believe that the proposal should be considered for potential inclusion to 6GR\nTR (downlink)\nZTE (R1-2602275)\nZTE: YES\nDFT-s-OFDM with enhanced time domain resource multiplexing\nZTE (R1-2602275)\nZTE: YES\nGFB-OFDM\nZTE (R1-2602275)\nZTE: YES\nSLM\nZTE (R1-2508856)\nCATT（R1-2602492）\nZTE: YES\nCATT: YES\nZak-OTFS-over-OFDM\nCohere (R1-2602263)\nCohere: YES\nZak-OTFS\nCohere (R1-2602263)\nCohere: YES\nInterlace OFDM\nSpectral Precoding\nNICT(R1-2602831)\nNICT: YES\nOSDM\nSheffield (R1-2602259)\nShef: YES\nCP-OFDM with time-domain precoding\nPCL (R1-2602302)\nPCL: YES\nDFT-s-OFDM with flexible frequency domain mapping (e.g., frequency domain data-DMRS multiplexing)\nQC (R1-2603008)\nCATT（R1-2602492）\nQC: Yes\nCATT: Yes\nMulti-Tx Enhancement for DFT-s-OFDM\nQC (R1-2603008)\nIITH, Wisig (R1-2602880)\nQC: Yes\nIITH, Wisig: Yes\nTwo-segment DFT-S-OFDM\nCATT（R1-2602492）\nCATT:Yes", "wg": "RAN1"}, {"agenda_item": "10.3.1", "agenda_title": "Channel coding", "content_hash": "sha256:6190a9308f7937447d8e1d0649e0e26ed259b679dcc7768f47abba27c2feb8fd", "depth": "full", "era": "6G", "feature": "channel_coding", "first_seen": "2026-10-08", "id": "RAN1-124b-10.3.1-a001", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 124, "meeting_end": null, "meeting_suffix": "b", "release": "Rel-20", "seq": 1, "source": {"minutes_version": 100, "para": 2148}, "summary_zh": null, "tags": [], "text_en": "For the study of LDPC extension beyond NR range, the maximum code block size of 8448 is assumed for further study with the following two options:\nOption 1: 44 information columns in BG and a maximum lifting size of 192\nOption 2: 22 information columns in BG and a maximum lifting size of 384\nNote: Aim to decide between option 1 and option 2 during this week.", "wg": "RAN1"}, {"agenda_item": "10.3.1", "agenda_title": "Channel coding", "content_hash": "sha256:fa2a2ef4d9fa5bfe11680b71d0d4fc654dae2168ccd6a1e95f9fe010bc295962", "depth": "full", "era": "6G", "feature": "channel_coding", "first_seen": "2026-10-08", "id": "RAN1-124b-10.3.1-a002", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 124, "meeting_end": null, "meeting_suffix": "b", "release": "Rel-20", "seq": 2, "source": {"minutes_version": 100, "para": 2153}, "summary_zh": null, "tags": [], "text_en": "For the study of LDPC extension beyond NR range, the mother code rate of approximately 2/3 is assumed for further study.\nThe above agreement is only applicable for study of the new BG.", "wg": "RAN1"}, {"agenda_item": "10.3.1", "agenda_title": "Channel coding", "content_hash": "sha256:a2d5b12462b5973334054e2d7b95d47dabc1e0e55e30fcd38cfdd35521a83ebc", "depth": "full", "era": "6G", "feature": "channel_coding", "first_seen": "2026-10-08", "id": "RAN1-124b-10.3.1-a003", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 124, "meeting_end": null, "meeting_suffix": "b", "release": "Rel-20", "seq": 3, "source": {"minutes_version": 100, "para": 2156}, "summary_zh": null, "tags": [], "text_en": "For the study of LDPC extension beyond NR range, for the maximum information block size of 8448 bits, the total number of ones in the lifted parity check matrix under mother code rate is no larger than N, where N is determined by the total number of ones in the lifted parity check matrix of BG1 under the code rate of X.\nX is not lower than 1/2.\nFFS: Value of X.\nR1-2603339\tFL summary#2 for 6G channel coding\tModerator(ZTE)\nPresented in Tuesday session.\nR1-2603340\tFL summary#3 for 6G channel coding\tModerator(ZTE)\nFrom Wednesday session", "wg": "RAN1"}, {"agenda_item": "10.3.1", "agenda_title": "Channel coding", "content_hash": "sha256:be5a09edc978a3ed4a79c973846af2fb1477d4a0be153bad38e4f34af85654a7", "depth": "full", "era": "6G", "feature": "channel_coding", "first_seen": "2026-10-08", "id": "RAN1-124b-10.3.1-a004", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 124, "meeting_end": null, "meeting_suffix": "b", "release": "Rel-20", "seq": 4, "source": {"minutes_version": 100, "para": 2164}, "summary_zh": null, "tags": [], "text_en": "For the study of LDPC extension beyond NR range, for the study of new BG, assume the parity check matrix for encoder consists of five sub-matrices (A, B, C, D, E) for further study, wherein\nSub-matrix A contains columns that correspond to information bits.\nSub-matrix C is a zero matrix\nSub-matrix D: the number of columns of sub-matrix D equals to (the number of columns of Sub-matrix A) + (the number of columns of Sub-matrix B)\nSub-matrix B contains columns that correspond to core parity check bits\nFor sub-matrix B, consider the following options for further study, and strive for down-selection in RAN1#125\nOption B1: A weight-3 column with corresponding shifting values of [0, X, 0] or [X, 0, X], followed by a dual-diagonal structure with corresponding shifting values of [0,0]\nOption B2: At most 2 weight-3 columns and dual-diagonal structure(s) with comparable number of XOR and cyclic shift operations with Option B1, e.g.,\nOption B2-1: Sub-matrix B has a weight-3 column with corresponding shifting values of [a, b, c], followed by a dual-diagonal structure\nOption B2-2: Sub-matrix B can be decomposed into two sets: set 1 and set 2. Each set follows Option B1/ Option B2-1, with additional pair-wise orthogonality across sets, e.g.,\nFor sub-matrix E, the following options are identified for further study, and strive for down-selection in RAN1#125\nOption E1: An identity matrix\nOption E2: A lower triangular matrix\nR1-2603411\tFL summary#4 for 6G channel coding\tModerator (ZTE)\nFrom Thursday session", "wg": "RAN1"}, {"agenda_item": "10.3.1", "agenda_title": "Channel coding", "content_hash": "sha256:114f522ea34ae66a66273146f15b104dceeda36fd34019b088f206f74c706d0c", "depth": "full", "era": "6G", "feature": "channel_coding", "first_seen": "2026-10-08", "id": "RAN1-124b-10.3.1-a005", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 124, "meeting_end": null, "meeting_suffix": "b", "release": "Rel-20", "seq": 5, "source": {"minutes_version": 100, "para": 2180}, "summary_zh": null, "tags": [], "text_en": "For the study of LDPC extension beyond NR range, for study of the new BG, consider a single edge BG with 44 information columns and a maximum lifting size of 192, with the following options identified for further study, and strive for down-selection among the options in RAN1#125\nOption 1: Row splitting, wherein one or more rows outside the core matrix (i.e., sub matrix A and sub matrix B) are split from at least some rows inside the core matrix, and the core column indices of the non-zero entries of the original row are a superset of those of the corresponding split row,\nThe core matrix contains Y1 rows, and all elements of Y2 rows in sub-matrix A are ones.\nY1= 3 or 4\nY1Y21\nSub-option 1-1: With at least the first row in sub-matrix A included in the Y2 rows\nSub-option 1-2: The first row in sub-matrix A is not included in the Y2 rows.\nNo puncturing before rate matching\nOption 2: The single edge BG with 44 information columns and a maximum lifting size of 192 can be convertible to a BG with 22 information columns and a maximum lifting size of 384. More specifically, each 2x2 submatrix at column 2j, 2j+1, and row 2k, 2k+1 of the BG can only take one of the following forms:\n, , , .\nNo puncturing or puncturing one or two columns before rate matching, wherein the puncturing (if any) is applied within the first two information columns and/or any core parity columns\nOption 3: Quasi-row orthogonality in core matrix (i.e., sub matrix A and sub matrix B) and/or sub matrix D, i.e., in which except for certain columns, the row 2k, 2k+1 do not share non-zero entries in the same column in the sub-matrix A and/or sub-matrix D\nNo puncturing or puncturing one or two columns before rate matching, wherein the puncturing (if any) is applied within the first two information columns and/or any core parity columns\nThe options above are not mutually exclusive and can be combined.\nOther options that have a single edge BG with 44 information columns and a maximum lifting size of 192 are not precluded.\nFinal summary in R1-2603412.", "wg": "RAN1"}, {"agenda_item": "10.3.2", "agenda_title": "Modulation, Joint channel coding and modulation", "content_hash": "sha256:0792196291f646d6e14fae63efdc755da522932817547e88c89ac49d285fefdd", "depth": "full", "era": "6G", "feature": "channel_coding", "first_seen": "2026-10-08", "id": "RAN1-124b-10.3.2-a001", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 124, "meeting_end": null, "meeting_suffix": "b", "release": "Rel-20", "seq": 1, "source": {"minutes_version": 100, "para": 2234}, "summary_zh": null, "tags": [], "text_en": "At least support 5G NR equal probability uniform QAM constellation for 6G:\nFor 6GR DL, 5G NR equal probability uniform QPSK, 16QAM, 64QAM, 256QAM and 1024QAM are supported for CP-OFDM for data channel\nFor 6GR UL, 5G NR equal probability uniform QPSK, 16QAM, 64QAM, and 256QAM are supported for CP-OFDM for data channel\nFor 6GR UL, 5G NR pi/2 BPSK, equal probability uniform QPSK, 16QAM, 64QAM, and 256QAM are supported for DFT-s-OFDM for data channel\nNote: Further enhancements for low PAPR are being discussed in waveform agenda, and will be decided there\nNote: The support of equal probability uniform QAM does not have any implication to the study and potential inclusion of shaping based schemes and the study of waveform discussions.\nNote: Other equal probability uniform modulation schemes and modulation orders, including but not limited to DL 4kQAM and UL 1k QAM, can be separately discussed and can be additionally supported if justified.\nFFS: Impact on modulation if the waveform agenda item concludes on any waveform enhancements.\nR1-2603304\tFL summary #2 on modulation, joint channel coding and modulation\tModerator (Qualcomm)\nPresented in Tuesday session.\nR1-2603305\tFL summary #3 on modulation, joint channel coding and modulation\tModerator (Qualcomm)\nFrom Wednesday session", "wg": "RAN1"}, {"agenda_item": "10.3.2", "agenda_title": "Modulation, Joint channel coding and modulation", "content_hash": "sha256:c64e796e2f6d8dc14318e3cc932e18bbbf8aa7f08f710fcf0db2cbcddd6cec7c", "depth": "full", "era": "6G", "feature": "channel_coding", "first_seen": "2026-10-08", "id": "RAN1-124b-10.3.2-a002", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 124, "meeting_end": null, "meeting_suffix": "b", "release": "Rel-20", "seq": 2, "source": {"minutes_version": 100, "para": 2247}, "summary_zh": null, "tags": [], "text_en": "For the evaluation of PS/GS schemes under fading channel, prioritize companies are encouraged to provide evaluation results for the following\nSIMO 1x4: CDL-A 100ns, CDL-B 30ns, CDL-C 300ns, TDL-C 100ns\nMIMO: Open loop for high speed UE with identity precoding, at least 200 Hz Doppler\nMIMO: Closed loop precoding, Rank 4\nMIMO 4x4 CDL-A 100ns, MIMO 4x4 CDL-B 30ns,  MIMO 4x4 CDL-C 300ns,\nMIMO 32x4 CDL-A 100ns, MIMO 32x4 CDL-B 30ns,  MIMO 32x4 CDL-C 300ns\nR1-2603306\tFL summary #4 on modulation, joint channel coding and modulation\tModerator (Qualcomm)\nFrom Thursday session", "wg": "RAN1"}, {"agenda_item": "10.3.2", "agenda_title": "Modulation, Joint channel coding and modulation", "content_hash": "sha256:68ca7c47f024ff6e931b93c8691ed54df3ec36e55cfb8b866cf459d9f5c41f03", "depth": "full", "era": "6G", "feature": "channel_coding", "first_seen": "2026-10-08", "id": "RAN1-124b-10.3.2-a003", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 124, "meeting_end": null, "meeting_suffix": "b", "release": "Rel-20", "seq": 3, "source": {"minutes_version": 100, "para": 2256}, "summary_zh": null, "tags": [], "text_en": "For SLS study for DL 4K uniform QAM without shaping and UL 1K uniform QAM without shaping for CPE in FWA scenario, focus on the following subset of parameters for Dense Urban and Urban Macro:\nLayout: Single layer\nFrequency: Around 4GHz and/or Around 7GHz\nBS antenna model: Outdoor Combination 2 for around 4GHz and Outdoor Combination 2 for around 7GHz\nBS power: 44dBm/20MHz for around 4GHz, and 43dBm/20MHz for around 7GHz\nO2I penetration loss: Option 2: 50% low loss, 50% high loss\nTraffic model: FTP3\nUE distribution and UE speed:\nProfile 1 (mixed deployment): 80% Indoor CPE: (0, 0.3] km/h; 20% Outdoor rooftop mounted CPE: (0, 0.3]km/h.\nProfile 3 (Outdoor mounted CPE only): Roof-top mounted, 100% outdoor (0,0.3] km/h\nFor outdoor rooftop mounted CPE, consider uniform distributed in 4-8 floors for building height.\nUE antenna panel: Combination 3 Alt 1 for around 4GHz, combination 4 for around 7GHz\nTx configuration of UE antenna panel for UL 1024QAM\nCompanies to report antenna orientation\nUE power class: 31dBm, 35dBm (Other values can be reported by companies)\nSimulation BW: 100MHz, 20MHz\nMaximum rank per CPE UE: 2, 4, 8 (optional)\nChannel estimation: Realistic channel estimation\nAssume MU-MIMO capability is available at gNB\nMCS table including the additional MCS entries for DL 4K QAM and UL 1K QAM provided by company\nOther parameter setting not precluded and company can report\nFor SLS result reporting, also include\nRank distribution (for indoor CPE and outdoor LOS CPE and outdoor non-LOS CPE separately and jointly)\nRank distribution when 4KQAM DL and 1KQAM UL is selected.\nModulation order (MCS) distribution (for indoor CPE and outdoor LOS CPE and outdoor non-LOS CPE separately and jointly)\nNote: RAN4 input is needed for the following parameters:\nEVM assumption and modelling\nMPR assumption", "wg": "RAN1"}, {"agenda_item": "10.3.2", "agenda_title": "Modulation, Joint channel coding and modulation", "content_hash": "sha256:8d521267a1476ac5e7e89496faabee05f1826e6ae70330ab9afc02428efaf47c", "depth": "full", "era": "6G", "feature": "channel_coding", "first_seen": "2026-10-08", "id": "RAN1-124b-10.3.2-o001", "impact": null, "kind": "observation", "llm_status": "pending", "meeting": 124, "meeting_end": null, "meeting_suffix": "b", "release": "Rel-20", "seq": 1, "source": {"minutes_version": 100, "para": 2285}, "summary_zh": null, "tags": [], "text_en": "For GS schemes, at least the following are observed:\nFor 1D-NUC, if MMSE receiver is used, the demodulation/demapper complexity is [1 to 1.6] times that of uniform QAM assuming [6 to 10] quantization bit-width per I/Q for 1D-NUC.\nFurther observations will be worked on demodulation/demapper complexity of 1D-NUC with rML receiver\nFor 1D-NUC, if MMSE receiver is used, the demodulation/demapper complexity is [6.45] times that of uniform QAM assuming [14] quantization bit-width per I/Q for 1D-NUC.\nFurther observations will be worked on demodulation/demapper complexity of 1D-NUC with rML receiver\nFor 2D-NUC (except for QAM-CS), if MMSE receiver is used, the demodulation/demapper complexity is [20 to 947] times that of uniform QAM.\nFurther observations will be worked on demodulation/demapper complexity of QAM-CS based 2D-NUC\nFurther observations will be worked on demodulation/demapper complexity of 2D-NUC with rML receiver\nFor NP-NUC, the same demodulation/demapper as uniform QAM is used\nFurther observations are required to be provided for RAN plenary checkpoint to compare the complexity and storage requirements for GS with respect to uniform QAM.\nFurther observations of linkage between performance gain/loss under agreed fading channels with the complexity/storage are required for RAN plenary checkpoint.", "wg": "RAN1"}, {"agenda_item": "10.3.2", "agenda_title": "Modulation, Joint channel coding and modulation", "content_hash": "sha256:73533746a42312f49de78ddeb46a43a4fd2f2fc0174bee461121d37435eb0e8a", "depth": "full", "era": "6G", "feature": "channel_coding", "first_seen": "2026-10-08", "id": "RAN1-124b-10.3.2-o002", "impact": null, "kind": "observation", "llm_status": "pending", "meeting": 124, "meeting_end": null, "meeting_suffix": "b", "release": "Rel-20", "seq": 2, "source": {"minutes_version": 100, "para": 2297}, "summary_zh": null, "tags": [], "text_en": "For PS schemes, at least the following are observed:\nFor ESS based PS, the storage requirement increases approximately quadratically with increasing DM block length, the storage requirement increases exponentially with increasing number of shaped bits per I/Q symbol, and processing delay increases linearly with increasing DM block length\nFor CCDM based PS, the processing delay increases linearly as DM block length increases.\nFurther observations are required to be provided for RAN plenary checkpoint to compare the complexity and storage requirements of different DM algorithm/parameters for PS with respect to uniform QAM.\nFurther observations of linkage between performance gain/loss under agreed fading channels with the complexity/storage are required for RAN plenary checkpoint.", "wg": "RAN1"}, {"agenda_item": "10.8.1", "agenda_title": "Evaluations", "content_hash": "sha256:a4a76b6a5a45e01460f16cb8cb5bbb8db018d3bf1ed6326e9ea8e32efd0e8f7f", "depth": "full", "era": "6G", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-124b-10.8.1-a001", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 124, "meeting_end": null, "meeting_suffix": "b", "release": "Rel-20", "seq": 1, "source": {"minutes_version": 100, "para": 4442}, "summary_zh": null, "tags": [], "text_en": "For Rel-20 6G sensing performance evaluation of object detection and/or tracking, the following cases/combinations are considered as baseline cases/combinations.\n| Sensing target | Indoor or outdoor | Scenario | Carrier frequency |\n| --- | --- | --- | --- |\n| UAV | Outdoor | UMa-AV, SMa | 4 GHz, ~7 GHz, 30 GHz (for UMa-AV only) |\n| Human | Outdoor | UMa | 4 GHz, ~7 GHz, 30 GHz |\n|  | Indoor | Indoor Hotspot | 4 GHz, ~7 GHz, 30 GHz |\n| Vehicle | Outdoor | Urban Grid, Highway | 4 GHz, ~7 GHz, 30 GHz (for Urban Grid only) |\n| AGV | Indoor | Indoor factory (SH) | 4 GHz, ~7 GHz, 30 GHz |\nNote: sensing mode(s) for each row will be discussed\nOther cases/combinations can also be evaluated, reported and collected from companies.\nNote: In this agreement, no intention to de-prioritize other scenarios or carrier frequencies.", "wg": "RAN1"}, {"agenda_item": "10.8.1", "agenda_title": "Evaluations", "content_hash": "sha256:132a2ee4cb7e05e3abc248ae7c638e63c87ae20c7e4e647f379de8428260dbb3", "depth": "full", "era": "6G", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-124b-10.8.1-a002", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 124, "meeting_end": null, "meeting_suffix": "b", "release": "Rel-20", "seq": 2, "source": {"minutes_version": 100, "para": 4448}, "summary_zh": null, "tags": [], "text_en": "Companies are encouraged to bring input to the evaluation on communication assistance in next meeting, including but not limited to:\nNecessity of evaluation on communication assistance\nFor proponents, provide: what to sense and, if necessary, what/how to assist communication\nWhat metric of sensing is to be defined\nWhether/what metric related to communication is to be defined\nWhether performance target/KPI is to be defined, for either sensing metric or communication metric\nNecessary channel model extension\nNecessary update of evaluation methodology on top of 5G NR sensing evaluation methodology", "wg": "RAN1"}, {"agenda_item": "10.8.1", "agenda_title": "Evaluations", "content_hash": "sha256:a6410c3316b41777bab953f38f0a2f2768521f1b75f00e2086b0aea0c9271368", "depth": "full", "era": "6G", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-124b-10.8.1-a003", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 124, "meeting_end": null, "meeting_suffix": "b", "release": "Rel-20", "seq": 3, "source": {"minutes_version": 100, "para": 4457}, "summary_zh": null, "tags": [], "text_en": "Companies are encouraged to bring input to the sensing mode related evaluation assumptions in next meeting, using the following table as starting point. The values in current table are example values based on the input and discussion in RAN1#125.\nNote1: This is not intended to specify all sensing modes.\nNote2: This does not mean any sensing mode is applicable to any scenario/use case.\nNote3: Other parameters/values for each sensing mode can also be discussed.\n| Sensing mode | Parameter | Value |\n| --- | --- | --- |\n| TRP mono-static | Sensing Tx/Rx operating simultaneously or not | Simultaneously, or not simultaneously (FFS: with/without switching time and value if any) |\n|  | BS antenna isolation | For Around 7 GHz and below 7 GHz: Option 1: 80 dB Option 2: 65 dB For 30 GHz: Option 1: 100 dB Option 2: 72 dB Option 3: 85 dB |\n|  | BS transmit power | Simultaneously: min { BS transmit power in Table of ISAC system configuration, BS Rx saturation power + BS antenna isolation}, assuming the BS Rx saturation power = -28 dBm Not simultaneously: Follow BS transmit power in the table of general evaluation assumption |\n|  | BS self-interference impact | The residual leakage interference/noise is modelled e.g., by additional additive white Gaussian noise, -174 + 10log10(BW) + X dBm in BW Hz, BW is simulated bandwidth, X = {-Infinity, 0, 5} is up to company report. Note: X = -Infinity corresponds to not modelling self-interference. |\n| UE mono-static | UE type for sensing | Companies to report |\n|  | Sensing Tx/Rx operating simultaneously or not | FFS |\n|  | UE transmit power | FFS |\n|  | UE Antenna isolation | FFS |\n|  | UE Self-interference impact | FFS |\n|  | Availability of UE location, velocity and orientation | Option 1: Known, ideally (baseline) Option 2: Known, with error. FFS distribution of error in each aspect (e.g. location, speed, orientation). Option 3: Unknown, rely on actual measurement Note: UE location, velocity and orientation are individually determined |\n| TRP-TRP bi-static | Timing/frequency error | Option 1: Ideal (baseline) Option 2: With error, FFS value range and model of the distribution Note: timing error and frequency error are individually determined |\n|  | Coherency and phase continuity among symbols within a CPI | Option 1: Always coherent Option 2: Coherency is assumed under some conditions; FFS: Conditions |\n| UE-UE bi-static | UE type for sensing | Companies to report |\n|  | Timing/frequency error | Option 1: Ideal (baseline) Option 2: With error, FFS value range and model of the distribution Note: timing error and frequency error are individually determined |\n|  | Availability of UE location, velocity and orientation | Option 1: Known, ideally (baseline) Option 2: Known, with error. FFS distribution of error in each aspect (e.g. location, speed, orientation). Option 3: Unknown, rely on actual measurement Note: UE location, velocity and orientation are individually determined |\n|  | Coherency and phase continuity among symbols within a CPI | Option 1: Always coherent Option 2: Coherency is assumed under some conditions;
