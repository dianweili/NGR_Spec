<script type="application/json" id="ngr-data">{"events": [{"agenda_item": "10.2.1", "agenda_title": "Waveform", "content_hash": "sha256:a9a4b030893c915b5ac348a0a6580e2a258a2ff80926b7c5860654fad073d08f", "depth": "full", "era": "6G", "feature": "waveform", "first_seen": "2026-10-08", "id": "RAN1-126-10.2.1-a001", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 1, "source": {"minutes_version": 20, "para": 1481}, "summary_zh": null, "tags": [], "text_en": "Agree on the embedded template for UL PAPR reduction scheme results collection in section 4.5 of R1-2606804.\nCompanies having evaluation results are encouraged to fill the template and upload it into the draft folder indicated by FL by 27th August EOD.\nR1-2606804\tFeature Lead summary #3 on 6G waveform\tModerator (Nokia)", "wg": "RAN1"}, {"agenda_item": "10.2.1", "agenda_title": "Waveform", "content_hash": "sha256:41453729ca573248d99efb9202a8a3ecd0cd4c1f57c97b65c603c6d2e5623fdb", "depth": "full", "era": "6G", "feature": "waveform", "first_seen": "2026-10-08", "id": "RAN1-126-10.2.1-a002", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 2, "source": {"minutes_version": 20, "para": 1485}, "summary_zh": null, "tags": [], "text_en": "Endorse the updated observations in section 3.5 in R1-2606804", "wg": "RAN1"}, {"agenda_item": "10.2.1", "agenda_title": "Waveform", "content_hash": "sha256:054a204e1fcd31cdc59ccc5d040fe63068e6f78c3b8397eeff8240c63417b035", "depth": "full", "era": "6G", "feature": "waveform", "first_seen": "2026-10-08", "id": "RAN1-126-10.2.1-a003", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 3, "source": {"minutes_version": 20, "para": 1487}, "summary_zh": null, "tags": [], "text_en": "Complete the following list of UL PAPR reduction techniques for further down-selection\nOption 1: FDSS with no spectrum extension or truncation\nTransparent / non-transparent\nModulation: Pi/2 BPSK / QPSK\nApplicable SE range: FFS\nOption 2: FDSS with spectrum extension\nTransparent / non-transparent\nModulation: Pi/2 BPSK / QPSK / 16QAM\nApplicable SE range: FFS\nOption 3: FDSS with spectrum truncation\nTransparent / non-transparent\nModulation: Pi/2 BPSK\nApplicable SE range: FFS\nFFS: condition on when to apply finally selected option/scheme\nNote: target to down select transparent / non-transparent and modulation (at least on 16QAM) for above options at RAN1#126bis", "wg": "RAN1"}, {"agenda_item": "10.2.1", "agenda_title": "Waveform", "content_hash": "sha256:ad172d8730a673b124f710cfe67f5847a6ffdc848b28605b467616d60c38708c", "depth": "full", "era": "6G", "feature": "waveform", "first_seen": "2026-10-08", "id": "RAN1-126-10.2.1-a004", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 4, "source": {"minutes_version": 20, "para": 1503}, "summary_zh": null, "tags": [], "text_en": "For DFT size before SE/ST is applied, at least option 1 is supported, and whether option 2 is supported or not is further discussed and to be decided by RAN1#127\nOption 1: 12 * 2x3y5z subcarriers.\nOption 2: X * 2x3y5z subcarriers, where X = 4.\nFFS: upper bound on applicable number of RBs for option 2\nR1-2606805\tFeature Lead summary #4 on 6G waveform\tModerator (Nokia)\nR1-2606806\tFeature Lead summary #5 on 6G waveform\tModerator (Nokia)\nFinal post-meeting summary on this agenda item.\n[Post-126-6GR-waveform] – Karri (Nokia)\nEmail discussion to collect additional evaluation results from 28th to 30th Sept.\nNote: additional evaluation results captured into the template should also be submitted in contribution for Oct. meeting.", "wg": "RAN1"}, {"agenda_item": "10.3.1", "agenda_title": "Channel coding", "content_hash": "sha256:30a50f647375fac03e4edc99783e0b36e8d669e34ac71807e443d0ae6f9ad280", "depth": "full", "era": "6G", "feature": "channel_coding", "first_seen": "2026-10-08", "id": "RAN1-126-10.3.1-a001", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 1, "source": {"minutes_version": 20, "para": 1603}, "summary_zh": null, "tags": [], "text_en": "For the sub-matrix E of BG3, support the following option\nOption E2 (from agreement in RAN1#124bis): A lower triangular matrix, wherein the number of columns with degree larger than 1 is less than I.\nFFS: the value of I.\nE can not be the identity matrix (i.e. Option E1).\nR1-2606774\tFL summary#4 for 6G channel coding\tModerator (ZTE)", "wg": "RAN1"}, {"agenda_item": "10.3.1", "agenda_title": "Channel coding", "content_hash": "sha256:78ca1878351185bdfa4bec2d2bf3015463493184a2e57e0e294b79fdbdb57885", "depth": "full", "era": "6G", "feature": "channel_coding", "first_seen": "2026-10-08", "id": "RAN1-126-10.3.1-a002", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 2, "source": {"minutes_version": 20, "para": 1609}, "summary_zh": null, "tags": [], "text_en": "With respect to the decision for capability of BG3 in UL tasked by RANP, the following is supported:\nsupporting BG3 in UL is mandatory with capability signaling for UEs except for UEs with up to 20MHz maximum UL channel bandwidth in any band supported by UE, i.e., BG3 in UL is optional for UEs with up to 20MHz maximum UL channel bandwidth in any band supported by UE.\nNote: Whether any additional exception to the above is needed is up to RAN plenary decision.\nR1-2606775\tFL summary#5 for 6G channel coding\tModerator (ZTE)", "wg": "RAN1"}, {"agenda_item": "10.3.1", "agenda_title": "Channel coding", "content_hash": "sha256:97cee345c0c124e8e152c82c23b3a603c8ad8ab74688efc7057ff0780481dfa0", "depth": "full", "era": "6G", "feature": "channel_coding", "first_seen": "2026-10-08", "id": "RAN1-126-10.3.1-a003", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 3, "source": {"minutes_version": 20, "para": 1614}, "summary_zh": null, "tags": [], "text_en": "For the evaluation of coding based candidates for small UCI with payload size of 3~11 bits, refer to the evaluation assumptions in PUCCH/PUSCH, with the following update\nUse AWGN channel\nNote: Companies can provide results for other channels\nInfo. block length (bits w/o CRC): 3:1:11\nMetrics: SNR at target BLER, BER\nOther metrics agreed in PUCCH agenda can be also reported by companies\nCompanies to report the details of PUSCH/PUCCH including DM-RS configuration, PUCCH format, if any\nCompanies to report impact on receiver complexity/latency and transmitter complexity/latency, if any.\n| The channel coding based candidates for evaluation are as below |\n| --- |\n5G RM code (baseline)\nEnhanced RM code\nEnhanced PC-Polar code\nGolay-based code\nVertical and horizontal code\nCRC polynomial code\nNote: Companies to report the details of coding based candidates\nNote: Companies to provide comparison with 5G RM code.\nNote: Companies can choose one or more candidates above for evaluation\nR1-2606915 \tFL summary#6 for 6G channel coding\tModerator (ZTE)\nFinal post-meeting summary for this agenda item.", "wg": "RAN1"}, {"agenda_item": "10.3.1", "agenda_title": "Channel coding", "content_hash": "sha256:a32082718e6e1ee319c4f9d2596443522a12ccdb90ec59008909cded582e4b82", "depth": "full", "era": "6G", "feature": "channel_coding", "first_seen": "2026-10-08", "id": "RAN1-126-10.3.1-o001", "impact": null, "kind": "observation", "llm_status": "pending", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 1, "source": {"minutes_version": 20, "para": 1565}, "summary_zh": null, "tags": [], "text_en": "For the study of 5G RM code for small UCI with 3~11 bits, the following are observed based on companies’ contributions:\n11 sources (R1-2605455, R1-2605560, R1-2605655, R1-2605714, R1-2605783, R1-2606019, R1-2606283, R1-2606307, R1-2606308, R1-2606371, R1-2606638) observed that 5G RM code suffers from error floor and performance degradation at high code rates (e.g., R>=1/2) due to rank deficiency or limited minimum Hamming distance\nOn the other hand, the following are also observed:\n2 sources (R1-2605288, R1-2606793) observed small UCI with 3~11 bits is generally scheduled with low code rates.\n1 source (R1-2605821) observed that the rank-deficiency cases occur in approximately 6.7% of all the valid (E, K) configurations and have negligible impact on system performance.\n5 sources (R1-2605288, R1-2605455, R1-2605560, R1-2605714, R1-2605783) observed that the mother code length of 5G RM code is limited to 32. Furthermore, 4 sources (R1-2605288, R1-2605455, R1-2605560, R1-2605783) observed repetition is needed at low code rates, thus the performance and coverage is degraded.  1 source (R1-2605288) observed small UCI with 3~11 bits is generally scheduled with low code rates.\n4 sources (R1-2605455, R1-2605560, R1-2606308, R1-2606371) observed the BLER performance loss of 5G RM code due to DMRS overhead at least for PUCCH.\n2 sources (R1-2605455, R1-2605560) observed the performance loss of 5G RM code due to high PAPR at least for PUCCH.\n3 sources (R1-2605455, R1-2605560, R1-2605909) observed 5G RM code cannot support DMRS-less transmission at least for PUCCH due to the all-one vector in the first column.\nIn addition, the following are also observed:\n4 sources (R1-2605821, R1-2606793, R1-2606769, R1-2605379) observed that RM code was used in 5G NR, and 6G does not have new requirements for this region to justify re-design.\n1 source (R1-2605379) observed that 5G RM code is optimized for good minimum distance and can be decoded via FHT-based ML decoding with low complexity.\nThe potential solutions (coding based only) to enhance performance for small UCI with 3~11 bits are summarized as below\n12 sources (R1-2605560, R1-2605655, R1-2605714, R1-2605783, R1-2605909, R1-2606793, R1-2606283, R1-2606307, R1-2606308, R1-2606371, R1-2606638, R1-2606019) discussed the potential solutions to improve the performance for short block code.\nEnhanced RM code\n8 sources (R1-2605560, R1-2605655, R1-2605714, R1-2605783, R1-2606793, R1-2606371, R1-2606638, R1-2606019) observed enhanced RM code with optimized basis sequence selection and/or rate matching can resolve the rank deficiency and error floor issue of RM code at high code rates.\n1 source (R1-2605783) observed enhanced RM code can provide 0.7dB and 1.4dB performance gain under the case of K=3 and 4 at medium code rate respectively, resolve error floor or provide 0.7~1.2dB performance gain under the case of K=6~8 and 11 at higher code rate.\n1 source (R1-2605714) observed that enhanced RM code by introducing row permutation in the basis RM sequence selection can resolve error floor under the cases of K=6~9 and 11 at higher code rate, and provide 0.52~0.57 dB performance gain under the cases of {E=12, K=6, 7} and {E=14, K=7}.\n1 source (R1-2606371) observed applying an interleaver before rate matching for 5G RM code can fix the rank deficiency problem, and provide 0.1~0.9dB, 0.1~0.4dB and 0.1~0.2dB performance gain for K = 3~11, E = 12, 16 and 24, respectively.\n1 source (R1-2606019) observed Kerdock code, which contains the first-order RM code, can provide 0.11dB mean performance gain, 2.62dB maximum performance gain across all combinations of (K, E).\n1 source (R1-2606793) observed extension of RM code (n*32, K), n=2 or 4 can provide up to 0.6 dB performance gain in AWGN for n=4 over 5G RM code (32, K) with repetition.\n1 source (R1-2605909) observed that RM (32,13) code agreed in RAN1 #52bis can provide 11 base sequences, excluding the base sequence of all-1’s.\nEnhanced PC-Polar code\n5 sources (R1-2605288, R1-2605560, R1-2605714, R1-2605783, R1-2605909) observed that enhanced PC-Polar code can resolve the rank deficiency and error floor issue of 5G RM code at high code rates, and improve the performance at low code rates\n1 source (R1-2605909) observed about 0.7dB gain from enhanced PC-Polar code for K=8 bits and E=256 bits.\n1 source (R1-2605288) observed enhanced PC-Polar code can improve the BLER performance by [0.6~0.9] dB and increase coverage by >10% over 5G RM code at low code rates, and also observed enhanced PC-Polar code can provide the benefits of error detection via parity check bits and unequal error protection for important bits.\nvertical and horizontal code\n1 source (R1-2606308) observed vertical and horizontal code can provide about 0.4 dB performance gain for K=8, E=12, and about 2 dB performance gain for K=8, E=26.\nNew code derived from linear block codes or orthogonal subspaces\n1 source (R1-2606283) observed by constructing the short block length codes using sequences or using generator polynomial, the minimum hamming distance can be increased.\nCRC polynomial code\n1 source (R1-2606307) observed CRC polynomial code can provide better BLER performance than 5G RM code for K=6, E=8, and K=7, E=10.\nGolay-based code\n1 source (R1-2606371) observed Golay-based code can provide 0.1~1.0dB, 0.2~0.6dB, 0.1~0.4dB, 0.1~0.4dB and 0.2~0.3dB performance gain for K = 3~11, E= 12, 16, 20, 24 and 32, respectively.\nOn the other hand, 5 sources (R1-2605379, R1-2605821, R1-2606793, R1-2606769, R1-2606494) suggested reusing 5G RM code for small UCI with 3~11 bits, e.g., to avoid optimization for high coding rates that are atypical for normal usage.\n2 sources (R1-2605821, R1-2605379) observed that the rank-deficiency (E, K) issue can be resolved by the scheduler through allocating a marginally larger number of coded bits without specification change.\nR1-2606773\tFL summary#3 for 6G channel coding\tModerator (ZTE)", "wg": "RAN1"}, {"agenda_item": "10.3.2", "agenda_title": "Modulation, Joint channel coding and modulation", "content_hash": "sha256:490bae69e131e653df3421b8192f5069058dd422f35b2706db0a7bd184a856d2", "depth": "full", "era": "6G", "feature": "channel_coding", "first_seen": "2026-10-08", "id": "RAN1-126-10.3.2-c001", "impact": null, "kind": "conclusion", "llm_status": "pending", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 1, "source": {"minutes_version": 20, "para": 1695}, "summary_zh": null, "tags": [], "text_en": "RAN1 to continue the study on GS (i.e. 1D-NUC) and PS (ESS based PS and ECC based PS in Q3/26\ndecide by Q3 whether or not to support constellation shaping and if supported, between PS (including whether it is 1-bit or 2-bits PS scheme) and GS\nsupport of different constellation shaping schemes for DL and UL is precluded (e.g. PS for DL, GS for UL)\nIf there is no consensus on the support of constellation shaping in Q3/26 the study on constellation shaping will be stopped\nSummary of companies’ preferences:\nGS (1D-NUC with equal probability and Gray mapping) — support for both DL and UL\nSupport shaping AND support this scheme (11): Ericsson, NTT DOCOMO, LG Electronics, SJTU, ETRI, ZTE, Vivo, CATT, OPPO, Verizon, Lenovo\nDo NOT support shaping but support this scheme (0): none\nSupport shaping but do NOT support this scheme (13): IDC, MTK, Intel, Samsung, Qualcomm, HFCL, Jio Platforms, IIT Kanpur, IIT Madras, CEWiT, Lekha Wireless, Charter, CableLabs\nPS (ESS based PS) – 1 bit — support for both DL and UL\nSupport shaping AND support this scheme (18): Tejas, IDC, MTK, Intel, Samsung, OPPO, Verizon, Qualcomm, HFCL, Jio Platforms, IIT Kanpur, IIT Madras, CEWiT, Lekha Wireless, Charter, CableLabs, T-Mob USA, DeepSig\nDo NOT support shaping but support this scheme (0): none\nSupport shaping but do NOT support this scheme (7): Ericsson, NTT DOCOMO, LG Electronics, SJTU, ETRI, ZTE, CATT\nPS (ECC based PS) – 1 bi  "RAN1"}, {"agenda_item": "10.3.2", "agenda_title": "Modulation, Joint channel coding and modulation", "content_hash": "sha256:116ef558ffe28c4baf59ce1f9c19b8f2106cade2cba9dcbecf25838c400b669f", "depth": "full", "era": "6G", "feature": "channel_coding", "first_seen": "2026-10-08", "id": "RAN1-126-10.3.2-c002", "impact": null, "kind": "conclusion", "llm_status": "pending", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 2, "source": {"minutes_version": 20, "para": 1772}, "summary_zh": null, "tags": [], "text_en": "With respect to RANP task to RAN1 (copied below) to conclude the support for constellation shaping in RAN1:", "wg": "RAN1"}, {"agenda_item": "10.3.2", "agenda_title": "Modulation, Joint channel coding and modulation", "content_hash": "sha256:2d70dbdce3abafc5dd0ab2e673e95ddf109d1dc8730cfdd9c94da25156c303b6", "depth": "full", "era": "6G", "feature": "channel_coding", "first_seen": "2026-10-08", "id": "RAN1-126-10.3.2-c003", "impact": null, "kind": "conclusion", "llm_status": "pending", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 3, "source": {"minutes_version": 20, "para": 1774}, "summary_zh": null, "tags": [], "text_en": "RAN1 to continue the study on GS (i.e. 1D-NUC) and PS (ESS based PS and ECC based PS in Q3/26\ndecide by Q3 whether or not to support constellation shaping and if supported, between PS (including whether it is 1-bit or 2-bits PS scheme) and GS\nsupport of different constellation shaping schemes for DL and UL is precluded (e.g. PS for DL, GS for UL)\nIf there is no consensus on the support of constellation shaping in Q3/26 the study on constellation shaping will be stopped\nRAN1 concludes the following:\nThere is no consensus in RAN1 to support any constellation shaping schemes for either DL or UL.\nSummary of companies’ preferences is in R1-2606762.\nSome proponents of some constellation shaping schemes stated that they would agree to withdraw that scheme.", "wg": "RAN1"}, {"agenda_item": "10.3.2", "agenda_title": "Modulation, Joint channel coding and modulation", "content_hash": "sha256:67ceae292bc5aff5b89a4ad4c7fe2ec36ded8e571b9fe53758cd0402849ff532", "depth": "full", "era": "6G", "feature": "channel_coding", "first_seen": "2026-10-08", "id": "RAN1-126-10.3.2-c004", "impact": null, "kind": "conclusion", "llm_status": "pending", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 4, "source": {"minutes_version": 20, "para": 1779}, "summary_zh": null, "tags": [], "text_en": "With respect to RANP guidance to RAN1 (copied below) for support of higher order modulation:\n| RAN Chair guidance (RAN#112) For 1K QAM on UL and 4K QAM on DL: RAN1/RAN4 to continue study and make decision in Q3/26. |\n| --- |\nFrom RAN1 perspective, for DL 4K QAM, and UL 1K QAM in 6GR, if supported, is restricted to FWA use case only and not for eMBB use case\nThe restriction to FWA use case shall be enforced in the spec\nFFS: How to reflect this restriction in the spec\nOther restrictions on DL 4K QAM and UL 1K QAM can be identified\nMultiple sources performed SLS to evaluate DL 4K QAM and UL 1K QAM under agreed evaluation methodology for FWA use case. The detailed assumptions and results are captured in the tables provided in R1-2606762.\nFrom RAN1 perspective,\nRAN1 recommends to adopt 1k QAM for UL.\nNo consensus in RAN1 to recommend adopting 4K QAM for DL", "wg": "RAN1"}, {"agenda_item": "10.3.2", "agenda_title": "Modulation, Joint channel coding and modulation", "content_hash": "sha256:94bcec6c0a45cb3121a5c6b97aaa52e6b975e471a4df76aca00f5caefd69852b", "depth": "full", "era": "6G", "feature": "channel_coding", "first_seen": "2026-10-08", "id": "RAN1-126-10.3.2-o001", "impact": null, "kind": "observation", "llm_status": "pending", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 1, "source": {"minutes_version": 20, "para": 1693}, "summary_zh": null, "tags": [], "text_en": "W clutters.\n| Clutter density: | 20% |\n| --- | --- |\n| Clutter height: | 2 m |\n| Clutter size: | 10 m |", "wg": "RAN1"}, {"agenda_item": "10.8.1", "agenda_title": "Evaluations", "content_hash": "sha256:53efe8a0f9bf346e2b49a244dd9dc14988f4481835cf2aaee3ce4c0a5c931455", "depth": "full", "era": "6G", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-126-10.8.1-a003", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 3, "source": {"minutes_version": 20, "para": 4680}, "summary_zh": null, "tags": [], "text_en": "For Rel-20 6G ISAC performance evaluation, for object detection and/or tracking, the MDP (missed detection probability) and the FAP type 2 (false alarm probability type 2) are calculated as follows:\nMissed detection probability\nwhere,\n-\t is the number of missed targets in the drop n, i.e., the true target not associated with any detected object.\n-\t is the number of true targets in the drop n.\n-\t is total number of drops with at least one target per drop.\nFFS: same MDP definition as 5GA ISAC study should also be evaluated\nFalse alarm probability Type-2\nwhere,\n-\t is the number of detected objects but not associated with any true targets in the drop n.\n-\t is the total number of detected objects in the drop n.\n-\t is number of drops with at least one detected object.\nFFS: same FAP type-2 definition as 5GA ISAC study should also be evaluated", "wg": "RAN1"}, {"agenda_item": "10.8.1", "agenda_title": "Evaluations", "content_hash": "sha256:9c7e2ebdecea61d6aaaa85e686178c8040e31250d20f7409fbc0ea971beb8bcc", "depth": "full", "era": "6G", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-126-10.8.1-a004", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 4, "source": {"minutes_version": 20, "para": 4694}, "summary_zh": null, "tags": [], "text_en": "For Rel-20 6G ISAC performance evaluation, for object detection and/or tracking, when data fusion from multiple sensing nodes/pairs is applied:\nInstead of using detected objects per sensing node/pair, the jointly determined object(s) fused from detected objects of multiple sensing nodes/pairs will be used for association between detected object(s) and true target(s), calculating MDP, FAP Type 2 and positioning/velocity accuracy.\nCompanies to report the method/algorithm to obtain the jointly fused object(s) from detected objects of multiple sensing nodes/pairs.\nR1-2605743\tModerator summary #2 on ISAC evaluations\tModerator (CATT)", "wg": "RAN1"}, {"agenda_item": "10.8.1", "agenda_title": "Evaluations", "content_hash": "sha256:0d07331f7adcb5e7a19cbe54b4f0efdc9a48e83ee45016c503af83d514cc6b56", "depth": "full", "era": "6G", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-126-10.8.1-a005", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 5, "source": {"minutes_version": 20, "para": 4699}, "summary_zh": null, "tags": [], "text_en": "For Rel-20 6G ISAC evaluation on SAC (sensing assisted communication), companies are encouraged to evaluate and report at least one of the following:\nScope 1: Evaluate performance of sensing measurement/result, which will be used to assist communication;\nScope 2: Evaluate performance of communication, with and without assistance of sensing measurement/result. The sensing measurement/result to assist communication can be:\nIdeal sensing measurement/result\nNon-ideal sensing measurement/result, and company to report how to model error/offset of non-ideal factors for non-ideal sensing measurement/result\nReal sensing measurement/result, which is obtained from simulation\nNote: companies to report which is used in their simulation.\nFor Rel-20 6G ISAC evaluation on SAC, for Scope 2:\nThe communication use case(s) in AI 10.8.2 are encouraged\nCompanies to report whether the location and/or velocity information of communication UE and/or TRP is needed or not in their SAC algorithm/mechanism\nNote: this does not imply specifying exchange of location and/or velocity information between UE and TRP\nCompanies to report the time-frequency resource cost due to sensing for SAC and necessary details on the definition of the time-frequency resource cost based on TR38.765 as starting point\nComparison with benchmark and benchmark details should also be reported as well as other necessary details if any\nCompanies are encouraged to use communication-related performance metrics as agreed in communication agendas\nCompanies are encouraged to use baseline/benchmark mechanism as agreed in communication agendas for comparison; Use of state-of-the-art mechanism without assistance of sensing measurement/result for comparison is not precluded\nCompanies are encouraged to use additional communication-related evaluation assumptions (if necessary but not discussed/agreed in AI 10.8.1) as agreed in communication agendas\nNote: How to draw conclusion/observation is a separate discussion.", "wg": "RAN1"}, {"agenda_item": "10.8.1", "agenda_title": "Evaluations", "content_hash": "sha256:1cc27ccbb9cf5be1b8c52060729f4a36063b42abed889c328016d35c67301133", "depth": "full", "era": "6G", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-126-10.8.1-a006", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 6, "source": {"minutes_version": 20, "para": 4717}, "summary_zh": null, "tags": [], "text_en": "For Rel-20 6G ISAC evaluation on SAC, for Scope 1, the following sensing measurement/results and corresponding performance metrics are considered:\nDelay/Doppler/angle/power/phase related information of the ISAC channel\nPerformance metric:\nRMSE of delay of the path(s) used to assist communication\nRMSE of Doppler the path(s) used to assist communication\nRMSE of angles (one or more of AOD, ZOD, AOA, ZOA) of the path(s) used to assist communication\nRMSE of power of the path(s) used to assist communication\nFFS: details on the power of the path(s)\nFFS: RMSE of phase of the path(s) used to assist communication\nCompanies to report how to select the path(s), how to derive RMSE from multiple paths and how such sensing measurement/result of the paths(s) is able to assist communication\nNote: when evaluated, companies are not required to report every metric\nEnrivonment (large surface, wall) that reconstructed by sensing\nPerformance metric:\nMean value of absolute perpendicular distance from the sensed specular reflection point to the ground-truth plane\nMean value of absolute perpendicular distance from the ground truth specular reflection point to the reconstructed plane\nNote: when evaluated, companies are not required to report every metric\nEO type-2 should be modeled in the simulation in this case\nCompanies are not required to evaluate and report every sensing measurement/result.\nNote: In Scope 1, the performance metrics for detecting object for the purpose of SAC are the same as those for object detection and/or tracking, and thus already included in Rel-20 6G ISAC object detection and/or tracking study.\nNote 2: How to draw conclusion/observation is a separate discussion.", "wg": "RAN1"}, {"agenda_item": "10.8.1", "agenda_title": "Evaluations", "content_hash": "sha256:e64a77043c570a0e2cc4020ec9da9c8579303cec600d2db0eaa2875478b6175f", "depth": "full", "era": "6G", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-126-10.8.1-a007", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 7, "source": {"minutes_version": 20, "para": 4738}, "summary_zh": null, "tags": [], "text_en": "For Rel-20 6G ISAC evaluation on SAC, for evaluation assumptions, the evaluation assumptions of baseline cases/combinations of object detection and/or tracking are reused as starting point. In addition, one or more of the following adjustment may be considered:\nDropping of sensing target is optional\nIn case reconstruction of enrivonment (large surface, wall that modeled by EO type-2) is evaluated, additional sensing capable UEs can be dropped for reconstructing environment\nOther adjustment is not precluded\nCompanies should report the adjustments (if any) with necessary details when reporting simulation results.", "wg": "RAN1"}, {"agenda_item": "10.8.1", "agenda_title": "Evaluations", "content_hash": "sha256:acc6ed84f428a7a6464fb21ddebf8a16305262248baea6f53046f97faa973f37", "depth": "full", "era": "6G", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-126-10.8.1-a008", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 8, "source": {"minutes_version": 20, "para": 4744}, "summary_zh": null, "tags": [], "text_en": "Templates (excel files) in R1-2606863 are adopted to collect evaluation results of object detection and/or tracking in AI 10.8.1.\nAdditional tdoc file(s) will also be used to collect companies input in details, which may include but not limited to:\nDetails on sensing RS/resource\nDetails on method/algorithm for detection\nDetails on method/algorithm for tracking\nDetails on inter-site/intra-site interference modelling, if modelled\nDetails on method/algorithm to select sensing STx-SRx pair(s)\nDetails on method/algorithm to obtain the jointly fused object(s) from detected objects of multiple sensing nodes/pairs, if data fusion is applied\nDetails on the sensing capable UE dropping\nNote: Further revision is not precluded, depending on future discussion\nR1-2606863\tResult collection templates for object detection and/or tracking\t\tModerator (CATT)\nR1-2605744\tModerator summary #3 on ISAC evaluations\tModerator (CATT)\nR1-2605745\tModerator summary #4 on ISAC evaluations\tModerator (CATT)", "wg": "RAN1"}, {"agenda_item": "10.8.1", "agenda_title": "Evaluations", "content_hash": "sha256:6f49a66c62da507d3e06926cac15cae56df197505a61608213716cbb7dfd0184", "depth": "full", "era": "6G", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-126-10.8.1-c001", "impact": null, "kind": "conclusion", "llm_status": "pending", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 1, "source": {"minutes_version": 20, "para": 4665}, "summary_zh": null, "tags": [], "text_en": "No consensus to introduce UAV-UE as sensing capable UE in the baseline case/combination of sensing UAV in Rel-20.", "wg": "RAN1"}, {"agenda_item": "10.8.1", "agenda_title": "Evaluations", "content_hash": "sha256:fb6f945cce7ea39b5798fcd940b17ffd26e1dbc6a690933236e0dffc16016b8b", "depth": "full", "era": "6G", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-126-10.8.1-c002", "impact": null, "kind": "conclusion", "llm_status": "pending", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 2, "source": {"minutes_version": 20, "para": 4667}, "summary_zh": null, "tags": [], "text_en": "No consensus to remove CPE UE in Indoor-office (Indoor Hotspot) for the baseline case/combination of sensing Human in Rel-20.", "wg": "RAN1"}, {"agenda_item": "10.8.1", "agenda_title": "Evaluations", "content_hash": "sha256:67cbc1ee3a17372cf2c606bd3fcc3c5a686d4ccc4792e76d6dcd7ea39950f17a", "depth": "full", "era": "6G", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-126-10.8.1-c003", "impact": null, "kind": "conclusion", "llm_status": "pending", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 3, "source": {"minutes_version": 20, "para": 4669}, "summary_zh": null, "tags": [], "text_en": "For Rel-20 6G ISAC performance evaluation, for baseline cases/combinations, it is clarified that ‘convex hull’ refers to ‘convex hull of the TRP deployment’ in Indoor Hotspot (Indoor office) and Indoor Factory evaluation assumptions.", "wg": "RAN1"}, {"agenda_item": "10.8.1", "agenda_title": "Evaluations", "content_hash": "sha256:8314ca7794f8d51cefdfec4b0dfe9b444b478b2175124aeabdb0d783ca43a471", "depth": "full", "era": "6G", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-126-10.8.1-c004", "impact": null, "kind": "conclusion", "llm_status": "pending", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 4, "source": {"minutes_version": 20, "para": 4671}, "summary_zh": null, "tags": [], "text_en": "For Rel-20 6G ISAC performance evaluation of object detection and/or tracking, for baseline cases/combinations, it is clarified that the scenario Indoor Hotspot (Indoor-office) for sensing Human is ‘open office’, but not ‘mixed office’, as defined in TR 38.901.", "wg": "RAN1"}, {"agenda_item": "10.8.1", "agenda_title": "Evaluations", "content_hash": "sha256:751b969aa4d018a6ae49d93a2272d1632af86a0c653cf5de3a1683a2f5c7b2fb", "depth": "full", "era": "6G", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-126-10.8.1-c005", "impact": null, "kind": "conclusion", "llm_status": "pending", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 5, "source": {"minutes_version": 20, "para": 4673}, "summary_zh": null, "tags": [], "text_en": "No consensus to remove CPE UE in Indoor Factory for the baseline case/combination of sensing AGV in Rel-20.", "wg": "RAN1"}, {"agenda_item": "10.8.1", "agenda_title": "Evaluations", "content_hash": "sha256:a314279cb0e64897f06d1c1ec34cb7959b4b96491556cdd704eaa74ccd431440", "depth": "full", "era": "6G", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-126-10.8.1-c006", "impact": null, "kind": "conclusion", "llm_status": "pending", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 6, "source": {"minutes_version": 20, "para": 4675}, "summary_zh": null, "tags": [], "text_en": "No consensus to introduce AGV-UE as sensing capable UE in the baseline case/combination of sensing AGV in Rel-20.", "wg": "RAN1"}, {"agenda_item": "10.8.2", "agenda_title": "Aspects of integration with communication", "content_hash": "sha256:f162bdbfa2cff6c275d4ea90e88397d4fcb8bf157a651aad6478c0c3b465e6f3", "depth": "full", "era": "6G", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-126-10.8.2-a001", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 1, "source": {"minutes_version": 20, "para": 4830}, "summary_zh": null, "tags": [], "text_en": "In addition to theoretical characteristics analysis, companies are encouraged to do at least one of followings to evaluate RE pattern of sensing RS in 10.8.2\nFull SLS with or without cooperative sensing as 10.8.1 (Option 1 from RAN1#125) for sensing performance evaluation\nSLS with non-cooperative sensing (i.e., no fusion) (Option 2 from RAN1#125) at least for sensing measurement performance evaluation\nLOS condition is always assumed for each STX-target-SRX link\nSimplified SLS with single STX and single SRX (Option 3 from RAN1#125) at least for sensing measurement performance evaluation\nLOS condition is always assumed for each STX-target-SRX link\nNote: detailed modelling is up to company report", "wg": "RAN1"}, {"agenda_item": "10.8.2", "agenda_title": "Aspects of integration with communication", "content_hash": "sha256:1957ea8bae03a36cf0af6638721c9c21ac840189411af4274ad68de19a5cf190", "depth": "full", "era": "6G", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-126-10.8.2-a002", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 2, "source": {"minutes_version": 20, "para": 4838}, "summary_zh": null, "tags": [], "text_en": "Study on a sensing RS resource consisting of one or multiple component RS.\nStudy the following options for component RS\nComponent RS can be RS for communication is reused for sensing\nComponent RS can be enhanced RS for sensing, taking reuse of RS for communication as starting point\nComponent RS can be dedicated RS for sensing\nNote: The multiple component RS of a sensing RS resource can be of single or multiple RS types.\nCompanies to provide necessity, theoretical analysis, performance evaluation and specification impacts on the above options and the sensing RS resource in next RAN1 meetings.\nNote: RE pattern of the sensing RS resource is union set of all REs of all component RS\nFFS: details of component RS", "wg": "RAN1"}, {"agenda_item": "10.8.2", "agenda_title": "Aspects of integration with communication", "content_hash": "sha256:1bb1b16516b6055ed4e3e50d2225c6ed7fc7c20c4ba4b45133f27b7a952c4b88", "depth": "full", "era": "6G", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-126-10.8.2-a003", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 3, "source": {"minutes_version": 20, "para": 4848}, "summary_zh": null, "tags": [], "text_en": "Study the following two options to generate a sensing RS resource\nOption 1: A sensing RS resource has single antenna port, which can be precoded or non-precoded\nOption 2: A sensing RS resource can have multiple antenna ports, which can be precoded or non-precoded\nCompanies to provide necessity, theoretical analysis, performance evaluation and specification impacts on the above options in next RAN1 meetings.\nFFS impact on measurement reporting and assistance information\nR1-2605587\tSummary #3 on integration with communication for ISAC\tModerator (Xiaomi)", "wg": "RAN1"}, {"agenda_item": "10.8.2", "agenda_title": "Aspects of integration with communication", "content_hash": "sha256:2b7d5268e391316e86de59b748690afacb97200891575e816dbce254fc3b76dc", "depth": "full", "era": "6G", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-126-10.8.2-a004", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 4, "source": {"minutes_version": 20, "para": 4857}, "summary_zh": null, "tags": [], "text_en": "The following metrics for a path are to be studied in 6G ISAC\nDelay information defined per path\nOption 1: Receive time difference between a path and a reference path, e.g., RSTD like\nOption 2: Receive time difference between a path and a reference time, e.g., RTOA like\nFFS reference time\nOption 3: Receive time of a path minus a transmission time, e.g., Rx-Tx time difference like\nFFS transmission time\nDoppler information defined per path\nFFS absolute or relative/differential Doppler information\nAngle information defined per path\nFFS absolute or relative/differential angle information, implicit/indirect angle information\nFFS how to derive angle\nRSRP/SINR/amplitude/phase defined per path\nFFS how to derive phase\nQuality/uncertainty/confidence defined per path\nFFS ambiguity handling of delay/Doppler/angle of a path\nFurther discuss the additional metrics for a path\nMicro-Doppler\nRCS\nAssociation among paths\nOther metrics are not precluded\nFFS reference path\nFFS definition of path\nNote: the necessity, applicable sensing modes, achievable sensing performance, reporting aspects (e.g., overhead) of above metrics can be discussed separately", "wg": "RAN1"}, {"agenda_item": "10.8.2", "agenda_title": "Aspects of integration with communication", "content_hash": "sha256:02ee8cbe539585047b4149d808438f27b6eeebc1c1bf28a58a9251a4aff599ab", "depth": "full", "era": "6G", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-126-10.8.2-a005", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 5, "source": {"minutes_version": 20, "para": 4882}, "summary_zh": null, "tags": [], "text_en": "The following metrics of a scattering point or an object are to be studied in 6G ISAC from RAN1 perspective\n3D or 2D location\nOption1: Absolute location\nOption2: Relative location referred to a reference location\nFFS reference location\n3D or 2D velocity\nOption1: Measured true 3D/2D velocity\nOption2: Scalar of radial velocity\nUncertainty/confidence\nassociation of measurements of a scattering point/object\nFFS ambiguity handling of delay/Doppler/angle of a scattering point\nFurther discuss the additional metrics for a scattering point/object\nPower related information if applicable, e.g., RCS\nMicro-Doppler\nOther metrics are not precluded\nFFS definition of scattering point/object\nNote: the necessity, applicable sensing modes, and achievable sensing performance, reporting aspects (e.g., overhead) of above metrics can be discussed separately\nR1-2605588\tSummary #4 on integration with communication for ISAC\tModerator (Xiaomi)", "wg": "RAN1"}, {"agenda_item": "10.8.2", "agenda_title": "Aspects of integration with communication", "content_hash": "sha256:912f2bc0035399876b1108dc6468b257a71f525482abad4ca9f97f3171931423", "depth": "full", "era": "6G", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-126-10.8.2-a006", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 6, "source": {"minutes_version": 20, "para": 4901}, "summary_zh": null, "tags": [], "text_en": "The metrics of consecutive samples in delay/Doppler/angle profiles are to be studied in 6G ISAC\nFFS: whether/how to apply window(s) of consecutive samples in delay/Doppler/angle profile\nNote: the necessity, applicable sensing modes, and achievable sensing performance, reporting aspects (e.g., overhead) of above metrics can be discussed separately\nR1-2605589\tSummary #5 on integration with communication for ISAC\tModerator (Xiaomi)\nFinal post-meeting summary for this agenda item.", "wg": "RAN1"}, {"agenda_item": "10.8.2", "agenda_title": "Aspects of integration with communication", "content_hash": "sha256:8430b804f65b59c5fa9a5180423a6e681620918cdca08046ce59882f62bcc6b1", "depth": "full", "era": "6G", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-126-10.8.2-c001", "impact": null, "kind": "conclusion", "llm_status": "pending", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 1, "source": {"minutes_version": 20, "para": 4855}, "summary_zh": null, "tags": [], "text_en": "On UE-side measurement report, measurement Level A from NR ISAC is not considered for 6G ISAC study in Rel-20.", "wg": "RAN1"}, {"agenda_item": "10.8.2", "agenda_title": "Aspects of integration with communication", "content_hash": "sha256:9924e8d508e32af9bc73a13e9051ee8572dbd3597265fa9c8e7eb1df910db7fd", "depth": "full", "era": "6G", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-126-10.8.2-w001", "impact": null, "kind": "working_assumption", "llm_status": "pending", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 1, "source": {"minutes_version": 20, "para": 4823}, "summary_zh": null, "tags": [], "text_en": "The following representative use cases for sensing assisted communication is/are selected for study in Rel-20 ISAC\nSensing assisted beam management\n[Sensing assisted CSI acquisition and reporting]\nNote: companies can also study other use cases for sensing assisted communication\nNote: In AI10.8, physical layer design discussions are limited to sensing related aspects\nR1-2605586\tSummary #2 on integration with communication for ISAC\tModerator (Xiaomi)", "wg": "RAN1"}, {"agenda_item": "10.8.3", "agenda_title": "Waveform and frame structure", "content_hash": "sha256:47c5721b79d627c6619d0e9bae8c1e90b3a89421de43de249a6d095e1bc78377", "depth": "full", "era": "6G", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-126-10.8.3-a001", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 1, "source": {"minutes_version": 20, "para": 4964}, "summary_zh": null, "tags": [], "text_en": "The following options are further studied for RS sequence enhancement for sensing based on ZC sequence based on CP-OFDM.\nOpt. 1 ZC sequence optimization\nOpt. 2 Frequency domain quadratic-phase RS sequence .\nFFS: details of B, C, D\nFFS: A as constant or whether/how to define A as function of m\nNote: intention of A(m) here is different from FDSS\n[Opt. 3 Time domain RS sequence generation based on transform precoding]\nOpt. 4 Time domain spanning ZC sequence across OFDM symbols\nRS sequence enhancement should identify:\nthe benefits/drawbacks based on comprehensive comparison with NR Gold sequence for TRP transmission and NR ZC sequence for UE transmission as benchmark for evaluation\napplicability/necessity to TRP-transmission based sensing\napplicability/necessity to UE-transmission based sensing\nDiscussion on the other solutions will continue.", "wg": "RAN1"}, {"agenda_item": "10.8.3", "agenda_title": "Waveform and frame structure", "content_hash": "sha256:5beb188e4a3703f8c4459447f67326e180f1aa07b965f3461d987e78ec76efa2", "depth": "full", "era": "6G", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-126-10.8.3-a002", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 2, "source": {"minutes_version": 20, "para": 4978}, "summary_zh": null, "tags": [], "text_en": "The following options are further studied for RS enhancement for sensing based on Gold sequence based on CP-OFDM.\nGold sequence optimization (e.g., initialization)\nGold sequence modulated by pi/2 BPSK with transform precoding for UE transmission\nGold sequence modulated by pi/2 BPSK for CP-OFDM\nTime domain spanning Gold sequence across OFDM symbols\nRS sequence enhancement should identify:\nthe benefits/drawbacks based on comprehensive comparison with NR Gold sequence for TRP transmission and NR ZC sequence for UE transmission as benchmark for evaluation\napplicability/necessity to TRP-transmission and/or UE-transmission based sensing\nOther solutions are not precluded.", "wg": "RAN1"}, {"agenda_item": "10.8.3", "agenda_title": "Waveform and frame structure", "content_hash": "sha256:7ef6f1efdbbc0a35ae80c3db0e9dc7fd845d5fbbb34f1b5c0dc83c19fdca6bb8", "depth": "full", "era": "6G", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-126-10.8.3-a003", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 3, "source": {"minutes_version": 20, "para": 4988}, "summary_zh": null, "tags": [], "text_en": "For effective CP length extension for sensing, further study the necessity (including whether implementation based solution can solve the issue or not) and the following candidate solutions.\nTransmission of successive N OFDM symbols that carries sensing RS\nFFS: details of generation method\nFFS: value N\nFreq. domain comb pattern for sensing RS\nFFS: details of generation method including comb size\nFFS: combination of successive N OFDM symbols and freq. comb pattern\nTime gap after/before/within OFDM symbol carrying sensing RS, without changing OFDM symbol duration/structure of 6GR communication design\nFFS: location of the time gap\nFFS: duration of the time gap\nFFS: benefits/drawbacks/spec impact\nFFS: applicable sensing mode and scenario\nFFS: supported excess delay\nFFS: other solutions are not precluded\nR1-2606565\tSummary #3 on waveform and frame structure for 6G ISAC\tModerator (LGE)", "wg": "RAN1"}, {"agenda_item": "10.8.3", "agenda_title": "Waveform and frame structure", "content_hash": "sha256:34496281efccae9940e497936cd90fc77cce1cc5b85510f47a67fba30c542d27", "depth": "full", "era": "6G", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-126-10.8.3-a004", "impact": null, "kind": "agreement", "llm_status": "pending", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 4, "source": {"minutes_version": 20, "para": 5038}, "summary_zh": null, "tags": [], "text_en": "Peak-to-Sidelobe Ratio (PSLR), Integrated Sidelobe Ratio (ISLR), and Main lobe width are defined based on AF as follows.\nDefinition of power\nOpt 1. Power is defined in delay-Doppler domain\nOpt 2. Power is defined in delay domain with zero or non-zero Doppler cut\nMain lobe width is defined as the width of AF measured at the points where the power drops to half (-3 dB) of the peak main lobe power (3dB width).\nMain lobe region (M) is the region corresponding to the first ‘null-to-null’ region from the main lobe.\nSide lobe region (S) is defined as the entire region except the first ‘null-to-null’ region from the main lobe\n, where PML=maximum power within the main lobe region, PSL=maximum power within the sided lobe region\nOpt 1.  ,\nOpt 2.  ,\n, where IML=power integrated within the main lobe region, ISL=power integrated within the sided lobe region\nOpt 1. ,\nOpt 2. ,\nR1-2606566\tSummary #4 on waveform and frame structure for 6G ISAC\tModerator (LGE)\nR1-2606567\tSummary #5 on waveform and frame structure for 6G ISAC\tModerator (LGE)\nFinal post-meeting summary for this agenda item.", "wg": "RAN1"}, {"agenda_item": "10.8.3", "agenda_title": "Waveform and frame structure", "content_hash": "sha256:dd7d7981b5dab6276519cec6786c53f8e478360f7479a68898c2b2ad3d68a663", "depth": "full", "era": "6G", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-126-10.8.3-w001", "impact": null, "kind": "working_assumption", "llm_status": "pending", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 1, "source": {"minutes_version": 20, "para": 5004}, "summary_zh": null, "tags": [], "text_en": "Linear Ambiguity Function (AF) is defined as:\nOpt 1.  in delay-Doppler domain\nwhere  is the delay shift,  is the Doppler frequency,  is the sampling interval\nOpt 2.  in delay-Doppler domain,\nwhere  is the delay shift,  is the Doppler frequency,  is the sampling interval, ,  is the number of samples in CP, N is the number of samples in OFDM symbol without CP, M is the number of OFDM symbols.\nCircular Ambiguity Function (AF) is defined as:\nOpt 1.  in delay-Doppler domain,\nwhere  is the delay shift,  is the Doppler frequency,  is the sampling interval, N is the number of samples in OFDM symbol without CP\nOpt 2a.\nwhere p is Doppler index,  is delay index, ,  is the number of samples in CP, N is the number of samples in OFDM symbol without CP, M is the number of OFDM symbols, X is the spectrum of x.\nOpt 2b.  in delay-Doppler domain,\nwhere  is the delay shift,  is the Doppler frequency,  is the sampling interval, ,  is the number of samples in CP, N is the number of samples in OFDM symbol without CP, M is the number of OFDM symbols.\nOpt 3.  in delay domain of single symbol\nwhere  is the delay shift,  is the Doppler frequency,  is the sampling interval, N is the number of samples in OFDM symbol without CP, x’ is the received signal\nNote: down-selection on Linear/Circular AF and options for evaluation will be discussed separately.\nNote: companies should report assumption about receiver processing and observation window.", "wg": "RAN1"}, {"agenda_item": "10.8.3", "agenda_title": "Waveform and frame structure", "content_hash": "sha256:dc3146b86b06524e8533aca484fdd48dca841ae01354dd7a6fe8b8a618a5be54", "depth": "full", "era": "6G", "feature": "isac", "first_seen": "2026-10-08", "id": "RAN1-126-10.8.3-w002", "impact": null, "kind": "working_assumption", "llm_status": "pending", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-20", "seq": 2, "source": {"minutes_version": 20, "para": 5021}, "summary_zh": null, "tags": [], "text_en": "Linear Cross Ambiguity Function(CAF) is defined as:\nOpt 1.  in delay-Doppler domain,\nwhere  is the delay shift,  is the Doppler frequency,  is the sampling interval\nOpt 2.  in delay-Doppler domain,\nwhere  is the delay shift,  is the Doppler frequency,  is the sampling interval, ,  is the number of samples in CP, N is the number of samples in OFDM symbol without CP, M is the number of OFDM symbols.\nCircular Cross Ambiguity Function(CAF) is defined as:\nOpt 1.  in delay-Doppler domain,\nwhere  is the integer delay shift,  is the Doppler frequency,  is the sampling interval, N is the number of samples in OFDM symbol without CP\nOpt 2a.   in delay-Doppler domain,\nwhere p is Doppler index,  is delay index, ,  is the number of samples in CP, N is the number of samples in OFDM symbol without CP, M is the number of OFDM symbols, X and Y are the spectrums of x and y respectively.\nOpt 2b.  in delay-Doppler domain,\nwhere  is the delay shift,  is the Doppler frequency,  is the sampling interval, ,  is the number of samples in CP, N is the number of samples in OFDM symbol without CP, M is the number of OFDM symbols.\nOpt 3.  in delay domain of single symbol\nwhere  is the delay shift,  is the Doppler frequency,  is the sampling interval, N is the number of samples in OFDM symbol without CP, y’ is the received signal\nNote: down-selection on Linear/Circular CAF and options for evaluation will be discussed separately.\nNote: companies should report assumption about receiver processing and observation window.", "wg": "RAN1"}, {"agenda_item": "8.1", "agenda_title": "Maintenance on AI/ML for NR Air interface, NR MIMO Phase 5,  NES and NTN for NR and IoT", "content_hash": "sha256:b4e6cc0de7bed9bbcc95875f13ab2001e520e9edad2f5b56341fb6fdd02efd6f", "depth": "origin", "era": "5G-A", "feature": "ai_air_interface", "first_seen": "2026-10-08", "id": "RAN1-126-8.1-a001", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 1, "source": {"minutes_version": 20, "para": 380}, "summary_zh": null, "tags": [], "text_en": "The following TP for TS 38.214 Clause 5.2.1.6 is endorsed.\nThe corresponding CR for Rel-19, TS 38.214 in R1-2606870 (revised in R1-2606932) is agreed.\n(Rel-19, TS38.214, NR_AIML_air-Core, CR 0769r2, Cat F)\n| Reason for change | Incorrectly capture of previous agreement. |\n| --- | --- |\n| Summary of change | To align with the agreement made in RAN1#122, remove “consecutive” from CPU occupancy duration for SP CSI-PAI report. |\n| Consequences if not approved | The current specification would contain an inaccurate description of CPU occupancy duration for SP CSI-PAI report. |\n| 5.2.1.6 CSI processing criteria ============================= unchanged parts are omitted ============================ For a CSI report with CSI-ReportConfig with higher layer parameter reportQuantity not set to 'none', or a CSI report with LTM-CSI-ReportConfig, or reportQuantity not set to 'none-bm-r19' or 'none-csi-r19', the CPU(s) (including and/or , for CSI reports with reportQuantity set to 'p-cri-r19', 'p-cri-RSRP-r19', 'p-ssb-index-r19', or 'p-ssb-index-RSRP-r19', and CSI reports configured with the higher layer parameter csi-InferencePrediction-r19, and for CSI report with reportQuantity set to 'rs-pai-r19' or 'csi-pai-r19') are occupied for a number of OFDM symbols as follows: - A periodic or semi-persistent CSI report (excluding an initial semi-persistent CSI report on PUSCH after the PDCCH triggering the report, a semi-persistent CSI report on PUSCH configured with reportQuantity set to 'csi-pai-r19', and a semi-persistent CSI report on PUSCH configured with the higher layer parameter codebookType set to 'typeII-Doppler-r18' or 'typeII-Doppler-PortSelection-r18') occupies CPU(s) from the first symbol of the earliest one of each CSI-RS/CSI-IM/SSB resource, or each CSI-RS/CSI-IM resource associated with all configured sub-configurations for periodic CSI report corresponding to a CSI-ReportConfig that contains a list of sub-configurations provided by csi-ReportSubConfigToAddModList, or each CSI-RS/CSI-IM resource associated with all activated/triggered sub-configurations for semi-persistent CSI report corresponding to a CSI-ReportConfig that contains a list of sub-configurations provided by csi-ReportSubConfigToAddModList, for channel or interference measurement, respective latest CSI-RS/CSI-IM/SSB occasion no later than the corresponding CSI reference resource, until the last symbol of the configured PUSCH/PUCCH carrying the report. - An aperiodic CSI report occupies CPU(s) from the first symbol after the PDCCH triggering the CSI report until the last symbol of the scheduled PUSCH carrying the report. When the PDCCH reception includes two PDCCH candidates from two respective search space sets, as described in clause 10.1 of [6, TS 38.213], for the purpose of determining the CPU occupation duration, the PDCCH candidate that ends later in time is used. - An initial semi-persistent CSI report on PUSCH after the PDCCH trigger occupies CPU(s) from the first symbol after the PDCCH until the last symbol of the scheduled PUSCH carrying the report. When the PDCCH reception includes two PDCCH candidates from two respective search space sets, as described in clause 10.1 of [6, TS 38.213], for the purpose of determining the CPU occupation duration, the PDCCH candidate that ends later in time is used. - A semi-persistent CSI report on PUSCH configured with the higher layer parameter codebookType set to 'typeII-Doppler-r18' or 'typeII-Doppler-PortSelection-r18' occupies CPU(s) from the first symbol of KP-th latest consecutive periodic/semi-persistent CSI-RS occasions no later than CSI reference resource, until the last symbol of the PUSCH carrying the report, where the value of is indicated by UE capability. - A semi-persistent CSI report on PUSCH configured with reportQuantity set to 'csi-pai-r19' occupies CPU(s) from the first symbol of the latest consecutive periodic/semi-persistent CSI-RS occasion of a corresponding linked CSI report (linked by inferenceReportConfigId-r19) no later than CSI reference resource of the linked CSI report, until the last symbol of the PUSCH carrying the CSI-PAI report. ============================= unchanged parts are omitted ============================ |\n| --- |", "wg": "RAN1"}, {"agenda_item": "8.1", "agenda_title": "Maintenance on AI/ML for NR Air interface, NR MIMO Phase 5,  NES and NTN for NR and IoT", "content_hash": "sha256:fa00852b52ecbc723988194551746b10d26180a6a854ab2651e1ba952021b9ed", "depth": "origin", "era": "5G-A", "feature": "ai_air_interface", "first_seen": "2026-10-08", "id": "RAN1-126-8.1-a002", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 2, "source": {"minutes_version": 20, "para": 386}, "summary_zh": null, "tags": [], "text_en": "The following TP for TS 38.214 Clause 5.2.3 is endorsed.\nThe corresponding CR for Rel-19, TS 38.214 in R1-2606870 (revised in R1-2606932) is agreed.\n(Rel-19, TS38.214, NR_AIML_air-Core, CR 0769r1, Cat F)\n| Reason for change | Clause 5.2.3 of TS38.214 explicitly identifies the reportQuantity values for which CSI feedback consists of a single part. Rel-19 AI/ML introduced new report quantities for AI/ML-based CSI report for inference and performance monitoring. But these new quantity values remain unspecified in terms of whether support single part CSI. As a result, it is currently unclear whether AI/ML-based CSI reports support single CSI part. |\n| --- | --- |\n| Summary of change | Adding Rel-19 AI/ML reportQuantity values to clarify that CSI reports for AI/ML support single CSI part. |\n| Consequences if not approved | Ambiguity occurs on whether Rel-19 AI/ML CSI reports support single CSI part or two-part CSI reporting. |\n| 5.2.3 CSI reporting using PUSCH ============================= unchanged parts are omitted ============================ When the higher layer parameter reportQuantity is configured with one of the values 'cri-RSRP', 'ssb-Index-RSRP', 'cri-SINR' or 'ssb-Index-SINR', or 'cri-RSRP-Index', 'ssb-Index-RSRP-Index', 'cri-SINR-Index', 'ssb-Index-SINR-Index', 'tdcp', 'cli-RSSI', 'cli-SRS-RSRP', 'cjtc-Dd', 'cjtc-F', 'cjtc-Dd-F', 'cjtc-P', 'p-CRI-r19', 'p-CRI-RSRP-r19', 'p-SSB-Index-r19', 'p-SSB-Index-RSRP-r19', 'rs-pai-r19', 'csi-pai-r19', the CSI feedback consists of a single part. ============================= unchanged parts are omitted ============================ |\n| --- |\nR1-2606795\tSummary #1 of maintenance on CSI prediction\tModerator (LG Electronics)", "wg": "RAN1"}, {"agenda_item": "8.1", "agenda_title": "Maintenance on AI/ML for NR Air interface, NR MIMO Phase 5,  NES and NTN for NR and IoT", "content_hash": "sha256:4148f144941aab65a76e6484d6e907b3fa3a1736963f18ed00816ada2a10e0fb", "depth": "origin", "era": "5G-A", "feature": "ai_air_interface", "first_seen": "2026-10-08", "id": "RAN1-126-8.1-a003", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 3, "source": {"minutes_version": 20, "para": 393}, "summary_zh": null, "tags": [], "text_en": "The following TP for TS 38.214 Clause 6.2.1.3 is endorsed.\nThe corresponding CR for Rel-19, TS 38.214 Clause 6.2.1.3 in R1-2606870 (revised in R1-2606932) is agreed.\n(Rel-19, TS38.214, NR_AIML_air-Core, CR 0769r1, Cat F)\n| Reason for change | 1. When the collision between the SRS for carrier switching and the CSI report happens, UE should follow a priority rule defined. However, the priority rule for the SRS and CSI-PAI report is unclear. 2. To ensure consistent priority rule for two types of PAI reports, i.e., CSI-PAI report and RS-PAI report. |\n| --- | --- |\n| Summary of change | 1. Reuse the same dropping rule for collision handling between PMI and SRS for the collision handling between CSI-PAI and SRS 2. Revert following agreement made in RAN1#122bis, and apply the same priority rules to collision between RS-PAI and SRS as to collision between CSI-PAI and SRS. |\n| Consequences if not approved | 1. The collision handling between the SRS for carrier switching and the CSI-PAI report is unclear 2. Inconsistency in collision handling between CSI-PAI/SRS and RS-PAI/SRS. |\nAgreement:\nThe following TP for 38.214 Clause 6.2.1.3 is endorsed.\nReason for change: P-CRI/P-SSBRI/RS-PAI/P-L1-RSRP is missing in the prioritization rules between a transmission of SRS and transmission of a physical signal/channel.\nSummary of change: Add P-CRI/P-SSBRI/RS-PAI/P-L1-RSRP in the prioritization rules.\nConsequences if not approved: the prioritization rules between a transmission of SRS and transmission of a physical signal/channel with P-CRI/P-SSBRI/RS-PAI/P-L1-RSRP is unclear.\n6.2.1.3\tUE sounding procedure between component carriers\n\u003comitted text>\nThe following prioritization rules shall be applied in case of collision between a transmission of SRS over carrier  and transmission of a physical signal/channel over a carrier of a serving cell in set\n-\tthe UE shall not transmit SRS whenever SRS transmission (including any interruption due to uplink or downlink RF retuning time [11, TS 38.133] as defined by higher layer parameters switchingTimeUL and switchingTimeDL of SRS-SwitchingTimeNR) on the carrier of the serving cell  and PUSCH/PUCCH transmission carrying HARQ-ACK/positive SR/RI/CRI/SSBRI/P-CRI/P-SSBRI/RS-PAI and/or PRACH on a carrier of a serving cell in set happen to overlap in the same symbol\n-\tthe UE shall not transmit a periodic/semi-persistent SRS whenever periodic/semi-persistent SRS transmission (including any interruption due to uplink or downlink RF retuning time [11, TS 38.133] as defined by higher layer parameters switchingTimeUL and switchingTimeDL of SRS-SwitchingTimeNR) on the carrier of the serving cell  and PUSCH transmission carrying aperiodic CSI on a carrier of a serving cell in set  happen to overlap in the same symbol\n-\tthe UE shall drop PUCCH/PUSCH transmission carrying periodic/semi-persistent CSI comprising only CQI/PMI/L1-RSRP/L1-SINR/P-L1-RSRP, and/or SRS transmission on a carrier of a serving cell in set  configured for PUSCH/PUCCH transmission whenever the transmission and SRS transmission (including any interruption due to uplink or downlink RF retuning time [11, TS 38.133] as defined by higher layer parameters switchingTimeUL and switchingTimeDL of SRS-SwitchingTimeNR) on the carrier of the serving cell  happen to overlap in the same symbol\n-\tthe UE shall drop PUSCH transmission carrying aperiodic CSI comprising only CQI/PMI/L1-RSRP/L1-SINR/TDCP/cjtc-Dd/cjtc-F/cjtc-Dd-F/cjtc-P/P-L1-RSRP on a carrier of a serving cell in set whenever the transmission and aperiodic SRS transmission (including any interruption due to uplink or downlink RF retuning time [11, TS 38.133]) as defined by higher layer parameters switchingTimeUL and switchingTimeDL of SRS-SwitchingTimeNR) on the carrier of the serving cell  happen to overlap in the same symbol.\n\u003comitted text>\n| 6.2.1.3 UE sounding procedure between component carriers ============================= unchanged parts are omitted ============================ The following prioritization rules shall be applied in case of collision between a transmission of SRS over carrier and transmission of a physical signal/channel over a carrier of a serving cell in set - the UE shall not transmit SRS whenever SRS transmission (including any interruption due to uplink or downlink RF retuning time [11, TS 38.133] as defined by higher layer parameters switchingTimeUL and switchingTimeDL of SRS-SwitchingTimeNR) on the carrier of the serving cell and PUSCH/PUCCH transmission carrying HARQ-ACK/positive SR/RI/CRI/SSBRI/UEIRI/P-CRI/P-SSBRI/RS-PAI and/or PRACH on a carrier of a serving cell in set happen to overlap in the same symbol - the UE shall not transmit a periodic/semi-persistent SRS whenever periodic/semi-persistent SRS transmission (including any interruption due to uplink or downlink RF retuning time [11, TS 38.133] as defined by higher layer parameters switchingTimeUL and switchingTimeDL of SRS-SwitchingTimeNR) on the carrier of the serving cell and PUSCH transmission carrying aperiodic CSI on a carrier of a serving cell in set happen to overlap in the same symbol - the UE shall drop PUCCH/PUSCH transmission carrying periodic/semi-persistent CSI comprising only CQI/PMI/L1-RSRP/L1-SINR/P-L1-RSRP/CSI-PAI/RS-PAI and/or Type 1 configured grant PUSCH transmission carrying UE initiated CSI report, and/or SRS transmission on a carrier of a serving cell in set configured for PUSCH/PUCCH transmission whenever the transmission and SRS transmission (including any interruption due to uplink or downlink RF retuning time [11, TS 38.133] as defined by higher layer parameters switchingTimeUL and switchingTimeDL of SRS-SwitchingTimeNR) on the carrier of the serving cell happen to overlap in the same symbol - the UE shall drop PUSCH transmission carrying aperiodic CSI comprising only CQI/PMI/L1-RSRP/L1-SINR/TDCP/cjtc-Dd/cjtc-F/cjtc-Dd-F/cjtc-P/P-L1-RSRP/CSI-PAI/RS-PAI on a carrier of a serving cell in set whenever the transmission and aperiodic SRS transmission (including any interruption due to uplink or downlink RF retuning time [11, TS 38.133]) as defined by higher layer parameters switchingTimeUL and switchingTimeDL of SRS-SwitchingTimeNR) on the carrier of the serving cell happen to overlap in the same symbol. ============================= unchanged parts are omitted ============================ |\n| --- |\nR1-2606835\tSummary #1 of maintenance on CSI prediction\tModerator (LG Electronics)", "wg": "RAN1"}, {"agenda_item": "8.1", "agenda_title": "Maintenance on AI/ML for NR Air interface, NR MIMO Phase 5,  NES and NTN for NR and IoT", "content_hash": "sha256:44f7f4fb9f6470a867aaefe06bd29e3c77b33b13b55c6af1c4d40a616f9dc3c9", "depth": "origin", "era": "5G-A", "feature": "ai_air_interface", "first_seen": "2026-10-08", "id": "RAN1-126-8.1-a004", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 4, "source": {"minutes_version": 20, "para": 400}, "summary_zh": null, "tags": [], "text_en": "The following TP for TS 38.214 Clause 5.1.6.1.2.\nThe corresponding CR for Rel-19, TS 38.214 Clause 5.1.6.1.2 in R1-2606879 (revised in R1-2606922) is agreed.\n(Rel-19, TS 38.214, NR_AIML_air-Core, CR 0770r1, Cat F)\nReason for change: A new RRC IE CSI-LoggedMeasurementConfig is defined in 38.331 for network-side data collection, which is used to configure UE to perform the logging of measurements on CSI-RS resources. For CSI-RS measurement configured by the IE CSI-ReportConfig for L1 CSI report, there are some descriptions and constraints in spec 38.214, which are also needed for CSI-RS measurement configured by the IE CSI-LoggedMeasurementConfig for L3 CSI report.\nSummary of change: Add descriptions and constraints for CSI-RS measurement configured by the IE CSI-LoggedMeasurementConfig (L3 CSI report) in 38.214.\nConsequences if not approved: The descriptions and constraints for CSI-RS measurement configured by the IE CSI-LoggedMeasurementConfig (L3 CSI report) are missing in 38.214.\n| 5.1.6.1.2 CSI-RS for L1-RSRP and L1-SINR computation If a UE is configured with a NZP-CSI-RS-ResourceSet configured with the higher layer parameter repetition set to 'on', the UE may assume that the CSI-RS resources, described in Clause 5.2.2.3.1, within the NZP-CSI-RS-ResourceSet are transmitted with the same downlink spatial domain transmission filter, where the CSI-RS resources in the NZP-CSI-RS-ResourceSet are transmitted in different OFDM symbols. If repetition is set to 'off', the UE shall not assume that the CSI-RS resources within the NZP-CSI-RS-ResourceSet are transmitted with the same downlink spatial domain transmission filter. If the UE is configured with a CSI-ReportConfig with reportQuantity set to 'cri-RSRP', 'cri-SINR', 'cri-RSRP-Index', 'cri-SINR-Index', 'none', 'p-cri-r19', 'p-cri-RSRP-r19', 'p-ssb-index-r19', 'p-ssb-index-RSRP-r19', 'none-bm-r19', or 'rs-pai-r19', and if the CSI-ResourceConfig for channel measurement (higher layer parameters resourcesForChannelMeasurement and resourcesForSetA-r19 when reportQuantity set to 'none-bm-r19') contains a NZP-CSI-RS-ResourceSet that is configured with the higher layer parameter repetition and without the higher layer parameter trs-Info, the UE can only be configured with the same number (1 or 2) of ports with the higher layer parameter nrofPorts for all CSI-RS resources within the set. If the UE is configured with the CSI-RS resource in the same OFDM symbol(s) as an SS/PBCH block, the UE may assume that the CSI-RS and the SS/PBCH block are quasi co-located with 'typeD' if 'typeD' is applicable. Furthermore, the UE shall not expect to be configured with the CSI-RS in PRBs that overlap with those of the SS/PBCH block, and the UE shall expect that the same subcarrier spacing is used for both the CSI-RS and the SS/PBCH block. If the UE is configured with a CSI-LoggedMeasurementConfig, and if the CSI-ResourceConfig for channel measurement (higher layer parameters csi-LoggedResourceConfig) contains a NZP-CSI-RS-ResourceSet that is configured with the higher layer parameter repetition and without the higher layer parameter trs-Info, the UE can only be configured with the same number (1 or 2) of ports with the higher layer parameter nrofPorts for all CSI-RS resources within the set. Each Reporting Setting CSI-LoggedMeasurementConfig is associated with a single downlink BWP (indicated by higher layer parameter BWP-Id) given in the associated CSI-ResourceConfig for channel measurement. \u003comitted texts> |\n| --- |\nMIMO\nR1-2605669\tMaintenance on NR MIMO Phase 5\tOfinno\nR1-2605707\tCorrection on UEIRI information bit in PUCCH for UE-initiated/event-driven beam management\t\t\tCATT\nR1-2605805\tRemaining issues on NR MIMO Phase 5\tSamsung\nR1-2606128\tDraft CR on CJT Calibration Report\tGoogle\nR1-2606129\tDraft CR on CSI-PAI Calibration Report\tGoogle\nR1-2606230\tDraft CR on higher-layers parameter name corrections for TS 38.214\tETRI\nR1-2606809\tModerator Summary #1 on UEI/ED beam management and CSI enhancements\tModerator (ZTE)", "wg": "RAN1"}, {"agenda_item": "8.1", "agenda_title": "Maintenance on AI/ML for NR Air interface, NR MIMO Phase 5,  NES and NTN for NR and IoT", "content_hash": "sha256:dec698a54cf7a196614b176b774600a6c868717be1ea5b806b895bf3dce6e8d3", "depth": "origin", "era": "5G-A", "feature": "ai_air_interface", "first_seen": "2026-10-08", "id": "RAN1-126-8.1-a005", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 5, "source": {"minutes_version": 20, "para": 416}, "summary_zh": null, "tags": [], "text_en": "The following changes for Clause 9.2 in TS 38.213 is endorsed.\nThe corresponding CR for Rel-19, TS 38.213 in R1-2606868 is agreed.\n(Rel-19, TS38.213, NR_MIMO_Ph5-Core, CR 0784, Cat F)\nReason for change: In Rel-19, UEIRI is introduced as a new type of UCI for notifying (ModeA) or requesting a PUSCH resource (ModeB) for UE-initiated/event-driven beam reporting. Whether UE transmits UEIRI on a PUCCH format 0 or format 1 in the PUCCH resource depends on whether the triggering condition of the event(s) for UE-initiated/event-driven beam reporting is met or not. In this case, the information bit of UEIRI is not always included in the PUCCH resource. However, in the current spec, UEIRI is described as a compulsory UCI in the PUCCH resource, which is not correct.\nSummary of change: Add the condition “if any” to the information bit for UEIRI where the contents of UCI bit(s) are described in the first paragraph of Section 9.2, TS38.213.\nConsequences if not approved: The availability of information bit for UEIRI in PUCCH is not correctly stated.\n| 9.2 UCI reporting in physical uplink control channel UCI types reported in a PUCCH include HARQ-ACK information, SR, LRR, UEIRI, and CSI. UCI bits include HARQ-ACK information bits, if any, SR information bits, if any, LRR information bit, if any, UEIRI information bit, if any, and CSI bits, if any. The HARQ-ACK information bits correspond to a HARQ-ACK codebook as described in clause 9.1. For the remaining of this clause, unless stated otherwise in clauses 9.2.4A and 9.2.5.1, any reference to SR is applicable for SR and/or for LRR and/or for UEIRI. \u003cUnchanged parts are omitted> |\n| --- |", "wg": "RAN1"}, {"agenda_item": "8.1", "agenda_title": "Maintenance on AI/ML for NR Air interface, NR MIMO Phase 5,  NES and NTN for NR and IoT", "content_hash": "sha256:dba51b6368389426dcfe0b68b9570e4a542856454f90ca6619b70b678b47e136", "depth": "origin", "era": "5G-A", "feature": "ai_air_interface", "first_seen": "2026-10-08", "id": "RAN1-126-8.1-a006", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 6, "source": {"minutes_version": 20, "para": 424}, "summary_zh": null, "tags": [], "text_en": "The following changes for Clause 9 in TS 38.213 is endorsed.\nThe corresponding CR for Rel-19, TS 38.213 in R1-2606869 is agreed.\n(Rel-19, TS 38.213, NR_MIMO_Ph5-Core, CR 0785, Cat F)\nReason for change:  UE behaviour is unclear for overlapping PUCCH with UEIRI and other channels/signals.\nSummary of change: Reuse the same behaviour as SR for overlapping PUCCH with UEIRI and other channels/signals.\nConsequences if not approved: Unclear UE behaviour.\n| 9 UE procedure for reporting control information \u003cUnchanged parts are omitted> If a UE is configured for NR-DC operation, the UE does not expect to be configured with a PUCCH-SCell. For the remaining of this clause, unless stated otherwise, any reference to SR is applicable for LRR and/or for UEIRI. A PUSCH or a PUCCH transmission other than PUCCH transmissions with SL HARQ-ACK reports, including repetitions if any, can be of priority index 0 or of priority index 1. For a configured grant PUSCH transmission, a UE determines a priority index from phy-PriorityIndex, if provided. For a PUCCH transmission with HARQ-ACK information corresponding to a SPS PDSCH reception or a SPS PDSCH release, a UE determines a priority index from harq-CodebookID, if provided. For a PUCCH transmission with SR, a UE determines the corresponding priority as described in clause 9.2.4. For a PUSCH transmission with semi-persistent CSI report, a UE determines a priority index from a priority indicator field, if provided, in a DCI format that activates the semi-persistent CSI report. If a priority index is not provided to a UE for a PUSCH or a PUCCH transmission other than PUCCH transmissions with SL HARQ-ACK reports, the priority index is 0. \u003cUnchanged parts are omitted> |\n| --- |", "wg": "RAN1"}, {"agenda_item": "8.1", "agenda_title": "Maintenance on AI/ML for NR Air interface, NR MIMO Phase 5,  NES and NTN for NR and IoT", "content_hash": "sha256:d841be18b43e1d6d6b4a824c21e9858ea0fa708c3ec2d3637a3a3456253320f7", "depth": "origin", "era": "5G-A", "feature": "ai_air_interface", "first_seen": "2026-10-08", "id": "RAN1-126-8.1-a007", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 7, "source": {"minutes_version": 20, "para": 432}, "summary_zh": null, "tags": [], "text_en": "The draft CR in R1-2606230 for Rel-19 TS 38.214 is endorsed as alignment CR for TS 38.214.", "wg": "RAN1"}, {"agenda_item": "8.1", "agenda_title": "Maintenance on AI/ML for NR Air interface, NR MIMO Phase 5,  NES and NTN for NR and IoT", "content_hash": "sha256:d6537c6c23f26c38120c5c4990a0800d69cfb403e619fe05b556cbd848946c8b", "depth": "origin", "era": "5G-A", "feature": "ai_air_interface", "first_seen": "2026-10-08", "id": "RAN1-126-8.1-a008", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 8, "source": {"minutes_version": 20, "para": 434}, "summary_zh": null, "tags": [], "text_en": "The draft CR in R1-2606128 for Rel-19 TS 38.215 is endorsed as alignment CR for TS 38.215.\nR1-2606867\tModerator Summary #2 on UEI/ED beam management and CSI enhancements Moderator (ZTE)", "wg": "RAN1"}, {"agenda_item": "8.1", "agenda_title": "Maintenance on AI/ML for NR Air interface, NR MIMO Phase 5,  NES and NTN for NR and IoT", "content_hash": "sha256:a097727d445a3cb16bb9fc6fdd0ea10a7bcd948d2a0e98544c2500879d1a7b9e", "depth": "origin", "era": "5G-A", "feature": "ai_air_interface", "first_seen": "2026-10-08", "id": "RAN1-126-8.1-a009", "impact": null, "kind": "agreement", "llm_status": "skipped_by_depth", "meeting": 126, "meeting_end": null, "meeting_suffix": "", "release": "Rel-19", "seq": 9, "source": {"minutes_version": 20, "para": 449}, "summary_zh": null, "tags": [], "text_en": "The following TP for TS 38.213 Clause 23 is endorsed.\nThe corresponding CR for Rel-19, TS 38.213 in R1-2606872 is agreed.\n(Rel-19, TS 38.213, Netw_Energy_NR_enh-Core, CR 0786, Cat F)\n| Reason for change: After receiving on-demand SIB1, UE may monitor PDCCH in a CSS set with index 0 or in a CORESET with index 0 (e.g., for SIBx/paing/RAR reception). As clarified in RAN2 reply LS R2-2604211, the controlResourceSetZero and searchSpaceZero fields are always absent in SIB1 irrespective of whether SIB1 is provided in an on-demand manner or provided in a periodic manner, so in this case the search space set index 0 or CORESET with index 0 should refer to searchSpaceZero and controlResourceSetZero in OD-SIB1-Config, when for FR1 or for FR2. Summary of Change: Clarify the UE behavior that when for FR1 or for FR2, for PDCCH monitoring in a search space set with index 0 or in a CORESET with index 0, t
